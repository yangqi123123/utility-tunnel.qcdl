<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>系统类型 - 科学岛管廊监控中心</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/tob-ui.css">
  <style>
    .system-type-table .tree-name { display:flex; align-items:center; gap:8px; padding-left:calc(var(--level) * 24px); }
    .system-type-table .tree-toggle { width:18px; border:0; background:transparent; color:var(--primary); cursor:pointer; }
    .system-type-table .tree-toggle.is-leaf { visibility:hidden; }
    .system-type-table tr[hidden] { display:none; }
    .system-type-table .system-code { color:var(--muted); font-family:Consolas,monospace; }
    .system-type-table .table-action { margin-right:12px; }
    .system-type-empty { padding:32px; text-align:center; color:var(--muted); }
    .system-image-upload { position:relative; }
    .system-image-upload input[type=file] { position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; }
    .system-image-preview { width:160px; height:96px; object-fit:cover; border:1px solid var(--line); border-radius:4px; background:#f5f7fc; }
    .system-image-hint { color:var(--muted); font-size:12px; }
    .system-detail-image { max-width:100%; width:320px; max-height:180px; object-fit:contain; border:1px solid var(--line); border-radius:4px; background:#f5f7fc; }
    .system-type-filter-row { grid-template-columns: minmax(280px, 1fr) minmax(220px, 1fr) auto auto; }
    /* 系统类型固定为一级：隐藏新增入口（列表工具栏新增 + 行内新增子系统）；删除此规则即可恢复。 */
    .btn[data-action="create"], .table-action[data-action="add"] { display:none; }
    /* 系统类型固定为一级，无上级系统，隐藏「上级系统」字段；删除此规则即可恢复。 */
    .form-field.system-parent-field { display:none; }
  </style>
</head>
<body class="menu-page" data-menu-key="config.system-type" data-page-section="设备管理" data-page-title="系统类型">
  <div class="app-shell">
    <aside id="app-sidebar" class="sidebar"></aside>
    <header id="app-header" class="header"></header>
    <main class="main">
      <div class="screen-frame stack">
        <section class="page-head"><div><h1 class="page-title">系统类型</h1><p class="page-desc">维护项目系统及其子系统分类。</p></div></section>
        <section class="card filters menu-filters"><div class="filter-actions system-type-filter-row"><label class="form-field"><span class="form-label">系统名称</span><input class="form-control" data-filter="name" placeholder="请输入"></label><label class="form-field"><span class="form-label">系统编号</span><input class="form-control" data-filter="code" placeholder="请输入"></label><button class="btn btn-secondary" data-action="reset">重置</button><button class="btn btn-primary" data-action="search">搜索</button></div></section>
        <section class="card menu-list-card"><div class="card-title-row menu-toolbar"><div><h2 class="card-title">系统类型列表</h2><span class="panel-helper">系统类型固定为一级，不支持新增子系统</span></div><button class="btn btn-primary" data-action="create"><i class="fa-solid fa-plus"></i> 新增</button></div><div class="table-wrap"><table class="table system-type-table"><thead><tr><th>系统名称</th><th>系统编号</th><th>显示排序</th><th>系统简介</th><th>操作</th></tr></thead><tbody id="systemTypeTable"></tbody></table></div></section>
      </div>
    </main>
  </div>
  <script src="../../../app/config/menu.js?v=nav-hide-1"></script>
  <script src="../../../app/data/system-types.js"></script>
  <script src="../../../app/components/sidebar.js?v=nav-home-1"></script>
  <script src="../../../app/components/header.js?v=nav-home-1"></script>
  <script src="../../../app/components/drawer.js"></script>
  <script src="../../../app/components/requirement.js"></script>
  <script>
    const systems = (window.APP_SYSTEM_TYPES || []).map((item) => ({ ...item }));
    const table = document.getElementById("systemTypeTable");
    const collapsed = new Set();
    const esc = (value) => String(value ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;");
    const attr = (value) => esc(value).replaceAll("'", "&#39;");
    const childrenOf = (id) => systems.some((item) => item.parent === id);
    const depthOf = (item) => { let depth = 0; let parent = systems.find((entry) => entry.id === item.parent); while (parent) { depth += 1; parent = systems.find((entry) => entry.id === parent.parent); } return depth; };
    const isHidden = (item) => { let parent = item.parent; while (parent) { if (collapsed.has(parent)) return true; parent = systems.find((entry) => entry.id === parent)?.parent; } return false; };
    function visibleRows(list) { return list.filter((item) => !item.parent || list.some((parent) => parent.id === item.parent)).slice().sort((a, b) => (a.sort - b.sort) || (a.id - b.id)); }
    function render(list = systems) {
      if (!list.length) { table.innerHTML = '<tr><td colspan="5" class="system-type-empty">暂无系统类型</td></tr>'; return; }
      table.innerHTML = visibleRows(list).map((item) => { const expanded = !collapsed.has(item.id); const depth = depthOf(item); return `<tr data-id="${item.id}" data-parent="${item.parent || ""}"${isHidden(item) ? " hidden" : ""}><td><span class="tree-name" style="--level:${depth}"><button class="tree-toggle ${childrenOf(item.id) ? "" : "is-leaf"}" data-toggle="${item.id}" aria-label="展开或收起"><i class="fa-solid fa-caret-${expanded ? "down" : "right"}"></i></button><i class="fa-solid ${depth ? "fa-diagram-project" : "fa-folder"}"></i>${esc(item.name)}</span></td><td class="system-code">${esc(item.code)}</td><td>${item.sort}</td><td>${esc(item.intro)}</td><td><button class="table-action" data-action="detail" data-id="${item.id}">详情</button><button class="table-action" data-action="edit" data-id="${item.id}">编辑</button><button class="table-action" data-action="add" data-id="${item.id}">新增</button><button class="table-action status-danger" data-action="delete" data-id="${item.id}">删除</button></td></tr>`; }).join("");
    }
    function openSystemDrawer(mode, parent, item) {
      const target = item || {};
      const title = mode === "edit" ? "编辑系统类型" : "新增系统类型";
      if (mode === "detail") { const image = target.image ? `<img class="system-detail-image" src="${target.image}" alt="${attr(target.name)}系统图">` : '<span class="info-value system-image-hint">暂无系统图</span>'; const body = `<section class="detail-section"><h3 class="detail-title">系统信息</h3><div class="detail-grid"><div class="info-item"><span class="info-label">系统图</span><span class="info-value">${image}</span></div><div class="info-item"><span class="info-label">系统名称</span><span class="info-value">${esc(target.name)}</span></div><div class="info-item"><span class="info-label">系统编号</span><span class="info-value">${esc(target.code)}</span></div><div class="info-item"><span class="info-label">显示排序</span><span class="info-value">${target.sort}</span></div><div class="info-item"><span class="info-label">系统简介</span><span class="info-value">${esc(target.intro)}</span></div></div></section>`; window.openAppDrawer({ title: "系统类型详情", subtitle: "设备管理 · 系统类型", body, footer: '<button class="btn btn-secondary" data-drawer-close>关闭</button>' }); return; }
      const body = `<label class="form-field form-item system-parent-field"><span class="form-label form-required">上级系统</span><input class="form-control" value="${attr(parent?.name || (target.parent ? systems.find((entry) => entry.id === target.parent)?.name : "根系统"))}" disabled></label><label class="form-field form-item"><span class="form-label form-required">系统名称</span><input class="form-control" data-system-field="name" value="${attr(target.name)}" placeholder="请输入"></label><label class="form-field form-item"><span class="form-label form-required">系统编号</span><input class="form-control" data-system-field="code" value="${attr(target.code)}" placeholder="请输入"></label><label class="form-field form-item"><span class="form-label form-required">显示排序</span><input class="form-control" data-system-field="sort" type="number" min="1" value="${target.sort || 1}" placeholder="请输入"></label><label class="form-field form-item"><span class="form-label form-required">系统简介</span><textarea class="form-control textarea" data-system-field="intro" rows="4" maxlength="200" placeholder="请输入">${esc(target.intro)}</textarea></label><label class="form-field form-item"><span class="form-label">系统图</span><div class="upload-box system-image-upload"><input type="file" data-system-image accept=".jpg,.jpeg,.png,.gif,.webp,.bmp,image/jpeg,image/png,image/gif,image/webp,image/bmp"><i class="fa-solid fa-cloud-arrow-up"></i><p>点击或拖拽文件到此处上传</p><small>支持 JPG、JPEG、PNG、GIF、WEBP、BMP 格式</small><img class="system-image-preview" data-system-image-preview src="${target.image || ""}" alt="系统图预览"${target.image ? "" : " hidden"}></div></label>`;
      window.openAppDrawer({ title, subtitle: "设备管理 · 系统类型", body, footer: '<button class="btn btn-secondary" data-drawer-close>取消</button><button class="btn btn-primary" data-save-system>确认</button>' });
      document.querySelector("[data-system-image]").addEventListener("change", (event) => { const file = event.target.files[0]; if (!file) return; const allowed = ["image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp"]; if (!allowed.includes(file.type)) { event.target.value = ""; window.openAppConfirm({ title: "提示", message: "请选择 JPG、JPEG、PNG、GIF、WEBP 或 BMP 图片。", confirmText: "知道了" }); return; } const reader = new FileReader(); reader.onload = () => { document.querySelector("[data-system-image-preview]").src = reader.result; document.querySelector("[data-system-image-preview]").hidden = false; }; reader.readAsDataURL(file); });
      document.querySelector("[data-save-system]").addEventListener("click", () => { const values = Object.fromEntries(["name", "code", "sort", "intro"].map((key) => [key, document.querySelector(`[data-system-field="${key}"]`).value.trim()])); if (Object.values(values).some((value) => !value)) { window.openAppConfirm({ title: "提示", message: "请填写完整的系统类型信息。", confirmText: "知道了" }); return; } if (values.intro.length > 200) { window.openAppConfirm({ title: "提示", message: "系统简介最多200个字符。", confirmText: "知道了" }); return; } const image = document.querySelector("[data-system-image-preview]").getAttribute("src") || target.image || ""; if (mode === "edit") Object.assign(target, values, { sort: Number(values.sort), image }); else systems.push({ id: Date.now(), ...values, sort: Number(values.sort), image, parent: parent?.id || null }); window.closeAppDrawer(); render(); });
    }
    function filterRows() { const filters = Object.fromEntries([...document.querySelectorAll("[data-filter]")].map((input) => [input.dataset.filter, input.value.trim()])); render(filters.name || filters.code ? systems.filter((item) => (!filters.name || item.name.includes(filters.name)) && (!filters.code || item.code.includes(filters.code))) : systems); }
    render();
    document.addEventListener("click", (event) => { const action = event.target.closest("[data-action]")?.dataset.action; if (action === "create") openSystemDrawer("create"); if (action === "reset") { document.querySelectorAll("[data-filter]").forEach((input) => { input.value = ""; }); render(); } if (action === "search") filterRows(); const toggle = event.target.closest("[data-toggle]"); if (toggle) { const id = Number(toggle.dataset.toggle); if (collapsed.has(id)) collapsed.delete(id); else collapsed.add(id); render(); } if (["detail", "edit", "add", "delete"].includes(action)) { const item = systems.find((entry) => entry.id === Number(event.target.closest("[data-id]").dataset.id)); if (action === "detail") openSystemDrawer("detail", null, item); if (action === "edit") openSystemDrawer("edit", null, item); if (action === "add") openSystemDrawer("create", item); if (action === "delete") { if (childrenOf(item.id)) window.openAppConfirm({ title: "提示", message: "当前系统下存在子级，不允许删除。", confirmText: "知道了" }); else window.openAppConfirm({ title: "提示", message: `确认删除系统「${item.name}」吗？`, onConfirm: () => { systems.splice(systems.indexOf(item), 1); render(); } }); } } });
    document.querySelectorAll("[data-filter]").forEach((input) => input.addEventListener("keydown", (event) => { if (event.key === "Enter") filterRows(); }));
  </script>
</body>
</html>
