<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>通讯日志 - 科学岛管廊监控中心</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/tob-ui.css">
  <link rel="stylesheet" href="../../assets/css/emergency.css">
  <link rel="stylesheet" href="../../assets/css/communication.css">
</head>
<body class="monitoring-page communication-page communication-device-page emergency-page emergency-ledger-page" data-menu-key="communication.logs" data-page-section="通信系统" data-page-title="通讯日志">
  <div class="app-shell">
    <aside id="app-sidebar" class="sidebar"></aside>
    <header id="app-header" class="header"></header>
    <main class="main">
      <div class="screen-frame stack communication-shell">
        <section class="card communication-tab-card">
          <div class="resource-tabs">
            <button class="resource-tab active" type="button" data-log-tab="broadcast">广播日志</button>
            <button class="resource-tab" type="button" data-log-tab="calls">通话记录</button>
          </div>
        </section>

        <div class="resource-panel active" data-log-panel="broadcast">
          <section class="card communication-device-filter">
            <div class="communication-device-filter-grid communication-task-filter-grid">
              <label class="form-field"><span class="form-label">任务名称</span><input class="form-control" data-blog-filter="name" placeholder="请输入"></label>
              <label class="form-field"><span class="form-label">任务类型</span>
                <select class="form-control" data-blog-filter="type">
                  <option value="">请选择</option>
                  <option>服务器音乐</option>
                  <option>HTTP流媒体</option>
                  <option>TTS文本</option>
                </select>
              </label>
              <label class="form-field"><span class="form-label">操作结果</span>
                <select class="form-control" data-blog-filter="result">
                  <option value="">请选择</option>
                  <option>成功</option>
                  <option>失败</option>
                </select>
              </label>
              <div class="communication-device-filter-actions">
                <button class="btn btn-secondary" type="button" data-blog-action="reset">重置</button>
                <button class="btn btn-primary" type="button" data-blog-action="search">搜索</button>
              </div>
            </div>
          </section>
          <section class="card communication-device-list-card">
            <div class="card-title-row device-toolbar">
              <h1 class="card-title">操作日志</h1>
            </div>
            <div class="table-wrap">
              <table class="table device-table communication-device-table">
                <thead>
                  <tr>
                    <th>操作人</th>
                    <th>操作时间</th>
                    <th>操作类型</th>
                    <th>任务ID</th>
                    <th>任务名称</th>
                    <th>任务类型</th>
                    <th>操作结果</th>
                    <th>IP地址</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="broadcastLogBody"></tbody>
              </table>
            </div>
            <div class="pagination"><span>共 <strong id="broadcastLogCount">0</strong> 条记录，每页 10 条</span><span class="page-item active">1</span></div>
          </section>
        </div>

        <div class="resource-panel" data-log-panel="calls">
          <section class="card communication-device-filter">
            <div class="communication-device-filter-grid">
              <label class="form-field"><span class="form-label">事件编号</span><select class="form-control" id="callEventId"><option value="">全部事件</option></select></label>
              <label class="form-field"><span class="form-label">通话类型</span><select class="form-control" id="callType"><option value="">全部类型</option><option>单呼</option><option>群呼</option><option>视频呼叫</option><option>短信</option><option>广播</option></select></label>
              <label class="form-field"><span class="form-label">通话结果</span><select class="form-control" id="callResult"><option value="">全部结果</option><option>已接通</option><option>未接通</option><option>拒接</option><option>超时</option><option>失败</option></select></label>
              <label class="form-field"><span class="form-label">人员</span><input class="form-control" id="callKeyword" type="search" placeholder="姓名"></label>
              <div class="communication-device-filter-actions">
                <button class="btn btn-secondary" type="button" data-call-action="reset">重置</button>
                <button class="btn btn-primary" type="button" data-call-action="filter">搜索</button>
              </div>
            </div>
          </section>
          <section class="card communication-device-list-card">
            <div class="card-title-row device-toolbar">
              <h1 class="card-title">通话记录</h1>
              <div class="btn-row">
                <button class="btn btn-secondary" type="button" data-call-action="sync"><i class="fa-solid fa-arrows-rotate"></i> 同步通话记录</button>
                <button class="btn btn-secondary" type="button" data-call-action="export"><i class="fa-solid fa-file-export"></i> 导出</button>
              </div>
            </div>
            <div class="table-wrap">
              <table class="table device-table communication-device-table emergency-ledger-table" aria-label="通话记录列表">
                <thead>
                  <tr>
                    <th>通话时间</th>
                    <th>事件编号</th>
                    <th>主叫人</th>
                    <th>被叫人</th>
                    <th>通话类型</th>
                    <th>通话结果</th>
                    <th>时长</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="callBody"></tbody>
              </table>
            </div>
            <div class="pagination" id="callCount"></div>
          </section>
        </div>
      </div>
    </main>
  </div>
  <script src="../../../app/config/menu.js?v=comm-c2-2"></script>
  <script src="../../../app/data/emergency-data.js"></script>
  <script src="../../../app/components/sidebar.js?v=nav-home-1"></script>
  <script src="../../../app/components/header.js?v=nav-home-1"></script>
  <script src="../../../app/components/drawer.js"></script>
  <script src="../../../app/components/emergency-common.js"></script>
  <script src="../../../app/components/emergency-calls.js"></script>
  <script src="../../../app/components/requirement.js"></script>
  <script>
    const broadcastLogs = [
      { operator: "admin", time: "2026-09-24 10:12:20", action: "发起播放", id: "T-20260924001", name: "早间消防宣传", type: "服务器音乐", result: "成功", ip: "192.168.1.20" },
      { operator: "物业管理员", time: "2026-09-24 10:02:11", action: "停止任务", id: "T-20260923008", name: "设备检修提示", type: "HTTP流媒体", result: "成功", ip: "192.168.1.21" },
      { operator: "值班员", time: "2026-09-24 09:55:42", action: "发起播报", id: "T-20260924002", name: "午间通知播报", type: "TTS文本", result: "失败", ip: "192.168.1.22" },
    ];
    const esc = (value) => String(value ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;");
    function renderBroadcast(list = broadcastLogs) {
      broadcastLogBody.innerHTML = list.map((x, index) => `<tr>
        <td>${esc(x.operator)}</td><td>${esc(x.time)}</td><td>${esc(x.action)}</td><td>${esc(x.id)}</td>
        <td>${esc(x.name)}</td><td>${esc(x.type)}</td>
        <td><span class="tag ${x.result === "成功" ? "success" : "danger"}">${esc(x.result)}</span></td>
        <td>${esc(x.ip)}</td>
        <td class="device-actions"><button class="table-action" type="button" data-blog-detail="${index}">详情</button></td>
      </tr>`).join("");
      broadcastLogCount.textContent = list.length;
    }
    function activateLogTab(key) {
      const next = key === "calls" ? "calls" : "broadcast";
      document.querySelectorAll("[data-log-tab]").forEach((x) => x.classList.toggle("active", x.dataset.logTab === next));
      document.querySelectorAll("[data-log-panel]").forEach((x) => x.classList.toggle("active", x.dataset.logPanel === next));
    }
    document.addEventListener("click", (event) => {
      const tab = event.target.closest("[data-log-tab]");
      if (tab) {
        activateLogTab(tab.dataset.logTab);
        const url = new URL(location.href);
        if (tab.dataset.logTab === "calls") url.searchParams.set("tab", "calls");
        else url.searchParams.delete("tab");
        history.replaceState(null, "", url);
      }
      const action = event.target.closest("[data-blog-action]")?.dataset.blogAction;
      if (action === "reset") {
        document.querySelectorAll("[data-blog-filter]").forEach((input) => (input.value = ""));
        renderBroadcast();
      }
      if (action === "search") {
        const filter = Object.fromEntries([...document.querySelectorAll("[data-blog-filter]")].map((input) => [input.dataset.blogFilter, input.value]));
        renderBroadcast(broadcastLogs.filter((x) => (!filter.name || x.name.includes(filter.name)) && (!filter.type || x.type === filter.type) && (!filter.result || x.result === filter.result)));
      }
      const detail = event.target.closest("[data-blog-detail]");
      if (detail) {
        const log = broadcastLogs[Number(detail.dataset.blogDetail)];
        window.openAppDrawer?.({
          title: "操作日志详情",
          subtitle: "通信系统 · 通讯日志",
          body: `<div class="detail-grid">
            <div class="info-item"><span class="info-label">操作人</span><span class="info-value">${esc(log.operator)}</span></div>
            <div class="info-item"><span class="info-label">操作时间</span><span class="info-value">${esc(log.time)}</span></div>
            <div class="info-item"><span class="info-label">操作类型</span><span class="info-value">${esc(log.action)}</span></div>
            <div class="info-item"><span class="info-label">任务ID</span><span class="info-value">${esc(log.id)}</span></div>
            <div class="info-item"><span class="info-label">任务名称</span><span class="info-value">${esc(log.name)}</span></div>
            <div class="info-item"><span class="info-label">任务类型</span><span class="info-value">${esc(log.type)}</span></div>
            <div class="info-item"><span class="info-label">操作结果</span><span class="info-value">${esc(log.result)}</span></div>
            <div class="info-item"><span class="info-label">IP地址</span><span class="info-value">${esc(log.ip)}</span></div>
          </div>`,
          footer: '<button class="btn btn-secondary" data-drawer-close>关闭</button>',
        });
      }
    });
    renderBroadcast();
    const initialTab = new URLSearchParams(location.search).get("tab") || (location.hash === "#calls" ? "calls" : "broadcast");
    activateLogTab(initialTab);
  </script>
</body>
</html>
