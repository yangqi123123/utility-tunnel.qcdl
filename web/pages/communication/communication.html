<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>通信值班台 - 科学岛管廊监控中心</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/tob-ui.css">
  <link rel="stylesheet" href="../../assets/css/home-monitor.css?v=5">
  <link rel="stylesheet" href="../../assets/css/emergency.css?v=6">
  <link rel="stylesheet" href="../../assets/css/base-map.css?v=1">
  <link rel="stylesheet" href="../../assets/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="../../assets/css/communication.css">
</head>
<body class="monitoring-page communication-page emergency-page" data-menu-key="communication.desk" data-page-section="通信系统" data-page-title="通信值班台">
  <div class="app-shell">
    <aside id="app-sidebar" class="sidebar"></aside>
    <header id="app-header" class="header"></header>
    <main class="main">
      <div class="screen-frame stack communication-shell communication-desk-shell">
        <section class="communication-desk-main">
          <section class="communication-card communication-desk-command" aria-label="应急事件与指挥调度">
            <div class="communication-desk-events">
              <div class="ds-left-head communication-desk-events-head">
                <h2>应急事件</h2>
                <label class="dispatch-search">
                  <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                  <input class="form-control" id="deskEventKeyword" type="search" placeholder="搜索事件">
                </label>
                <div class="ds-status-chips" id="deskStatusFilter" aria-label="事件状态筛选"></div>
              </div>
              <div class="dispatch-event-list" id="deskEventList"></div>
              <nav class="dispatch-mode-bar" id="deskModeBar" aria-label="事件操作">
                <button type="button" class="dispatch-mode-btn" data-desk-mode="video" disabled><i class="fa-solid fa-video"></i><span>视频监控</span></button>
                <button type="button" class="dispatch-mode-btn" data-desk-mode="resources" disabled><i class="fa-solid fa-box-open"></i><span>应急物资</span></button>
                <button type="button" class="dispatch-mode-btn" data-desk-mode="personnel" disabled><i class="fa-solid fa-user-group"></i><span>应急人员</span></button>
                <button type="button" class="dispatch-mode-btn" data-desk-mode="plan" disabled><i class="fa-solid fa-file-shield"></i><span>应急预案</span></button>
                <button type="button" class="dispatch-mode-btn" data-desk-action="open-voice-dispatch" title="跳转第三方语音调度平台"><i class="fa-solid fa-headset"></i><span>指挥调度</span></button>
              </nav>
            </div>
            <!-- 原语音对讲 / 内嵌指挥调度面板挂载点（恢复时取消注释，并恢复 command-dispatch-panel.js）
            <div id="deskCommandHost"></div>
            -->
          </section>
          <section class="communication-card communication-desk-map" id="deskMapStage" aria-labelledby="mapTitle">
            <div class="communication-card-head">
              <h2 id="mapTitle">GIS地图</h2>
              <div class="communication-desk-layer-toggles">
                <label><input type="checkbox" id="layerDevices" checked> 通信设备</label>
                <label><input type="checkbox" id="layerPersonnel" checked> 人员</label>
                <label><input type="checkbox" id="layerResources" checked> 物资</label>
                <label><input type="checkbox" id="layerVideo" checked> 视频</label>
                <label><input type="checkbox" id="layerEvents" checked> 事件</label>
              </div>
            </div>
            <div id="deskMap" class="communication-desk-map-canvas" aria-label="通信值班台 GIS 地图"></div>
            <nav class="communication-desk-map-tools" aria-label="地图工具">
              <button type="button" data-desk-map="zoom-in" title="放大"><i class="fa-solid fa-plus"></i></button>
              <button type="button" data-desk-map="zoom-out" title="缩小"><i class="fa-solid fa-minus"></i></button>
              <button type="button" data-desk-map="reset" title="复位"><i class="fa-solid fa-crosshairs"></i></button>
              <button type="button" data-desk-map="fullscreen" title="全屏"><i class="fa-solid fa-expand"></i></button>
            </nav>
          </section>
        </section>

        <section class="communication-card communication-record-card" aria-labelledby="recordsTitle">
          <div class="communication-card-head">
            <h2 id="recordsTitle">近期通话</h2>
            <a class="btn btn-link communication-all-records" href="../communication/logs.html?tab=calls">全部记录</a>
          </div>
          <div class="communication-table-wrap">
            <table class="table communication-table">
              <thead>
                <tr>
                  <th>通话时间</th>
                  <th>事件编号</th>
                  <th>主叫人</th>
                  <th>被叫人</th>
                  <th>通话类型</th>
                  <th>通话结果</th>
                  <th>时长</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="recordBody"></tbody>
            </table>
          </div>
          <div class="pagination" id="recordPager"></div>
        </section>
      </div>
    </main>
  </div>
  <script src="../../assets/vendor/leaflet/leaflet.js"></script>
  <script src="../../../app/components/base-map.js"></script>
  <script src="../../../app/config/menu.js?v=comm-desk-opt-2"></script>
  <script src="../../../app/data/mock-data.js"></script>
  <script src="../../../app/data/emergency-data.js"></script>
  <script src="../../../app/data/communication-data.js"></script>
  <script src="../../../app/components/sidebar.js?v=nav-home-1"></script>
  <script src="../../../app/components/header.js?v=nav-home-1"></script>
  <script src="../../../app/components/drawer.js"></script>
  <script src="../../../app/components/emergency-common.js"></script>
  <script src="../../../app/components/emergency-map.js"></script>
  <script src="../../../app/components/emergency-events.js"></script>
  <script src="../../../app/components/safety-plans.js"></script>
  <!-- 原语音对讲指挥调度面板（恢复内嵌功能时取消注释）
  <script src="../../../app/components/command-dispatch-panel.js"></script>
  -->
  <script src="../../../app/components/communication-desk.js?v=desk-events-3"></script>
  <script src="../../../app/components/requirement.js"></script>
</body>
</html>
