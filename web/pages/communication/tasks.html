<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>广播任务 - 科学岛管廊监控中心</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/tob-ui.css">
  <link rel="stylesheet" href="../../assets/css/communication.css">
</head>
<body class="monitoring-page communication-page communication-device-page" data-menu-key="communication.tasks" data-page-section="通信系统" data-page-title="广播任务">
  <div class="app-shell">
    <aside id="app-sidebar" class="sidebar"></aside>
    <header id="app-header" class="header"></header>
    <main class="main">
      <div class="screen-frame stack communication-shell">
        <section class="card communication-device-filter">
          <div class="communication-device-filter-grid communication-task-filter-grid">
            <label class="form-field"><span class="form-label">任务名称</span><input class="form-control" data-filter="name" placeholder="请输入"></label>
            <label class="form-field"><span class="form-label">任务类型</span>
              <select class="form-control" data-filter="type">
                <option value="">请选择</option>
                <option>服务器音乐</option>
                <option>HTTP流媒体</option>
                <option>TTS文本</option>
              </select>
            </label>
            <label class="form-field"><span class="form-label">任务状态</span>
              <select class="form-control" data-filter="status">
                <option value="">请选择</option>
                <option>播放中</option>
                <option>已完成</option>
                <option>已停止</option>
                <option>失败</option>
              </select>
            </label>
            <div class="communication-device-filter-actions">
              <button class="btn btn-secondary" type="button" data-action="reset">重置</button>
              <button class="btn btn-primary" type="button" data-action="search">搜索</button>
            </div>
          </div>
        </section>

        <section class="card communication-device-list-card">
          <div class="card-title-row device-toolbar">
            <h1 class="card-title">广播任务</h1>
          </div>
          <div class="table-wrap">
            <table class="table device-table communication-device-table" aria-label="广播任务列表">
              <thead>
                <tr>
                  <th>任务名称</th>
                  <th>任务类型</th>
                  <th>目标区域</th>
                  <th>状态</th>
                  <th>发起人</th>
                  <th>开始时间</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="taskBody"></tbody>
            </table>
          </div>
          <div class="pagination"><span>共 <strong id="taskCount">0</strong> 条，每页 10 条</span><span class="page-item active">1</span></div>
        </section>
      </div>
    </main>
  </div>
  <script src="../../../app/config/menu.js?v=comm-c2-2"></script>
  <script src="../../../app/components/sidebar.js?v=nav-home-1"></script>
  <script src="../../../app/components/header.js?v=nav-home-1"></script>
  <script src="../../../app/components/drawer.js"></script>
  <script src="../../../app/components/requirement.js"></script>
  <script>
    const tasks = [
      { name: "早间消防宣传", type: "服务器音乐", area: "管廊环网交换机 01", status: "播放中", operator: "admin", time: "2026-09-24 08:30:12", id: "T-20260924001" },
      { name: "午间通知播报", type: "TTS文本", area: "应急广播终端 02", status: "已完成", operator: "物业管理员", time: "2026-09-24 12:00:02", id: "T-20260924002" },
      { name: "设备检修提示", type: "HTTP流媒体", area: "通信光端机 01", status: "已停止", operator: "admin", time: "2026-09-23 16:21:08", id: "T-20260923008" },
      { name: "综合舱巡检提示", type: "服务器音乐", area: "综合舱广播终端 01", status: "失败", operator: "值班员", time: "2026-09-23 14:10:31", id: "T-20260923007" },
    ];
    const esc = (v) => String(v ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;");
    const statusClass = (status) => (status === "播放中" ? "primary" : status === "失败" ? "danger" : status === "已停止" ? "muted" : "success");
    function render(list = tasks) {
      taskBody.innerHTML = list.map((t) => `<tr>
        <td>${esc(t.name)}</td><td>${esc(t.type)}</td><td>${esc(t.area)}</td>
        <td><span class="tag ${statusClass(t.status)}">${esc(t.status)}</span></td>
        <td>${esc(t.operator)}</td><td>${esc(t.time)}</td>
        <td class="device-actions"><button class="table-action" type="button" data-detail="${esc(t.id)}">详情</button>${t.status === "播放中" ? `<button class="table-action status-danger" type="button" data-stop="${esc(t.id)}">停止任务</button>` : ""}</td>
      </tr>`).join("");
      taskCount.textContent = list.length;
    }
    document.addEventListener("click", (e) => {
      const a = e.target.closest("[data-action]")?.dataset.action;
      if (a === "reset") {
        document.querySelectorAll("[data-filter]").forEach((x) => (x.value = ""));
        render();
      }
      if (a === "search") {
        const f = Object.fromEntries([...document.querySelectorAll("[data-filter]")].map((x) => [x.dataset.filter, x.value]));
        render(tasks.filter((t) => (!f.name || t.name.includes(f.name)) && (!f.type || t.type === f.type) && (!f.status || t.status === f.status)));
      }
      const detail = e.target.closest("[data-detail]");
      if (detail) {
        const t = tasks.find((x) => x.id === detail.dataset.detail);
        window.openAppDrawer?.({
          title: "广播任务详情",
          subtitle: "通信系统 · 广播任务",
          body: `<div class="detail-grid">
            <div class="info-item"><span class="info-label">任务ID</span><span class="info-value">${esc(t.id)}</span></div>
            <div class="info-item"><span class="info-label">任务名称</span><span class="info-value">${esc(t.name)}</span></div>
            <div class="info-item"><span class="info-label">任务类型</span><span class="info-value">${esc(t.type)}</span></div>
            <div class="info-item"><span class="info-label">目标区域</span><span class="info-value">${esc(t.area)}</span></div>
            <div class="info-item"><span class="info-label">当前状态</span><span class="info-value">${esc(t.status)}</span></div>
            <div class="info-item"><span class="info-label">发起人</span><span class="info-value">${esc(t.operator)}</span></div>
          </div>`,
          footer: '<button class="btn btn-secondary" data-drawer-close>关闭</button>',
        });
      }
      const stop = e.target.closest("[data-stop]");
      if (stop) {
        const t = tasks.find((x) => x.id === stop.dataset.stop);
        window.openAppConfirm?.({
          title: "停止任务",
          message: `确认停止「${t.name}」吗？停止后目标终端将停止播放。`,
          confirmText: "确认停止",
          onConfirm: () => {
            t.status = "已停止";
            render();
          },
        });
      }
    });
    render();
  </script>
</body>
</html>
