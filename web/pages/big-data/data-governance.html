<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>数据标准化治理 - 科学岛管廊监控中心</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/tob-ui.css">
  <link rel="stylesheet" href="../../assets/css/emergency.css">
  <link rel="stylesheet" href="../../assets/css/big-data.css">
</head>
<body class="emergency-page" data-menu-key="big-data.governance" data-page-section="大数据分析" data-page-title="数据标准化治理" data-big-data-page="governance">
  <div class="app-shell"><aside id="app-sidebar" class="sidebar"></aside><header id="app-header" class="header"></header>
    <main class="main"><div class="screen-frame emergency-stack">
      <section class="page-head emergency-page-head">
        <div>
          <h1 class="page-title">数据标准化治理</h1>
          <p class="page-desc">基于接口管理平台南向采集与北向对接的数据清洗与质量统计（只读）。</p>
        </div>
      </section>

      <section class="emergency-panel analysis-filter-panel">
        <div class="analysis-filter-row" id="bdGovFilters">
          <label class="form-field"><span class="form-label">所属项目</span>
            <select class="form-control" id="bdProject"><option value="">全部项目</option></select>
          </label>
          <label class="form-field"><span class="form-label">所属管廊</span>
            <select class="form-control" id="bdCorridor" disabled><option value="">请先选择所属项目</option></select>
          </label>
          <label class="form-field"><span class="form-label">所属舱室</span>
            <select class="form-control" id="bdRoom" disabled><option value="">请先选择所属管廊</option></select>
          </label>
          <label class="form-field"><span class="form-label">所属区段</span>
            <select class="form-control" id="bdSection" disabled><option value="">请先选择所属舱室</option></select>
          </label>
          <label class="form-field"><span class="form-label">所属管线</span>
            <select class="form-control" id="bdPipeline" disabled><option value="">请先选择所属区段</option></select>
          </label>
          <label class="form-field"><span class="form-label">开始时间</span>
            <input class="form-control" id="bdStart" type="date">
          </label>
          <label class="form-field"><span class="form-label">结束时间</span>
            <input class="form-control" id="bdEnd" type="date">
          </label>
          <div class="filter-actions">
            <button class="btn btn-primary" type="button" data-bd-action="query">查询</button>
            <button class="btn btn-secondary" type="button" data-bd-action="reset">重置</button>
          </div>
        </div>
      </section>

      <section class="emergency-metric-grid analysis-kpi-grid bd-gov-kpi" id="bdGovKpis"></section>

      <section class="analysis-chart-grid bd-gov-grid">
        <!-- 1 南向 -->
        <article class="analysis-chart-panel bd-gov-span">
          <div class="emergency-panel-head"><h2 class="emergency-panel-title">南向数据采集入库</h2></div>
          <div class="bd-gov-combo">
            <div class="bd-energy-share bd-gov-format">
              <div class="bd-donut-chart-wrap bd-gov-pie-wrap">
                <div class="analysis-chart-canvas-wrap bd-energy-pie" id="wrapSouthPie"><canvas id="chartSouthPie"></canvas></div>
                <div class="bd-donut-center" id="centerSouthPie"></div>
              </div>
              <div class="bd-energy-pie-legend" id="legendSouthPie"></div>
            </div>
            <div class="bd-gov-trend">
              <div class="bd-scroll-chart">
                <div class="analysis-chart-canvas-wrap" id="wrapSouthTrend"><canvas id="chartSouthTrend"></canvas></div>
              </div>
            </div>
          </div>
        </article>

        <!-- 2 北向 -->
        <article class="analysis-chart-panel bd-gov-span">
          <div class="emergency-panel-head"><h2 class="emergency-panel-title">北向数据上报</h2></div>
          <div class="bd-gov-combo">
            <div class="bd-energy-share bd-gov-format">
              <div class="bd-donut-chart-wrap bd-gov-pie-wrap">
                <div class="analysis-chart-canvas-wrap bd-energy-pie" id="wrapNorthPie"><canvas id="chartNorthPie"></canvas></div>
                <div class="bd-donut-center" id="centerNorthPie"></div>
              </div>
              <div class="bd-energy-pie-legend" id="legendNorthPie"></div>
            </div>
            <div class="bd-gov-trend">
              <div class="bd-scroll-chart">
                <div class="analysis-chart-canvas-wrap" id="wrapNorthTrend"><canvas id="chartNorthTrend"></canvas></div>
              </div>
            </div>
          </div>
        </article>

        <!-- 3 质量监测 -->
        <article class="analysis-chart-panel">
          <div class="emergency-panel-head"><h2 class="emergency-panel-title">数据质量监测统计</h2></div>
          <div class="analysis-chart-body single">
            <div class="analysis-chart-canvas-wrap bd-gov-quality-wrap" id="wrapGovQuality"><canvas id="chartGovQuality"></canvas></div>
          </div>
        </article>

        <!-- 4 标准数据集占比 -->
        <article class="analysis-chart-panel">
          <div class="emergency-panel-head"><h2 class="emergency-panel-title">标准数据集占比</h2></div>
          <div class="bd-energy-share bd-gov-format">
            <div class="bd-donut-chart-wrap bd-gov-pie-wrap">
              <div class="analysis-chart-canvas-wrap bd-energy-pie" id="wrapDatasetPie"><canvas id="chartDatasetPie"></canvas></div>
              <div class="bd-donut-center" id="centerDatasetPie"></div>
            </div>
            <div class="bd-energy-pie-legend" id="legendDatasetPie"></div>
          </div>
        </article>
      </section>
    </div></main>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="../../../app/config/menu.js?v=nav-hide-1"></script>
  <script src="../../../app/data/work-order-data.js"></script>
  <script src="../../../app/data/big-data-governance-data.js"></script>
  <script src="../../../app/components/sidebar.js?v=nav-home-1"></script>
  <script src="../../../app/components/header.js?v=nav-home-1"></script>
  <script src="../../../app/components/drawer.js"></script>
  <script src="../../../app/components/emergency-common.js"></script>
  <script src="../../../app/components/big-data-filters.js"></script>
  <script src="../../../app/components/big-data-governance.js"></script>
  <script src="../../../app/components/requirement.js"></script>
</body>
</html>
