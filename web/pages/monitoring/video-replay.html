<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>录像回放 - 科学岛管廊监控中心</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/tob-ui.css"><link rel="stylesheet" href="../../assets/css/monitoring.css">
</head>
<body class="monitoring-page" data-menu-key="video-monitoring.replay" data-page-section="视频监控系统" data-page-title="录像回放">
  <div class="app-shell"><aside id="app-sidebar" class="sidebar"></aside><header id="app-header" class="header"></header>
    <main class="main"><div class="screen-frame stack"><section class="video-replay-workspace">
      <aside class="video-replay-sidebar">
        <div class="video-sidebar-head"><span>监控设备</span><span class="status-muted" id="cameraTotal">12</span></div>
        <div class="video-floor-filter space-filter"><span class="form-label">空间选择</span><div class="space-picker" id="spacePicker"><button type="button" class="space-picker-trigger" id="spacePickerTrigger">请选择 <i class="fa-solid fa-chevron-down"></i></button><div class="space-picker-menu" id="spacePickerMenu"><div class="space-picker-columns"><div data-space-column="project"></div><div data-space-column="corridor"></div><div data-space-column="cabin"></div><div data-space-column="section"></div></div></div><div class="space-native-selects" aria-hidden="true"><select id="spaceProject"></select><select id="spaceCorridor"></select><select id="spaceCabin"></select><select id="spaceSection"></select></div></div></div>
        <div class="video-list" id="cameraList"></div>
      </aside>
      <section class="video-replay-content">
        <section class="video-replay-search card">
          <div class="video-replay-search-title"><div class="replay-mode replay-mode-top" role="tablist" aria-label="回放模式"><button class="active" type="button" data-mode="sync" role="tab" aria-selected="true"><i class="fa-solid fa-link"></i> 同步回放</button><button type="button" data-mode="async" role="tab" aria-selected="false"><i class="fa-solid fa-code-branch"></i> 异步回放</button></div><span class="replay-storage"><i class="fa-solid fa-database"></i> 存储状态：正常</span></div>
          <div class="video-replay-search-fields"><label class="form-field"><span class="form-label">录像日期</span><input class="form-control" id="replayDate" type="date" value="2026-09-04"></label><label class="form-field"><span class="form-label">开始时间</span><input class="form-control" id="startTime" type="time" value="08:00"></label><label class="form-field"><span class="form-label">结束时间</span><input class="form-control" id="endTime" type="time" value="12:00"></label><button class="btn btn-primary" id="searchReplay" type="button"><i class="fa-solid fa-magnifying-glass"></i> 检索录像</button></div>
        </section>
        <section class="video-replay-panel">
          <div class="video-panel-head"><span>历史录像 · <strong id="replayRange">2026-09-04 08:00 - 12:00</strong></span><div class="replay-mode" role="group" aria-label="回放模式"><button class="active" type="button" data-mode="sync"><i class="fa-solid fa-link"></i> 同步回放</button><button type="button" data-mode="async"><i class="fa-solid fa-code-branch"></i> 异步回放</button></div><div class="video-grid-switch" role="group" aria-label="宫格切换"><button type="button" class="active" data-grid="2" title="四宫格"><i class="grid-icon grid-4"><span></span><span></span><span></span><span></span></i></button><button type="button" data-grid="1" title="单画面"><i class="grid-icon grid-1"></i></button><button type="button" data-grid="3" title="九宫格"><i class="grid-icon grid-9"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></i></button></div></div>
          <div class="video-replay-grid" id="replayGrid"></div>
          <div class="video-replay-controls"><button type="button" id="jumpBack" title="后退10秒"><i class="fa-solid fa-backward-step"></i></button><button type="button" class="play-button" id="playToggle" title="播放"><i class="fa-solid fa-play"></i></button><button type="button" id="jumpForward" title="前进10秒"><i class="fa-solid fa-forward-step"></i></button><button type="button" id="frameStep" title="逐帧"><i class="fa-solid fa-forward"></i></button><span class="replay-clock" id="replayClock">09:42:53</span><label class="speed-label">倍速<select id="speedSelect"><option>1x</option><option>2x</option><option>4x</option><option>8x</option><option>16x</option><option>32x</option></select></label><button class="btn btn-primary" id="downloadClips" type="button"><i class="fa-solid fa-download"></i> 下载关键录像</button></div>
          <div class="video-replay-timeline"><div class="timeline-head"><span><i class="fa-solid fa-clock"></i> 录像时间轴</span><span id="timelineStatus">已加载 4 段录像</span></div><div class="timeline-scale"><span>08:00</span><span>09:00</span><span>10:00</span><span>11:00</span><span>12:00</span></div><div class="timeline-track" id="timelineTrack"><div class="timeline-segment segment-a" data-time="08:36:00" title="08:36 - 09:18"></div><div class="timeline-segment segment-b" data-time="09:42:53" title="09:42 - 10:26"></div><div class="timeline-segment segment-c" data-time="10:48:00" title="10:48 - 11:20"></div><div class="timeline-segment segment-d" data-time="11:36:00" title="11:36 - 11:58"></div><div class="timeline-marker" id="timelineMarker"></div></div><div class="timeline-events"><span><i class="fa-solid fa-circle" style="color:#2f80ed"></i> 普通录像</span><span><i class="fa-solid fa-circle" style="color:#f59e0b"></i> 事件录像</span><span><i class="fa-solid fa-bookmark"></i> 已标记片段</span></div></div>
        </section>
      </section>
    </section></div></main>
  </div>
  <script src="../../../app/config/menu.js?v=nav-hide-1"></script><script src="../../../app/components/sidebar.js?v=nav-home-1"></script><script src="../../../app/components/header.js?v=nav-home-1"></script><script src="../../../app/components/drawer.js"></script><script src="../../../app/components/requirement.js"></script>
  <script>
    const cameras=[
      {name:'管廊枪式摄像机 01',project:'光谷科学岛综合开发项目',corridor:'高新大道综合管廊',cabin:'综合舱',section:'出入口',event:true},
      {name:'综合舱球型摄像机 02',project:'光谷科学岛综合开发项目',corridor:'高新大道综合管廊',cabin:'综合舱',section:'防火分区'},
      {name:'电力舱半球摄像机 03',project:'光谷科学岛综合开发项目',corridor:'高新大道综合管廊',cabin:'电力舱',section:'通风口'},
      {name:'投料口枪式摄像机 04',project:'光谷科学岛综合开发项目',corridor:'科学岛大道综合管廊',cabin:'综合舱',section:'出入口'},
      {name:'电力舱枪式摄像机 05',project:'光谷科学岛综合开发项目',corridor:'高新大道综合管廊',cabin:'电力舱',section:'防火分区'},
      {name:'燃气舱防爆球型摄像机 06',project:'光谷科学岛综合开发项目',corridor:'科学岛东区综合管廊',cabin:'燃气舱',section:'通风口'},
      {name:'综合舱 F0102 半球摄像机 07',project:'光谷科学岛综合开发项目',corridor:'高新大道综合管廊',cabin:'综合舱',section:'防火分区'},
      {name:'电力舱 F0103 枪式摄像机 08',project:'光谷科学岛综合开发项目',corridor:'高新大道综合管廊',cabin:'电力舱',section:'防火分区'},
      {name:'水信舱 F0301 半球摄像机 09',project:'光谷科学岛综合开发项目',corridor:'科学岛大道综合管廊',cabin:'水信舱',section:'防火分区'},
      {name:'出入口 K1+280 枪式摄像机 10',project:'光谷科学岛综合开发项目',corridor:'高新大道综合管廊',cabin:'综合舱',section:'出入口'},
      {name:'电力舱出入口枪式摄像机 11',project:'光谷科学岛综合开发项目',corridor:'高新大道综合管廊',cabin:'电力舱',section:'出入口'},
      {name:'综合舱A区球型摄像机 12',project:'光谷科学岛综合开发项目',corridor:'科学岛大道综合管廊',cabin:'综合舱',section:'防火分区'}
    ];
    const image='../../assets/images/access-gate.jpg'; let visible=[...cameras], grid=2, page=0, selectedIndex=0, focusSingle=false, playing=false, marker=43, marked=[];
    const $=id=>document.getElementById(id);
    document.querySelector('.video-grid-switch').innerHTML='<button type="button" data-grid="1" title="单画面"><i class="grid-icon grid-1"></i></button><button type="button" class="active" data-grid="2" title="四宫格"><i class="grid-icon grid-4"><span></span><span></span><span></span><span></span></i></button><button type="button" data-grid="3" title="九宫格"><i class="grid-icon grid-9"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></i></button><button type="button" data-grid="4" title="十二宫格"><i class="grid-icon grid-12"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></i></button>';
    const modeHost=document.querySelector('.video-replay-search-title'); const topModes=modeHost.querySelector('.replay-mode-top');
    if(!topModes){ const tabs=document.createElement('div'); tabs.className='replay-mode replay-mode-top'; tabs.setAttribute('role','tablist'); tabs.innerHTML='<button class="active" type="button" data-mode="sync" role="tab" aria-selected="true"><i class="fa-solid fa-link"></i> 同步回放</button><button type="button" data-mode="async" role="tab" aria-selected="false"><i class="fa-solid fa-code-branch"></i> 异步回放</button>'; modeHost.prepend(tabs); }
    function syncGridSwitch(){ document.querySelectorAll('.video-grid-switch [data-grid]').forEach(x=>x.classList.toggle('active',Number(x.dataset.grid)===grid)); }
    function renderList(){ $('cameraTotal').textContent=visible.length; $('cameraList').innerHTML=visible.map((c,i)=>`<button class="video-list-item ${i===selectedIndex?'active':''}" data-camera="${i}"><i class="fa-solid fa-video"></i><span>${c.name}</span></button>`).join(''); }
    function renderGrid(){ const size=grid===1?1:grid===2?4:grid===3?9:12; const cols=grid===1?1:grid===2?2:grid===3?3:4; const items=focusSingle&&visible[selectedIndex]?[visible[selectedIndex]]:visible.slice(page*size,page*size+size); $('replayGrid').style.gridTemplateColumns=`repeat(${cols},minmax(0,1fr))`; $('replayGrid').innerHTML=items.map((c)=>`<div class="video-replay-feed"><div class="video-feed-title"><span>${c.name}</span></div><div class="video-screen"><img src="${image}" alt="${c.name}历史录像"><span class="replay-feed-time">2026-09-04 ${$('replayClock').textContent}</span></div></div>`).join(''); }
    function setClock(seconds){ marker=seconds; const h=String(Math.floor(seconds/3600)+8).padStart(2,'0'),m=String(Math.floor(seconds%3600/60)).padStart(2,'0'),s=String(Math.floor(seconds%60)).padStart(2,'0'); $('replayClock').textContent=`${h}:${m}:${s}`; $('timelineMarker').style.left=`${Math.min(99,Math.max(0,(seconds/14400)*100))}%`; document.querySelectorAll('.replay-feed-time').forEach(x=>x.textContent=`2026-09-04 ${$('replayClock').textContent}`); }
    const spaceKeys=['project','corridor','cabin','section']; function fillSpaceSelects(){spaceKeys.forEach((key,index)=>{const select=$(`space${key[0].toUpperCase()}${key.slice(1)}`),current=select.value,parentKey=spaceKeys[index-1],parent=index? $(`space${parentKey[0].toUpperCase()}${parentKey.slice(1)}`).value:'all',values=[...new Set(cameras.filter(c=>parent==='all'||c[parentKey]===parent).map(c=>c[key]))];select.innerHTML=`<option value="all">全部${key==='project'?'项目':key==='corridor'?'管廊':key==='cabin'?'舱室':'区段'}</option>${values.map(v=>`<option value="${v}">${v}</option>`).join('')}`;if(values.includes(current))select.value=current;});} function filterSpace(){const values=Object.fromEntries(spaceKeys.map(key=>[key,$(`space${key[0].toUpperCase()}${key.slice(1)}`).value]));visible=cameras.filter(c=>spaceKeys.every(key=>values[key]==='all'||c[key]===values[key]));page=0;selectedIndex=0;focusSingle=false;renderList();renderGrid();fillSpaceSelects();} spaceKeys.forEach(key=>$(`space${key[0].toUpperCase()}${key.slice(1)}`).addEventListener('change',filterSpace)); fillSpaceSelects(); $('searchReplay').addEventListener('click',()=>{ $('replayRange').textContent=`${$('replayDate').value} ${$('startTime').value} - ${$('endTime').value}`; $('timelineStatus').textContent='已加载 4 段录像'; window.showToast?.('检索完成，已找到 4 段录像'); });
    document.addEventListener('click',e=>{ const g=e.target.closest('.video-grid-switch [data-grid]'); if(g){grid=Number(g.dataset.grid);page=0;focusSingle=false;syncGridSwitch();renderGrid();} const cam=e.target.closest('[data-camera]'); if(cam){selectedIndex=Number(cam.dataset.camera);focusSingle=true;grid=1;page=0;syncGridSwitch();renderList();renderGrid();} const mode=e.target.closest('.replay-mode-top [data-mode]'); if(mode){document.querySelectorAll('.replay-mode-top [data-mode]').forEach(x=>{const active=x===mode;x.classList.toggle('active',active);x.setAttribute('aria-selected',active?'true':'false');});document.querySelector('.video-replay-panel').dataset.mode=mode.dataset.mode;$('timelineStatus').textContent=mode.dataset.mode==='sync'?'已加载 4 段录像 · 同步模式':'已加载 4 段录像 · 异步模式';$('replayGrid').dataset.mode=mode.dataset.mode;} const seg=e.target.closest('.timeline-segment'); if(seg){setClock(seg.dataset.time.split(':').reduce((a,v)=>a*60+Number(v),0)-8*3600); $('timelineStatus').textContent=`已定位至 ${seg.dataset.time}`;} if(e.target.closest('#downloadClips')){window.openAppDrawer?.({title:'下载相关录像',subtitle:'录像回放 · 取证下载',body:'<p>将生成当前检索范围内的录像下载任务。</p>',footer:'<button class="btn btn-secondary" data-drawer-close>取消</button><button class="btn btn-primary" data-drawer-close>创建下载任务</button>'});} if(e.target.closest('#playToggle')){playing=!playing;$('playToggle').innerHTML=`<i class="fa-solid fa-${playing?'pause':'play'}"></i>`;$('playToggle').title=playing?'暂停':'播放';} if(e.target.closest('#jumpBack'))setClock(Math.max(0,marker-10)); if(e.target.closest('#jumpForward'))setClock(marker+10); if(e.target.closest('#frameStep'))setClock(marker+1); });
    $('timelineTrack').addEventListener('click',e=>{if(e.target.closest('.timeline-segment'))return; const r=e.currentTarget.getBoundingClientRect(); marker=Math.round((e.clientX-r.left)/r.width*14400);setClock(marker);});
    function renderSpacePicker(){const values=Object.fromEntries(spaceKeys.map(key=>[key,$(`space${key[0].toUpperCase()}${key.slice(1)}`).value]));const labels={project:'项目',corridor:'管廊',cabin:'舱室',section:'区段'};spaceKeys.forEach((key,index)=>{const parentKey=spaceKeys[index-1],parent=index?values[parentKey]:'all',items=[...new Set(cameras.filter(c=>parent==='all'||c[parentKey]===parent).map(c=>c[key]))],column=document.querySelector(`[data-space-column="${key}"]`);column.innerHTML=`<button type="button" class="space-option ${values[key]==='all'?'active':''}" data-space-value="all" data-space-key="${key}">全部${labels[key]}</button>${items.map(item=>`<button type="button" class="space-option ${values[key]===item?'active':''}" data-space-value="${item}" data-space-key="${key}">${item}<i class="fa-solid fa-chevron-right"></i></button>`).join('')}`;});const selected=spaceKeys.filter(key=>values[key]!=='all').map(key=>values[key]);$('spacePickerTrigger').firstChild.textContent=selected.length?selected.join(' / '):'请选择';} $('spacePickerTrigger').addEventListener('click',()=>$('spacePicker').classList.toggle('open'));document.addEventListener('click',e=>{const option=e.target.closest('[data-space-key]');if(option){const key=option.dataset.spaceKey,index=spaceKeys.indexOf(key);spaceKeys.slice(index).forEach(child=>{ $(`space${child[0].toUpperCase()}${child.slice(1)}`).value='all';});$(`space${key[0].toUpperCase()}${key.slice(1)}`).value=option.dataset.spaceValue;filterSpace();renderSpacePicker();}if(!e.target.closest('#spacePicker'))$('spacePicker').classList.remove('open');});renderSpacePicker();renderList();renderGrid();setClock(1*3600+42*60+53);
  </script>
</body></html>
