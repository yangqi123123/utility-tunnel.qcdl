<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>入侵联动记录 - 入侵报警系统 - 科学岛管廊监控中心</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/tob-ui.css">
  <link rel="stylesheet" href="../../assets/css/environment-monitor.css">
  <style>
    .linkage-page .page-head { display: none; }
    .linkage-filter-card { padding: 16px 24px; }
    .linkage-filter-card .filter-actions {
      display: grid;
      grid-template-columns: repeat(4, minmax(150px, 1fr)) auto;
      gap: 16px;
      align-items: end;
    }
    .linkage-filter-card .extra-filter { display: none; }
    .linkage-filter-card.expanded .extra-filter { display: block; }
    .linkage-filter-actions {
      display: flex;
      align-items: end;
      justify-content: flex-start;
      gap: 8px;
      min-height: 32px;
    }
    .linkage-list-card { overflow: hidden; }
    .linkage-toolbar { padding: 16px 24px 0; margin-bottom: 12px; }
    .linkage-toolbar .btn-row { flex-wrap: wrap; justify-content: flex-end; }
    .linkage-table { min-width: 1100px; }
    .linkage-table th,
    .linkage-table td { white-space: nowrap; }
    .linkage-name-cell { color: var(--text-title); font-weight: 600; }
    .linkage-devices {
      display: inline-block;
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      vertical-align: bottom;
      cursor: default;
    }
    .linkage-location {
      display: inline-block;
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      vertical-align: bottom;
    }
    .linkage-actions .table-action { margin-right: 0; }
    .linkage-detail-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px 24px;
      margin-bottom: 20px;
    }
    .linkage-detail-table { min-width: 980px; }
    .drawer:has(.linkage-detail) { width: min(860px, 94vw); }
    @media (max-width: 1100px) {
      .linkage-filter-card .filter-actions { grid-template-columns: repeat(2, minmax(150px, 1fr)); }
      .linkage-filter-actions { grid-column: 1 / -1; }
    }
    @media (max-width: 640px) {
      .linkage-filter-card .filter-actions,
      .linkage-detail-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body class="environment-page linkage-page" data-menu-key="intrusion-alarm.linkage" data-page-section="入侵报警系统" data-page-title="入侵联动记录">
  <div class="app-shell">
    <aside id="app-sidebar" class="sidebar"></aside>
    <header id="app-header" class="header"></header>
    <main class="main">
      <div class="screen-frame stack">
        <section class="env-quality-kpi-grid" id="linkageKpis" aria-label="入侵联动记录概览"></section>

        <section class="card linkage-filter-card" id="linkageFilterCard">
          <div class="filter-actions">
            <label class="form-field">
              <span class="form-label">触发条件</span>
              <input class="form-control" data-filter="trigger" placeholder="请输入触发条件">
            </label>
            <label class="form-field">
              <span class="form-label">联动设备</span>
              <input class="form-control" data-filter="devices" placeholder="请输入联动设备">
            </label>
            <label class="form-field">
              <span class="form-label">联动类型</span>
              <select class="form-control" data-filter="type">
                <option value="">全部类型</option>
                <option value="视频复核">视频复核</option>
                <option value="声光启动">声光启动</option>
                <option value="照明开启">照明开启</option>
              </select>
            </label>
            <label class="form-field">
              <span class="form-label">执行结果</span>
              <select class="form-control" data-filter="result">
                <option value="">全部结果</option>
                <option value="成功">成功</option>
                <option value="部分成功">部分成功</option>
                <option value="失败">失败</option>
              </select>
            </label>
            <label class="form-field extra-filter" data-filter-extra>
              <span class="form-label">状态</span>
              <select class="form-control" data-filter="status">
                <option value="">全部状态</option>
                <option value="已完成">已完成</option>
              </select>
            </label>
            <label class="form-field extra-filter" data-filter-extra>
              <span class="form-label">位置</span>
              <input class="form-control" data-filter="location" placeholder="请输入位置">
            </label>
            <label class="form-field extra-filter" data-filter-extra>
              <span class="form-label">开始时间</span>
              <input class="form-control" type="date" data-filter="from">
            </label>
            <label class="form-field extra-filter" data-filter-extra>
              <span class="form-label">结束时间</span>
              <input class="form-control" type="date" data-filter="to">
            </label>
            <div class="linkage-filter-actions">
              <button class="btn btn-ghost" type="button" data-action="collapse"><span>展开</span> <i class="fa-solid fa-chevron-down"></i></button>
              <button class="btn btn-secondary" type="button" data-action="reset">重置</button>
              <button class="btn btn-primary" type="button" data-action="search">搜索</button>
            </div>
          </div>
        </section>

        <section class="card linkage-list-card">
          <div class="card-title-row linkage-toolbar">
            <h1 class="card-title">入侵联动记录</h1>
            <div class="btn-row">
              <button class="btn btn-secondary" type="button" data-action="sync-linkage"><i class="fa-solid fa-arrows-rotate"></i> 同步联动记录</button>
              <button class="btn btn-secondary" type="button" data-action="export"><i class="fa-solid fa-download"></i> 导出入侵联动记录</button>
            </div>
          </div>
          <div class="table-wrap">
            <table class="table linkage-table" aria-label="入侵联动记录列表">
              <thead>
                <tr>
                  <th>联动时间</th>
                  <th>联动类型</th>
                  <th>触发条件</th>
                  <th>联动设备</th>
                  <th>执行结果</th>
                  <th>状态</th>
                  <th>位置</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="linkageTableBody"></tbody>
            </table>
          </div>
          <div class="pagination" style="padding:12px 24px 16px">
            <span>共 <strong id="recordCount">0</strong> 条，每页显示 10 条</span>
            <span class="page-item active">1</span>
          </div>
        </section>
      </div>
    </main>
  </div>
  <script src="../../../app/config/menu.js?v=nav-hide-1"></script>
  <script src="../../../app/data/system-types.js"></script>
  <script src="../../../app/components/sidebar.js?v=nav-home-1"></script>
  <script src="../../../app/components/header.js?v=nav-home-1"></script>
  <script src="../../../app/components/drawer.js"></script>
  <script src="../../../app/components/requirement.js"></script>
  <script src="../../../app/data/intrusion-alarm-data.js"></script>
  <script>
    (function () {
      const data = window.INTRUSION_ALARM_DATA;
      if (!data) return;

      const PAGE_SUBTITLE = "入侵报警系统 · 入侵联动记录";
      const linkageRecords = data.linkageRecords || [];
      const systemTypes = (window.APP_SYSTEM_TYPES || []).map((item) => item.name);
      const filterCard = document.getElementById("linkageFilterCard");
      const collapseButton = filterCard.querySelector('[data-action="collapse"]');

      const state = {
        filters: { trigger: "", devices: "", type: "", result: "", status: "", location: "", from: "", to: "" },
      };

      function esc(value) {
        return String(value ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
      }
      function attr(value) {
        return esc(value).replaceAll("'", "&#39;");
      }
      function resultClass(result) {
        if (result === "成功") return "normal";
        if (result === "部分成功") return "warning";
        if (result === "失败") return "danger";
        return "offline";
      }
      function statusClass(status) {
        if (status === "已完成") return "normal";
        return "offline";
      }
      function itemList(record) {
        return Array.isArray(record.items) ? record.items : [];
      }
      function devicesOf(record) {
        const fromItems = itemList(record).map((row) => row.deviceName).filter(Boolean);
        if (fromItems.length) return fromItems;
        return record.devices ? [record.devices] : [];
      }
      function triggersOf(record) {
        const fromItems = [...new Set(itemList(record).map((row) => row.trigger).filter(Boolean))];
        if (fromItems.length) return fromItems;
        return record.trigger ? [record.trigger] : [];
      }
      function showMessage(title, message) {
        if (typeof window.openAppConfirm === "function") {
          window.openAppConfirm({ title, message, confirmText: "知道了" });
          return;
        }
        window.alert(`${title}\n${message}`);
      }

      function filteredRecords() {
        const f = state.filters;
        const triggerQ = f.trigger.toLowerCase();
        const devicesQ = f.devices.toLowerCase();
        const locationQ = f.location.toLowerCase();
        return linkageRecords.filter((item) => {
          const day = (item.startTime || item.time || "").slice(0, 10);
          const devicesText = devicesOf(item).join(" ");
          const triggerText = triggersOf(item).join(" ");
          return (!triggerQ || triggerText.toLowerCase().includes(triggerQ)) &&
            (!devicesQ || devicesText.toLowerCase().includes(devicesQ)) &&
            (!f.type || item.type === f.type) &&
            (!f.result || item.result === f.result) &&
            (!f.status || item.status === f.status) &&
            (!locationQ || (item.location || "").toLowerCase().includes(locationQ)) &&
            (!f.from || (day && day >= f.from)) &&
            (!f.to || (day && day <= f.to));
        });
      }

      function renderKpis() {
        const total = linkageRecords.length;
        const ok = linkageRecords.filter((item) => item.result === "成功").length;
        const partial = linkageRecords.filter((item) => item.result === "部分成功").length;
        const fail = linkageRecords.filter((item) => item.result === "失败").length;
        const cards = [
          ["联动总数", total, "fa-solid fa-diagram-project", "is-blue"],
          ["成功", ok, "fa-solid fa-circle-check", "is-green"],
          ["部分成功", partial, "fa-solid fa-triangle-exclamation", "is-amber"],
          ["失败", fail, "fa-solid fa-circle-xmark", "is-red"],
        ];
        document.getElementById("linkageKpis").innerHTML = cards.map(([label, value, icon, tone]) => `
          <article class="analysis-kpi ${tone}">
            <div class="analysis-kpi-icon"><i class="${icon}"></i></div>
            <div class="analysis-kpi-body">
              <span class="analysis-kpi-label">${esc(label)}</span>
              <strong class="analysis-kpi-value">${esc(value)}</strong>
            </div>
          </article>
        `).join("");
      }

      function renderTable(list) {
        document.getElementById("recordCount").textContent = list.length;
        document.getElementById("linkageTableBody").innerHTML = list.map((item) => {
          const triggerText = triggersOf(item).join("、") || "-";
          const deviceText = devicesOf(item).join("、") || "-";
          const timeText = item.startTime || item.time || "-";
          return `
            <tr data-record-id="${attr(item.id)}">
              <td>${esc(timeText)}</td>
              <td><span class="linkage-name-cell">${esc(item.type || "-")}</span></td>
              <td title="${attr(triggerText)}">${esc(triggerText)}</td>
              <td><span class="linkage-devices" title="${attr(deviceText)}">${esc(deviceText)}</span></td>
              <td><span class="env-status ${resultClass(item.result)}">${esc(item.result || "-")}</span></td>
              <td><span class="env-status ${statusClass(item.status)}">${esc(item.status || "-")}</span></td>
              <td><span class="linkage-location" title="${attr(item.location || "")}">${esc(item.location || "-")}</span></td>
              <td class="linkage-actions">
                <button class="table-action" type="button" data-open-detail="${attr(item.id)}">详情</button>
              </td>
            </tr>
          `;
        }).join("") || `<tr><td colspan="8" class="empty-cell">暂无数据</td></tr>`;
      }

      function syncFilters() {
        document.querySelectorAll("[data-filter]").forEach((field) => {
          state.filters[field.dataset.filter] = field.value.trim();
        });
      }

      function render() {
        renderKpis();
        renderTable(filteredRecords());
      }

      function openDetail(id) {
        const item = linkageRecords.find((entry) => entry.id === id);
        if (!item || !window.openAppDrawer) return;
        const rows = itemList(item).map((row) => `
          <tr>
            <td>${esc(row.system || "-")}</td>
            <td>${esc(row.deviceName || "-")}</td>
            <td>${esc(row.deviceCode || "-")}</td>
            <td title="${attr(row.trigger || "")}">${esc(row.trigger || "-")}</td>
            <td title="${attr(row.action || "")}">${esc(row.action || "-")}</td>
            <td><span class="env-status ${resultClass(row.result)}">${esc(row.result || "-")}</span></td>
            <td>${esc(row.startTime || "-")}</td>
            <td>${esc(row.endTime || "-")}</td>
            <td>${esc(row.sendTime || "-")}</td>
          </tr>
        `).join("") || `<tr><td colspan="9" class="empty-cell">暂无联动设备</td></tr>`;

        const body = `
          <div class="linkage-detail">
            <section class="environment-detail-section">
              <h3>基本信息</h3>
              <div class="linkage-detail-grid">
                <div class="info-item"><span class="info-label">联动名称</span><span class="info-value">${esc(item.name || "-")}</span></div>
                <div class="info-item"><span class="info-label">联动编号</span><span class="info-value">${esc(item.code || item.id || "-")}</span></div>
                <div class="info-item"><span class="info-label">联动类型</span><span class="info-value">${esc(item.type || "-")}</span></div>
                <div class="info-item"><span class="info-label">执行结果</span><span class="info-value"><span class="env-status ${resultClass(item.result)}">${esc(item.result || "-")}</span></span></div>
                <div class="info-item"><span class="info-label">联动开始时间</span><span class="info-value">${esc(item.startTime || item.time || "-")}</span></div>
                <div class="info-item"><span class="info-label">联动结束时间</span><span class="info-value">${esc(item.endTime || "-")}</span></div>
                <div class="info-item"><span class="info-label">发送时间</span><span class="info-value">${esc(item.sendTime || "-")}</span></div>
              </div>
            </section>
            <section class="environment-detail-section">
              <h3>联动设备明细</h3>
              <div class="table-wrap">
                <table class="table linkage-detail-table">
                  <thead>
                    <tr>
                      <th>联动系统</th>
                      <th>联动设备</th>
                      <th>设备编码</th>
                      <th>触发条件</th>
                      <th>执行动作</th>
                      <th>执行结果</th>
                      <th>联动开始时间</th>
                      <th>联动结束时间</th>
                      <th>发送时间</th>
                    </tr>
                  </thead>
                  <tbody>${rows}</tbody>
                </table>
              </div>
            </section>
          </div>
        `;
        window.openAppDrawer({
          title: "联动详情",
          body,
          footer: `<button class="btn btn-secondary" type="button" data-drawer-close>关闭</button>`,
        });
      }

      function openSyncDrawer() {
        const options = systemTypes.map((name) => `<option value="${esc(name)}">${esc(name)}</option>`).join("");
        window.openAppDrawer({
          title: "同步联动记录",
          body: `
            <label class="form-field form-item">
              <span class="form-label form-required">同步模式</span>
              <select class="form-control" data-sync-mode>
                <option value="FULL">首次全量同步</option>
                <option value="INCREMENTAL">后续增量同步</option>
              </select>
            </label>
            <label class="form-field form-item">
              <span class="form-label form-required">同步系统</span>
              <select class="form-control" data-sync-system>
                <option value="">请选择系统</option>
                ${options}
              </select>
            </label>
          `,
          footer: `
            <button class="btn btn-secondary" type="button" data-drawer-close>取消</button>
            <button class="btn btn-primary" type="button" data-action="start-linkage-sync">开始同步</button>
          `,
        });
      }

      function startSync() {
        const mode = document.querySelector("[data-sync-mode]")?.value || "FULL";
        const system = document.querySelector("[data-sync-system]")?.value || "";
        if (!system) {
          showMessage("提示", "请选择同步系统后再开始同步。");
          return;
        }
        const modeLabel = mode === "FULL" ? "首次全量同步" : "后续增量同步";
        if (typeof window.closeAppDrawer === "function") window.closeAppDrawer();
        showMessage("联动同步任务已提交", `同步模式：${modeLabel}；同步系统：${system}。任务已在后台执行，稍后可刷新列表查看结果。`);
      }

      function openExportDrawer() {
        const count = filteredRecords().length;
        window.openAppDrawer({
          title: "导出入侵联动记录",
          subtitle: PAGE_SUBTITLE,
          body: `<p>已按当前筛选条件生成入侵联动记录文件（Mock），共 ${esc(count)} 条。</p>`,
          footer: `
            <button class="btn btn-secondary" type="button" data-drawer-close>取消</button>
            <button class="btn btn-primary" type="button" data-drawer-close>确认导出</button>
          `,
        });
      }

      document.addEventListener("click", (event) => {
        const action = event.target.closest("[data-action]")?.dataset.action;
        if (action === "collapse") {
          const expanded = filterCard.classList.toggle("expanded");
          collapseButton.querySelector("span").textContent = expanded ? "收起" : "展开";
          collapseButton.querySelector("i").className = expanded ? "fa-solid fa-chevron-up" : "fa-solid fa-chevron-down";
          return;
        }
        if (action === "search") {
          syncFilters();
          renderTable(filteredRecords());
          return;
        }
        if (action === "reset") {
          document.querySelectorAll("[data-filter]").forEach((field) => { field.value = ""; });
          state.filters = { trigger: "", devices: "", type: "", result: "", status: "", location: "", from: "", to: "" };
          renderTable(filteredRecords());
          return;
        }
        if (action === "sync-linkage") {
          openSyncDrawer();
          return;
        }
        if (action === "start-linkage-sync") {
          startSync();
          return;
        }
        if (action === "export") {
          openExportDrawer();
          return;
        }

        const detailId = event.target.closest("[data-open-detail]")?.dataset.openDetail;
        if (detailId) openDetail(detailId);
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && event.target.matches("[data-filter]")) {
          syncFilters();
          renderTable(filteredRecords());
        }
      });

      render();

      const openId = new URLSearchParams(location.search).get("id");
      if (openId) openDetail(openId);
    })();
  </script>
</body>
</html>
