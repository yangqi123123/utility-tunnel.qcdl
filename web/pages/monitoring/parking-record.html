<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>停车记录 - 科学岛管廊监控中心</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="../../assets/css/tob-ui.css"><link rel="stylesheet" href="../../assets/css/monitoring.css"></head>
<body class="monitoring-page" data-menu-key="smart-monitoring.parking" data-page-section="智能监测" data-page-title="停车记录"><div class="app-shell"><aside id="app-sidebar" class="sidebar"></aside><header id="app-header" class="header"></header><main class="main"><div class="screen-frame stack"><section class="card monitoring-filter-card"><div class="filter-actions"><label class="form-field"><span class="form-label">车牌号</span><input class="form-control" data-filter="plate" placeholder="请输入车牌号"></label><label class="form-field"><span class="form-label">进出时间</span><input class="form-control" type="date" data-filter="date"></label><label class="form-field"><span class="form-label">闸机口</span><select class="form-control" data-filter="gate"><option value="">请选择闸机口</option><option>西侧入口道闸</option><option>南侧入口道闸</option><option>西侧出口道闸</option><option>南侧出口道闸</select></label><label class="form-field"><span class="form-label">进出状态</span><select class="form-control" data-filter="direction"><option value="">请选择进出状态</option><option>入场</option><option>出场</option></select></label><button class="btn btn-secondary" type="button" data-action="reset">重置</button><button class="btn btn-primary" type="button" data-action="search">搜索</button></div></section><section class="card monitoring-list-card"><div class="card-title-row monitoring-toolbar"><h1 class="card-title">停车记录</h1><button class="btn btn-secondary" type="button" data-action="export"><i class="fa-solid fa-download"></i> 导出</button></div><div class="table-wrap"><table class="table monitoring-table"><thead><tr><th>闸机口</th><th>进出状态</th><th>进出时间</th><th>车牌号</th><th>用户类型</th><th>停车费</th></tr></thead><tbody id="recordBody"></tbody></table></div><div class="pagination"><span>共 <strong id="recordCount">0</strong> 条，每页 10 条</span><span class="page-item active">1</span></div></section></div></main></div><script src="../../../app/config/menu.js?v=nav-hide-1"></script><script src="../../../app/components/sidebar.js?v=nav-home-1"></script><script src="../../../app/components/header.js?v=nav-home-1"></script><script src="../../../app/components/drawer.js"></script><script src="../../../app/components/requirement.js"></script><script>const records=[['西侧入口道闸','入场','2026-09-04 08:20:16 至 2026-09-04 09:20:16','闽D A8623','月租用户','¥0.00'],['南侧入口道闸','入场','2026-09-04 08:35:42 至 2026-09-04 09:35:42','闽D P1208','临时用户','¥0.00'],['西侧出口道闸','出场','2026-09-04 09:05:31 至 2026-09-04 10:05:31','闽D 7K526','访客用户','¥8.00'],['南侧出口道闸','出场','2026-09-04 09:18:09 至 2026-09-04 10:18:09','闽D C9916','临时用户','¥6.00'],['西侧入口道闸','入场','2026-09-04 09:42:53 至 2026-09-04 10:42:53','闽D J6210','月租用户','¥0.00']];function render(list=records){recordBody.innerHTML=list.map(row=>'<tr>'+row.map((cell,i)=>'<td class="'+(i===1?(cell==='入场'?'record-result success':'record-result fail'):'')+'">'+cell+'</td>').join('')+'</tr>').join('');recordCount.textContent=list.length}function filter(){const f=Object.fromEntries([...document.querySelectorAll('[data-filter]')].map(x=>[x.dataset.filter,x.value]));render(records.filter(r=>(!f.plate||r[3].includes(f.plate))&&(!f.date||r[2].startsWith(f.date))&&(!f.gate||r[0]===f.gate)&&(!f.direction||r[1]===f.direction)))}document.addEventListener('click',e=>{const a=e.target.closest('[data-action]')?.dataset.action;if(a==='search')filter();if(a==='reset'){document.querySelectorAll('[data-filter]').forEach(x=>x.value='');render()}if(a==='export')window.openAppDrawer({title:'导出停车记录',subtitle:'智能监测 · 停车记录',body:'<p>已按当前筛选条件生成停车记录文件（Mock）。</p>',footer:'<button class="btn btn-secondary" data-drawer-close>取消</button><button class="btn btn-primary" data-drawer-close>确认导出</button>'})});render();</script></body></html>
