<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>电力实时监测 - 电力监测系统 - 科学岛管廊监控中心</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/tob-ui.css">
  <link rel="stylesheet" href="../../assets/css/home-monitor.css?v=5">
  <link rel="stylesheet" href="../../assets/css/monitoring.css">
  <link rel="stylesheet" href="../../assets/css/environment-monitor.css">
  <link rel="stylesheet" href="../../assets/css/base-map.css?v=1">
  <link rel="stylesheet" href="../../assets/css/intrusion-monitor.css">
  <link rel="stylesheet" href="../../assets/vendor/leaflet/leaflet.css">
  <style>
    body.power-realtime-page .main { padding-top: 4px; }
    body.power-realtime-page .ias-view-switch { padding: 0 0 16px !important; }
    body.ias-pano-mode .main {
      display: flex;
      flex-direction: column;
      min-height: 0;
      height: calc(100vh - var(--header-total-height, 96px));
      overflow: hidden;
      padding-bottom: 0;
    }
    body.ias-pano-mode .ias-view-switch { flex: none; }
    .ias-panorama-view {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      gap: 14px;
      padding: 0 12px 12px;
      background: #f5f7fc;
      box-sizing: border-box;
    }
    .ias-panorama-view[hidden],
    .ias-panorama-view.ias-view-hidden { display: none !important; }
    .pwr-pano-side {
      background: #fff;
      border: 1px solid #e6ebf2;
      border-radius: 4px;
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .pwr-pano-side-head {
      height: 54px;
      padding: 0 16px;
      border-bottom: 1px solid #e6ebf2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex: none;
    }
    .pwr-pano-side-head h2 { margin: 0; font-size: 14px; color: #192435; }
    .pwr-pano-side-body { padding: 14px; overflow: auto; flex: 1; }
    .pwr-screen-list { display: grid; gap: 8px; }
    .pwr-screen-item {
      width: 100%;
      text-align: left;
      border: 1px solid #e6ebf2;
      background: #fff;
      border-radius: 3px;
      padding: 12px;
      cursor: pointer;
    }
    .pwr-screen-item.active { border-color: #135afa; background: #eef3ff; }
    .pwr-screen-item strong { display: block; font-size: 13px; color: #192435; }
    .pwr-screen-item small { display: block; margin-top: 6px; font-size: 11px; color: #758297; }
    .pwr-pano-stage {
      position: relative;
      min-width: 0;
      min-height: 0;
      background: #06101f;
      border: 1px solid #e6ebf2;
      border-radius: 4px;
      overflow: hidden;
    }
    .pwr-pano-stage iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #06101f;
    }
    @media (max-width: 900px) {
      .ias-panorama-view { grid-template-columns: 1fr; overflow: auto; }
      .pwr-pano-stage { min-height: 480px; }
    }
  </style>
</head>
<body class="power-realtime-page ias-pano-mode" data-menu-key="power-monitor.realtime" data-page-section="电力监测系统" data-page-title="电力实时监测">
<div class="app-shell">
  <aside id="app-sidebar" class="sidebar"></aside>
  <header id="app-header" class="header"></header>
  <main class="main">
    <!-- 全局唯一视图切换（勿在地图/列表内部再放一套） -->
    <div class="ias-view-switch" id="iasViewSwitch">
      <div class="ias-view-tabs" role="tablist" aria-label="视图切换">
        <button type="button" class="is-active" data-ias-view="panorama" role="tab" aria-selected="true">全景可视化监测</button>
        <button type="button" data-ias-view="map" role="tab" aria-selected="false">地图视图</button>
        <button type="button" data-ias-view="list" role="tab" aria-selected="false">列表视图</button>
      </div>
    </div>

    <div id="iasPanoramaView" class="ias-panorama-view">
      <aside class="pwr-pano-side" aria-label="电力监测切换">
        <div class="pwr-pano-side-head"><h2>组态图列表</h2></div>
        <div class="pwr-pano-side-body">
          <div class="pwr-screen-list" id="pwrScreenList" role="listbox" aria-label="电力监测路段"></div>
        </div>
      </aside>
      <div class="pwr-pano-stage">
        <iframe id="pwrPanoFrame" title="电力监测组态图" src="../network/configuration.html?embed=power&screen=power-wl1"></iframe>
      </div>
    </div>

    <!-- 地图视图：严格对齐 home.html（dm-metrics + dm-stage） -->
    <div id="iasMapView" class="dm-root ias-map-view ias-view-hidden" hidden>
      <section class="dm-metrics">
        <article class="dm-metric">
          <span class="dm-metric-icon"><i class="fa-solid fa-shield-halved"></i></span>
          <div class="dm-metric-label">设备总数 <i class="fa-regular fa-circle-question" title="已接入的 UPS、配电柜、变压器与电表数量"></i></div>
          <strong class="dm-metric-value" id="dmMetricTotal">—</strong>
          <p class="dm-metric-sub">UPS / 配电柜 / 变压器 / 电表</p>
        </article>
        <article class="dm-metric dm-metric--online">
          <span class="dm-metric-icon"><i class="fa-solid fa-circle-check"></i></span>
          <div class="dm-metric-label">在线 / 正常 <i class="fa-regular fa-circle-question" title="在线且运行指标正常的电力设备数量"></i></div>
          <strong class="dm-metric-value" id="dmMetricOnline">—</strong>
          <p class="dm-metric-sub"><b id="dmMetricOnlineRate">—</b> 在线率</p>
        </article>
        <article class="dm-metric dm-metric--warn">
          <span class="dm-metric-icon"><i class="fa-solid fa-triangle-exclamation"></i></span>
          <div class="dm-metric-label">预警 / 报警 <i class="fa-regular fa-circle-question" title="预警或已触发过压/过流等报警的设备"></i></div>
          <strong class="dm-metric-value" id="dmMetricWarn">—</strong>
          <p class="dm-metric-sub dm-metric-sub--clip" id="dmMetricWarnSystems">—</p>
        </article>
        <article class="dm-metric dm-metric--fault">
          <span class="dm-metric-icon"><i class="fa-solid fa-plug-circle-xmark"></i></span>
          <div class="dm-metric-label">故障 / 离线 <i class="fa-regular fa-circle-question" title="故障停机或通信中断的设备"></i></div>
          <strong class="dm-metric-value" id="dmMetricFault">—</strong>
          <p class="dm-metric-sub"><b id="dmMetricFaultRate">—</b> 需处理</p>
        </article>
      </section>

      <section class="dm-stage" id="dmStage">
        <div class="dm-map" id="dmMap" aria-label="电力监测态势地图"></div>

        <button class="dm-side-toggle dm-side-toggle--left" type="button" data-dm-collapse="left" title="收起面板" aria-label="收起左侧面板"><i class="fa-solid fa-chevron-left"></i></button>
        <button class="dm-side-toggle dm-side-toggle--right" type="button" data-dm-collapse="right" title="收起面板" aria-label="收起右侧面板"><i class="fa-solid fa-chevron-right"></i></button>

        <aside class="dm-panel dm-left">
          <div class="dm-statusbar" id="dmStatusBar">
            <button class="dm-chip is-active" type="button" data-dm-status="all"><i></i>全部</button>
            <button class="dm-chip" type="button" data-dm-status="online"><i></i>在线</button>
            <button class="dm-chip" type="button" data-dm-status="offline"><i></i>离线</button>
            <button class="dm-chip" type="button" data-dm-status="warn"><i></i>预警</button>
          </div>
          <div class="dm-tabs">
            <button class="dm-tab is-active" type="button" data-dm-mode="system">系统类型</button>
            <button class="dm-tab" type="button" data-dm-mode="space">空间类型</button>
          </div>
          <div class="dm-tree" id="dmTree" role="tree" aria-label="系统类型 / 空间类型"></div>
        </aside>

        <aside class="dm-panel dm-right">
          <div class="dm-panel-head">
            <h2>电力监测明细</h2>
            <p id="dmScope">所属系统：电力监测</p>
          </div>
          <div class="dm-table-wrap" id="dmTableWrap">
            <table class="dm-table dm-point-table">
              <thead>
                <tr>
                  <th class="dm-col-index">序号</th>
                  <th>设备名称</th>
                  <th>设备编码</th>
                  <th>设备状态</th>
                  <th>设备分类</th>
                  <th class="dm-col-op">操作</th>
                </tr>
              </thead>
              <tbody id="dmTableBody"></tbody>
            </table>
          </div>
          <div class="dm-panel-foot dm-panel-foot--pager">
            <span class="dm-pager-total">共 <b id="dmPointCount">0</b> 个监测点位</span>
            <span class="dm-page-list" id="dmPointPager"></span>
          </div>
        </aside>

        <div class="dm-legend" id="dmLegend">
          <div class="dm-legend-head">图例 <span id="dmLegendScope">电力监测</span></div>
          <div class="dm-legend-body" id="dmLegendBody"></div>
        </div>

        <div class="dm-map-tools">
          <button type="button" data-dm-map="zoom-in"><i class="fa-solid fa-plus"></i> 放大</button>
          <button type="button" data-dm-map="zoom-out"><i class="fa-solid fa-minus"></i> 缩小</button>
          <button type="button" data-dm-map="reset"><i class="fa-solid fa-crosshairs"></i> 复位</button>
          <button type="button" data-dm-map="fullscreen"><i class="fa-solid fa-expand"></i> 全屏</button>
        </div>
      </section>
    </div>

    <!-- 列表视图：严格对齐 environment-quality.html -->
    <div id="iasListView" class="ias-list-view ias-view-hidden" hidden>
      <div class="screen-frame stack">
        <section class="env-quality-kpi-grid" id="qualityKpis" aria-label="电力监测设备概览"></section>

        <section class="env-quality-workspace">
          <aside class="dm-panel dm-left env-quality-side" aria-label="系统类型 / 空间类型筛选">
            <div class="dm-statusbar" id="eqStatusBar">
              <button class="dm-chip is-active" type="button" data-eq-status="all"><i></i>全部</button>
              <button class="dm-chip" type="button" data-eq-status="online"><i></i>在线</button>
              <button class="dm-chip" type="button" data-eq-status="offline"><i></i>离线</button>
              <button class="dm-chip" type="button" data-eq-status="warn"><i></i>预警</button>
            </div>
            <div class="dm-tabs">
              <button class="dm-tab is-active" type="button" data-ias-mode="system">系统类型</button>
              <button class="dm-tab" type="button" data-ias-mode="space">空间类型</button>
            </div>
            <div class="dm-tree" id="eqTree" role="tree" aria-label="系统类型 / 空间类型"></div>
          </aside>

          <div class="env-quality-main">
            <section class="env-quality-scope-bar" id="eqScopeBar">
              <div class="env-quality-scope-path" id="eqScopePath"></div>
              <div class="env-quality-scope-filters" id="eqScopeFilters">
                <label class="form-field">
                  <span class="form-label">设备分类</span>
                  <select class="form-control" data-eq-filter="category">
                    <option value="">全部</option>
                    <option value="UPS">UPS</option>
                    <option value="配电柜">配电柜</option>
                    <option value="变压器">变压器</option>
                    <option value="电表">电表</option>
                  </select>
                </label>
                <label class="form-field">
                  <span class="form-label">设备名称</span>
                  <input class="form-control" data-eq-filter="name" placeholder="请输入设备名称">
                </label>
                <label class="form-field">
                  <span class="form-label">设备编码</span>
                  <input class="form-control" data-eq-filter="code" placeholder="请输入设备编码">
                </label>
                <label class="form-field">
                  <span class="form-label">开始时间</span>
                  <input class="form-control" type="date" data-eq-filter="from">
                </label>
                <label class="form-field">
                  <span class="form-label">结束时间</span>
                  <input class="form-control" type="date" data-eq-filter="to">
                </label>
                <div class="env-quality-scope-actions">
                  <button class="btn btn-primary" type="button" data-eq-action="search">搜索</button>
                  <button class="btn btn-secondary" type="button" data-eq-action="reset">重置</button>
                </div>
              </div>
            </section>

            <div id="iasListIntrusion">
              <div class="env-quality-card-grid" id="eqCardGrid"></div>
              <div class="env-quality-card-foot">
                <span>共 <strong id="eqCardCount">0</strong> 台设备</span>
              </div>
            </div>

            <div id="iasListVideo" class="ias-list-video" hidden>
              <iframe title="实时视频" src="../monitoring/video-monitor.html?embedded=panel"></iframe>
            </div>
          </div>
        </section>
      </div>
    </div>
  </main>
</div>

<div class="dm-modal-mask" id="dmModalMask">
  <section class="dm-modal" role="dialog" aria-modal="true" aria-labelledby="dmModalTitle">
    <header class="dm-modal-head">
      <h2 id="dmModalTitle">设备详情</h2>
      <button class="dm-modal-close" type="button" data-dm-close aria-label="关闭">×</button>
    </header>
    <div class="dm-modal-tabs" role="tablist">
      <button class="dm-modal-tab is-active" type="button" role="tab" data-dm-tab="info">设备信息</button>
      <button class="dm-modal-tab" type="button" role="tab" data-dm-tab="live">实时数据</button>
      <button class="dm-modal-tab" type="button" role="tab" data-dm-tab="history">历史数据</button>
    </div>
    <div class="dm-modal-body">
      <div data-dm-panel="info"></div>
      <div data-dm-panel="live" hidden></div>
      <div data-dm-panel="history" hidden></div>
    </div>
  </section>
</div>

  <script src="../../../app/components/base-map.js"></script>
  <script src="../../../app/components/device-detail-info.js"></script>
  <script src="../../../app/config/menu.js?v=nav-hide-1"></script>
  <script src="../../../app/components/sidebar.js?v=nav-home-1"></script>
  <script src="../../../app/components/header.js?v=nav-home-1"></script>
  <script src="../../../app/components/drawer.js"></script>
  <script src="../../../app/components/requirement.js"></script>
  <script src="../../../app/data/power-monitor-data.js"></script>
  <script src="../../../app/data/configuration-data.js?v=config-hmi-6"></script>
  <script>
(function () {
  "use strict";
  var RAW = window.POWER_MONITOR_DATA || {};
  var KIND_TYPE = { ups: "UPS", cabinet: "配电柜", transformer: "变压器", meter: "电表" };
  var KIND_ICON = { ups: "fa-bolt", cabinet: "fa-server", transformer: "fa-industry", meter: "fa-gauge" };
  var KIND_COLOR = { ups: "#135AFA", cabinet: "#14C9BA", transformer: "#F7BA1E", meter: "#8B5CF6" };
  var MAP_CENTER = [30.4665, 114.4205];

  function mapStatus(raw) {
    if (raw === "normal") return "online";
    if (raw === "warn" || raw === "alarm") return "warn";
    if (raw === "fault") return "fault";
    if (raw === "offline") return "offline";
    return "online";
  }

  function isWarnRaw(raw) {
    return raw === "warn" || raw === "alarm";
  }

  var DEVICES = (RAW.monitorDevices || []).map(function (item) {
    var type = KIND_TYPE[item.kind] || item.kind;
    var status = mapStatus(item.status);
    return {
      id: item.id,
      name: item.name,
      code: item.code,
      kind: item.kind,
      system: "电力监测",
      type: type,
      status: status,
      rawStatus: item.status,
      statusLabel: item.statusLabel || "",
      isAlarm: item.status === "alarm",
      color: KIND_COLOR[item.kind] || "#6B7B8C",
      icon: KIND_ICON[item.kind] || "fa-location-dot",
      project: item.project || "",
      corridor: item.corridor || "",
      room: item.room || "",
      section: item.section || "",
      lat: item.lat,
      lng: item.lng,
      gatewayId: item.gatewayId || "",
      lastSeen: item.lastSeen || "",
      time: item.lastSeen || "",
      metrics: (item.metrics || []).map(function (m) {
        return {
          name: m.name,
          value: m.value,
          unit: m.unit || "",
          status: m.status || "normal",
          decimals: typeof m.value === "number" ? 1 : 0
        };
      }),
      alarm: item.alarm || null,
      brand: item.brand || "电力设备",
      model: item.model || ({ ups: "PWR-UPS", cabinet: "PWR-CAB", transformer: "PWR-TR", meter: "PWR-MTR" }[item.kind] || "PWR-DEV"),
      location: [item.corridor, item.room, item.section].filter(Boolean).join(" / ") || "—",
      pipeline: item.pipeline || "电力监测管线",
      vendor: item.vendor || "科学岛管廊运维中心",
      supplierPhone: item.supplierPhone || "400-800-1000",
      manufacturer: item.manufacturer || "电力监测厂商",
      manufactureDate: item.manufactureDate || "2026-05-12",
      deliveryDate: item.deliveryDate || "2026-06-01",
      installDate: item.installDate || "2026-06-18",
      acceptDate: item.acceptDate || "2026-06-25",
      scrapDate: item.scrapDate || "—",
      factoryCode: item.factoryCode || "—",
      cadCode: item.cadCode || ("CAD-" + (item.code || item.id)),
      sourceModule: item.sourceModule || "电力监测系统",
      service: item.service || "电压、电流、负载与通信监测",
      remark: item.alarm ? (item.alarm.message || "") : (item.remark || ""),
      smart: "是",
      thirdPartyCode: item.thirdPartyCode || "—",
      coordinate: (item.lat != null && item.lng != null) ? (item.lat + ", " + item.lng) : "—",
      createdAt: item.lastSeen || "—"
    };
  });

  var SYSTEMS = (function () {
    var sum = { name: "电力监测", total: 0, online: 0, warn: 0, fault: 0, offline: 0 };
    DEVICES.forEach(function (d) {
      sum.total += 1;
      if (d.rawStatus === "normal") sum.online += 1;
      else if (isWarnRaw(d.rawStatus)) sum.warn += 1;
      else if (d.rawStatus === "fault") sum.fault += 1;
      else if (d.rawStatus === "offline") sum.offline += 1;
    });
    return [sum];
  })();

  var D = {
    systems: SYSTEMS,
    devices: DEVICES,
    spatialTree: RAW.spatialTree || [],
    categoryStyles: {
      "UPS": { color: KIND_COLOR.ups, icon: KIND_ICON.ups },
      "配电柜": { color: KIND_COLOR.cabinet, icon: KIND_ICON.cabinet },
      "变压器": { color: KIND_COLOR.transformer, icon: KIND_ICON.transformer },
      "电表": { color: KIND_COLOR.meter, icon: KIND_ICON.meter }
    },
    mapCenter: MAP_CENTER,
    reportTime: "2026-10-14 10:28:00",
    cameras: RAW.cameras || []
  };

  var PAGE_SIZE = 10;
  var POINT_PAGE_SIZE = 10;
  var STATUS_TEXT = { online: "在线 / 正常", warn: "预警", fault: "故障", offline: "离线" };
  var STATUS_SHORT = { online: "在线", warn: "预警", fault: "故障", offline: "离线" };
  var STATUS_FILTER = { online: ["online"], offline: ["offline", "fault"], warn: ["warn", "fault"] };
  var CHART_COLORS = ["#135AFA", "#14C9BA", "#F7BA1E", "#F53F57", "#9359E3", "#2E9BD6"];
  var VIDEO_SYSTEM = "视频监控系统";
  var LIVE_IMAGE = "../../assets/images/access-gate.jpg";
  var PTZ_PAD = [
    ["up-left", "fa-arrow-up-left", "向左上"], ["up", "fa-arrow-up", "向上"], ["up-right", "fa-arrow-up-right", "向右上"],
    ["left", "fa-arrow-left", "向左"], ["stop", "fa-stop", "停止"], ["right", "fa-arrow-right", "向右"],
    ["down-left", "fa-arrow-down-left", "向左下"], ["down", "fa-arrow-down", "向下"], ["down-right", "fa-arrow-down-right", "向右下"]
  ];

  var state = {
    mode: "system",
    system: "all",
    spaceField: "",
    spaceValue: "",
    status: "all",
    hidden: {},
    collapsed: {},
    panels: { left: false, right: false },
    tablePage: 1,
    current: null,
    tab: "info",
    history: [],
    historyRows: [],
    historyPage: 1,
    from: "",
    to: "",
    period: "today",
    chartMetrics: [0]
  };

  var listState = {
    mode: "system",
    system: "power",
    status: "all",
    spacePath: { project: "", corridor: "", room: "", section: "" },
    collapsed: {},
    filters: { category: "", name: "", code: "", from: "", to: "" },
    detailTab: "info",
    detailId: "",
    historyPeriod: "today",
    historyPage: 1
  };

  var view = "panorama";
  var map = null;
  var markerLayer = null;
  var baseMap = null;

  var el = function (id) { return document.getElementById(id); };
  var esc = function (v) { return String(v === undefined || v === null ? "" : v).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); };
  var fmt = function (n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ","); };
  var VIDEO_DEVICES = (D.cameras || []).map(function (cam, index) {
    var type = /半球/.test(cam.name) ? "半球摄像机" : /球/.test(cam.name) ? "球型摄像机" : "枪式摄像机";
    var online = cam.status !== "离线";
    return {
      id: "VIDEO-" + (index + 1),
      name: cam.name,
      code: "VIDEO-" + String(index + 1).padStart(2, "0"),
      system: "视频监控系统",
      type: type,
      status: online ? "online" : "offline",
      rawStatus: online ? "online" : "offline",
      statusLabel: online ? "在线" : "离线",
      isAlarm: false,
      color: "#135AFA",
      icon: "fa-video",
      project: "",
      corridor: cam.corridor || "",
      room: cam.cabin || "",
      section: cam.section || "",
      lat: MAP_CENTER[0] + (index - 1) * 0.0014,
      lng: MAP_CENTER[1] + (index - 1) * 0.0018,
      lastSeen: "",
      time: "",
      metrics: [],
      video: true,
      ptz: type === "球型摄像机",
      channel: "CH" + String(index + 1).padStart(2, "0"),
      resolution: "1920×1080"
    };
  });
  var byId = function (id) { return DEVICES.concat(VIDEO_DEVICES).filter(function (d) { return d.id === id; })[0]; };

  (D.spatialTree || []).forEach(function (p) {
    p.corridors.forEach(function (c) { c.cabins.forEach(function (b) { state.collapsed["cabin:" + b.name] = true; }); });
  });

  function matches(device, opts) {
    opts = opts || {};
    if (!opts.ignoreSystem && state.system !== "all" && device.system !== state.system) return false;
    if (!opts.ignoreHidden && state.hidden[device.type]) return false;
    if (!opts.ignoreStatus && state.status !== "all") {
      var filter = STATUS_FILTER[state.status] || [state.status];
      /* 预警芯片同时覆盖预警与报警 */
      if (state.status === "warn") {
        if (!(isWarnRaw(device.rawStatus) || device.status === "warn")) return false;
      } else if (filter.indexOf(device.status) < 0) return false;
      if (state.status === "offline" && device.isAlarm) return false;
      if (state.status === "online" && isWarnRaw(device.rawStatus)) return false;
    }
    if (!opts.ignoreSpace && state.spaceField && device[state.spaceField] !== state.spaceValue) return false;
    return true;
  }
  function mapDevices() { return DEVICES.concat(VIDEO_DEVICES); }
  function visibleDevices() { return mapDevices().filter(function (d) { return matches(d); }); }
  function legendPool() { return mapDevices().filter(function (d) { return matches(d, { ignoreHidden: true }); }); }
  function treePool() { return mapDevices().filter(function (d) { return matches(d, { ignoreSystem: true }); }); }
  function countOf(field, value) { return treePool().filter(function (d) { return d[field] === value; }).length; }

  function displayStatus(d) {
    if (d.isAlarm) return { key: "fault", text: "报警" };
    if (d.rawStatus === "normal") return { key: "online", text: "正常" };
    return { key: d.status, text: STATUS_SHORT[d.status] || d.statusLabel || d.status };
  }

  function renderMetrics() {
    var sum = { total: 0, online: 0, warn: 0, fault: 0, offline: 0 };
    DEVICES.forEach(function (d) {
      sum.total += 1;
      if (d.rawStatus === "normal") sum.online += 1;
      else if (isWarnRaw(d.rawStatus)) sum.warn += 1;
      else if (d.rawStatus === "fault") sum.fault += 1;
      else if (d.rawStatus === "offline") sum.offline += 1;
    });
    el("dmMetricTotal").textContent = fmt(sum.total);
    el("dmMetricOnline").textContent = fmt(sum.online);
    el("dmMetricWarn").textContent = fmt(sum.warn);
    el("dmMetricFault").textContent = fmt(sum.fault + sum.offline);
    el("dmMetricOnlineRate").textContent = sum.total ? (sum.online / sum.total * 100).toFixed(1) + "%" : "0%";
    el("dmMetricFaultRate").textContent = sum.total ? ((sum.fault + sum.offline) / sum.total * 100).toFixed(1) + "%" : "0%";
    var sub = el("dmMetricWarnSystems");
    if (sub) {
      var alarmN = DEVICES.filter(function (d) { return d.isAlarm; }).length;
      var warnN = DEVICES.filter(function (d) {
        return d.rawStatus === "warn";
      }).length;
      sub.textContent = "报警 " + alarmN + " · 预警 " + warnN;
    }
  }

  function treeRow(level, kind, value, name, count, options) {
    options = options || {};
    var active = false;
    if (kind === "system") active = state.system === value;
    if (kind !== "system") active = state.spaceField === kind && state.spaceValue === value;
    var key = options.collapseKey || "";
    var hasToggle = !!key;
    var expanded = hasToggle && !state.collapsed[key];
    var toggle = hasToggle
      ? '<button class="dm-tree-toggle" type="button" data-dm-toggle="' + esc(key) + '" aria-label="' + (expanded ? "收起" : "展开") + '">' + (expanded ? "−" : "+") + "</button>"
      : '<button class="dm-tree-toggle is-leaf" type="button" tabindex="-1" aria-hidden="true"></button>';
    return '<div class="dm-tree-row' + (active ? " is-active" : "") + '" data-dm-kind="' + esc(kind) + '" data-dm-value="' + esc(value) + '" role="treeitem" style="padding-left:' + (level * 14 + 6) + 'px">'
      + toggle
      + '<span class="dm-tree-name" title="' + esc(name) + '">' + esc(name) + "</span>"
      + '<span class="dm-tree-count">' + count + "</span>"
      + "</div>";
  }

  function renderTree() {
    var host = el("dmTree");
    if (!host) return;
    var html = "";
    if (state.mode === "system") {
      var pool = treePool();
      html += treeRow(0, "system", "all", "全部系统", pool.length, { collapseKey: "systemRoot" });
      if (!state.collapsed.systemRoot) {
        (D.systems || []).forEach(function (s) {
          var count = pool.filter(function (d) { return d.system === s.name; }).length;
          html += treeRow(1, "system", s.name, s.name, count);
        });
        var videoCount = pool.filter(function (d) { return d.system === "视频监控系统"; }).length;
        html += treeRow(1, "system", "视频监控系统", "视频监控系统", videoCount);
      }
    } else {
      (D.spatialTree || []).forEach(function (project) {
        html += treeRow(0, "project", project.name, project.name, countOf("project", project.name), { collapseKey: "project:" + project.name });
        if (state.collapsed["project:" + project.name]) return;
        project.corridors.forEach(function (corridor) {
          html += treeRow(1, "corridor", corridor.name, corridor.name, countOf("corridor", corridor.name), { collapseKey: "corridor:" + corridor.name });
          if (state.collapsed["corridor:" + corridor.name]) return;
          corridor.cabins.forEach(function (cabin) {
            html += treeRow(2, "room", cabin.name, cabin.name, countOf("room", cabin.name), { collapseKey: "cabin:" + cabin.name });
            if (state.collapsed["cabin:" + cabin.name]) return;
            cabin.sections.forEach(function (section) {
              html += treeRow(3, "section", section, section, countOf("section", section));
            });
          });
        });
      });
    }
    host.innerHTML = html || '<div class="dm-tree-empty">暂无可选维度</div>';
  }

  function renderLegend() {
    var host = el("dmLegendBody");
    if (!host) return;
    var names = [];
    legendPool().forEach(function (d) { if (names.indexOf(d.type) < 0) names.push(d.type); });
    el("dmLegendScope").textContent = state.system === "all" ? "电力监测" : state.system;
    if (!names.length) { host.innerHTML = '<div class="dm-legend-empty">当前系统暂无设备分类</div>'; return; }
    host.innerHTML = names.map(function (name) {
      var style = (D.categoryStyles || {})[name] || { color: "#6B7B8C" };
      var off = !!state.hidden[name];
      return '<button class="dm-legend-item' + (off ? " is-off" : "") + '" type="button" data-dm-cat="' + esc(name) + '" title="' + (off ? "点击显示" : "点击隐藏") + '">'
        + '<i class="fa-solid ' + (off ? "fa-square" : "fa-square-check") + '"></i>'
        + '<i class="dm-legend-swatch" style="--dm-c:' + esc(style.color) + '"></i>'
        + "<span>" + esc(name) + "</span></button>";
    }).join("");
  }

  function pointPages(total) { return Math.max(1, Math.ceil(total / POINT_PAGE_SIZE)); }

  function renderTable() {
    var list = visibleDevices();
    var pages = pointPages(list.length);
    state.tablePage = Math.min(Math.max(1, state.tablePage), pages);
    var rows = list.slice((state.tablePage - 1) * POINT_PAGE_SIZE, state.tablePage * POINT_PAGE_SIZE);
    var body = el("dmTableBody");
    if (body) {
      body.innerHTML = rows.length ? rows.map(function (d, index) {
        var st = displayStatus(d);
        return '<tr data-dm-id="' + esc(d.id) + '">'
          + '<td class="dm-col-index">' + ((state.tablePage - 1) * POINT_PAGE_SIZE + index + 1) + "</td>"
          + '<td class="dm-cell-name" title="' + esc(d.name) + '">' + esc(d.name) + "</td>"
          + '<td class="dm-cell-code" title="' + esc(d.code) + '">' + esc(d.code) + "</td>"
          + '<td title="' + esc(st.text) + '"><span class="dm-state ' + st.key + '"><i></i>' + esc(st.text) + "</span></td>"
          + '<td title="' + esc(d.type) + '">' + esc(d.type) + "</td>"
          + '<td class="dm-col-op"><button class="dm-link" type="button" data-dm-view="' + esc(d.id) + '">查看</button></td>'
          + "</tr>";
      }).join("") : '<tr><td class="dm-empty" colspan="6">当前筛选条件下暂无监测点位</td></tr>';
    }
    renderPointPager(list.length, pages);
    el("dmPointCount").textContent = list.length;
    var scope = "所属系统：" + (state.system === "all" ? "电力监测" : state.system);
    if (state.spaceValue) scope += "　空间维度：" + state.spaceValue;
    el("dmScope").textContent = scope;
  }

  function renderPointPager(total, pages) {
    var host = el("dmPointPager");
    if (!host) return;
    if (!total) { host.innerHTML = ""; return; }
    var html = '<button class="dm-page-btn" type="button" data-dm-point-page="prev"' + (state.tablePage <= 1 ? " disabled" : "") + ' aria-label="上一页"><i class="fa-solid fa-angle-left"></i></button>';
    for (var i = 1; i <= pages; i += 1) {
      html += '<button class="dm-page-btn' + (i === state.tablePage ? " is-active" : "") + '" type="button" data-dm-point-page="' + i + '" aria-label="第 ' + i + ' 页">' + i + "</button>";
    }
    html += '<button class="dm-page-btn" type="button" data-dm-point-page="next"' + (state.tablePage >= pages ? " disabled" : "") + ' aria-label="下一页"><i class="fa-solid fa-angle-right"></i></button>';
    html += '<span class="dm-pager-size">每页 ' + POINT_PAGE_SIZE + " 条</span>";
    host.innerHTML = html;
  }

  function initMap() {
    var host = el("dmMap");
    if (!host) return;
    baseMap = window.BASE_MAP ? window.BASE_MAP.create(host, { center: D.mapCenter, zoom: 14 }) : null;
    map = baseMap ? baseMap.map : null;
    if (!map) return;
    markerLayer = L.layerGroup().addTo(map);
    renderMap();
    window.setTimeout(function () { map.invalidateSize(); }, 150);
  }

  function renderMap() {
    if (!map || !markerLayer) return;
    markerLayer.clearLayers();
    visibleDevices().forEach(function (d) {
      if (d.lat == null || d.lng == null) return;
      var cls = "dm-marker";
      if (d.isAlarm) cls += " is-fault is-alarm";
      else if (d.status !== "online") cls += " is-" + d.status;
      var icon = L.divIcon({
        className: "dm-marker-wrap",
        html: '<span class="' + cls + '" style="--dm-c:' + esc(d.color) + '"><i class="fa-solid ' + esc(d.icon) + '"></i></span>',
        iconSize: [24, 24], iconAnchor: [12, 12]
      });
      var marker = L.marker([d.lat, d.lng], { icon: icon, riseOnHover: true, keyboard: false });
      window.BASE_MAP && window.BASE_MAP.bindTip(marker, d.name);
      marker.on("click", function () { openDetail(d.id); });
      marker.addTo(markerLayer);
    });
  }

  function renderAll() {
    renderMetrics();
    renderTree();
    renderLegend();
    renderTable();
    renderMap();
  }


  function renderInfo() {
    var d = state.current;
    el("dmModalTitle").textContent = "设备详情";
    document.querySelector('[data-dm-panel="info"]').innerHTML = window.DEVICE_DETAIL_INFO.html(d, esc);
  }

  function metricDisplay(m) {
    if (typeof m.value === "number") return Number(m.value).toFixed(m.decimals == null ? 1 : m.decimals);
    return String(m.value == null ? "—" : m.value);
  }

  function isVideoDevice(d) { return !!(d && (d.video || d.system === VIDEO_SYSTEM)); }

  function videoFeedHtml(d) {
    var offline = d.status === "offline";
    var statusText = offline ? "离线" : (d.status === "warn" ? "预警" : "在线");
    var time = d.lastSeen || d.time || (D.reportTime || "");
    var screen = '<div class="video-screen' + (offline ? " is-offline" : "") + '" data-dm-live-time="' + esc(time) + '">';
    screen += offline
      ? '<div class="dm-feed-offline"><i class="fa-solid fa-video-slash"></i><span>视频信号中断</span><em>该点位当前离线</em></div>'
      : '<img src="' + LIVE_IMAGE + '" alt="' + esc(d.name) + '实时监控画面">';
    if (!offline && d.ptz) {
      screen += '<button type="button" class="video-ptz-trigger" data-dm-ptz-toggle aria-label="' + esc(d.name) + '云台控制" title="云台控制"><i class="fa-solid fa-arrows-up-down-left-right"></i></button>';
    }
    screen += '<button type="button" class="video-fullscreen" data-dm-fullscreen aria-label="全屏查看' + esc(d.name) + '" title="全屏查看"><i class="fa-solid fa-expand"></i></button>';
    if (!offline && d.ptz) {
      screen += '<div class="video-ptz" id="dmLivePtz" hidden>'
        + '<div class="video-ptz-head"><span>云台控制</span></div>'
        + '<button type="button" class="video-ptz-close" data-dm-ptz-close aria-label="关闭云台控制"><i class="fa-solid fa-xmark"></i></button>'
        + '<div class="video-ptz-camera">' + esc(d.name) + " · " + statusText + "</div>"
        + '<div class="ptz-pad" aria-label="云台方向控制">'
        + PTZ_PAD.map(function (item) {
          return '<button type="button"' + (item[0] === "stop" ? ' class="stop"' : "") + ' data-dm-ptz="' + item[0] + '" aria-label="' + item[2] + '"><i class="fa-solid ' + item[1] + '"></i></button>';
        }).join("") + "</div></div>";
    }
    screen += "</div>";
    return '<div class="dm-live-video"><div class="video-feed" data-dm-feed="' + esc(d.id) + '">'
      + '<div class="video-feed-title"><span>' + esc(d.name) + '</span><span class="dm-feed-status is-' + esc(d.status) + '">' + statusText + "</span></div>"
      + screen + "</div></div>";
  }

  function renderLive() {
    var d = state.current;
    var host = document.querySelector('[data-dm-panel="live"]');
    if (!host) return;
    if (isVideoDevice(d)) { host.innerHTML = videoFeedHtml(d); return; }
    var metrics = d.metrics || [];
    if (!metrics.length) {
      host.innerHTML = '<div class="dm-live-grid"><div class="dm-live-card"><span class="dm-live-name">状态</span><div class="dm-live-value">' + esc(displayStatus(d).text) + "</div><span class=\"dm-live-time\">" + esc(d.lastSeen || D.reportTime) + "</span></div></div>";
      return;
    }
    host.innerHTML = '<div class="dm-live-grid">' + metrics.map(function (m) {
      var alarm = m.status === "warning" || m.status === "danger";
      return '<div class="dm-live-card' + (alarm ? " is-alarm" : "") + '">'
        + '<span class="dm-live-name">' + esc(m.name) + "</span>"
        + '<div class="dm-live-value">' + esc(metricDisplay(m)) + (m.unit ? '<span class="dm-live-unit">' + esc(m.unit) + "</span>" : "") + "</div>"
        + '<span class="dm-live-time">' + esc(d.lastSeen || D.reportTime) + "</span>"
        + "</div>";
    }).join("") + "</div>";
  }

  function buildHistory(device) {
    var rows = [];
    for (var i = 0; i < 11; i += 1) {
      var hour = 12 - Math.floor(i / 2);
      var minute = i % 2 === 0 ? "00" : "30";
      var values = (device.metrics || []).map(function (m) {
        return metricDisplay(m);
      });
      rows.push({ time: "2026-10-14 " + String(Math.max(0, hour)).padStart(2, "0") + ":" + minute + ":00", values: values });
    }
    return rows;
  }

  function renderHistory() {
    var d = state.current;
    var cols = d.metrics || [];
    document.querySelector('[data-dm-panel="history"]').innerHTML =
      '<h3 class="dm-block-title">历史数据</h3>'
      + '<div class="dm-filter-bar">'
      + '<span class="dm-filter-label">数据接收时间</span>'
      + '<input type="date" id="dmHistoryFrom" value="' + esc(state.from) + '">'
      + '<span class="dm-filter-sep">-</span>'
      + '<input type="date" id="dmHistoryTo" value="' + esc(state.to) + '">'
      + '<button class="btn btn-primary" type="button" id="dmHistorySearch">搜索</button>'
      + '<button class="btn btn-secondary" type="button" id="dmHistoryReset">重置</button>'
      + "</div>"
      + '<div class="dm-history-table-wrap"><table class="dm-table dm-history-table"><thead><tr><th>数据接收时间</th>'
      + cols.map(function (m) { return "<th>" + esc(m.name) + "</th>"; }).join("")
      + '</tr></thead><tbody id="dmHistoryBody"></tbody></table></div>'
      + '<div class="dm-pager"><span class="dm-pager-total">共 <b id="dmHistoryTotal">0</b> 条，每页显示 ' + PAGE_SIZE + " 条</span><span id=\"dmPagerButtons\"></span></div>";
    state.history = buildHistory(d);
    renderHistoryRows();
    bindHistoryFilter();
  }

  function renderHistoryRows() {
    var d = state.current;
    state.historyRows = state.history.filter(function (row) {
      var day = row.time.slice(0, 10);
      if (state.from && day < state.from) return false;
      if (state.to && day > state.to) return false;
      return true;
    });
    var pages = Math.max(1, Math.ceil(state.historyRows.length / PAGE_SIZE));
    state.historyPage = Math.min(Math.max(1, state.historyPage), pages);
    var rows = state.historyRows.slice((state.historyPage - 1) * PAGE_SIZE, state.historyPage * PAGE_SIZE);
    var body = el("dmHistoryBody");
    if (body) {
      body.innerHTML = rows.length ? rows.map(function (row) {
        return "<tr><td>" + esc(row.time) + "</td>" + row.values.map(function (v) { return "<td>" + esc(v) + "</td>"; }).join("") + "</tr>";
      }).join("") : '<tr><td class="dm-empty" colspan="' + ((d.metrics || []).length + 1) + '">当前时间范围内暂无数据</td></tr>';
    }
    el("dmHistoryTotal").textContent = state.historyRows.length;
    var buttons = '<button class="dm-page-btn" type="button" data-dm-page="prev"' + (state.historyPage <= 1 ? " disabled" : "") + ">‹</button>";
    for (var i = 1; i <= pages; i += 1) buttons += '<button class="dm-page-btn' + (i === state.historyPage ? " is-active" : "") + '" type="button" data-dm-page="' + i + '">' + i + "</button>";
    buttons += '<button class="dm-page-btn" type="button" data-dm-page="next"' + (state.historyPage >= pages ? " disabled" : "") + ">›</button>";
    el("dmPagerButtons").innerHTML = buttons;
  }

  function bindHistoryFilter() {
    el("dmHistorySearch").addEventListener("click", function () {
      state.from = el("dmHistoryFrom").value;
      state.to = el("dmHistoryTo").value;
      state.historyPage = 1;
      renderHistoryRows();
    });
    el("dmHistoryReset").addEventListener("click", function () {
      state.from = ""; state.to = ""; state.historyPage = 1;
      el("dmHistoryFrom").value = ""; el("dmHistoryTo").value = "";
      renderHistoryRows();
    });
    var pager = el("dmPagerButtons");
    pager.addEventListener("click", function (event) {
      var button = event.target.closest("[data-dm-page]");
      if (!button || button.disabled) return;
      var pages = Math.max(1, Math.ceil(state.historyRows.length / PAGE_SIZE));
      var action = button.dataset.dmPage;
      if (action === "prev") state.historyPage = Math.max(1, state.historyPage - 1);
      else if (action === "next") state.historyPage = Math.min(pages, state.historyPage + 1);
      else state.historyPage = Number(action);
      renderHistoryRows();
    });
  }

  function closeVideoPtz() {
    var panel = el("dmLivePtz");
    if (panel) panel.hidden = true;
    document.querySelectorAll("[data-dm-ptz-toggle]").forEach(function (button) { button.classList.remove("is-active"); });
  }
  function toggleFeedFullscreen(feed) {
    if (!feed) return;
    if (document.fullscreenElement) { if (document.exitFullscreen) document.exitFullscreen(); return; }
    if (feed.requestFullscreen) feed.requestFullscreen();
    else feed.classList.toggle("is-fullscreen");
  }
  function openDetail(id) {
    var device = byId(id);
    if (!device) return;
    state.current = device;
    state.tab = "info";
    state.historyPage = 1;
    state.from = ""; state.to = "";
    var modal = document.querySelector(".dm-modal");
    var historyTab = document.querySelector('[data-dm-tab="history"]');
    var video = isVideoDevice(device);
    if (modal) modal.classList.toggle("is-video", video);
    if (historyTab) historyTab.hidden = video;
    el("dmModalMask").classList.add("is-open");
    document.body.style.overflow = "hidden";
    renderInfo();
    renderLive();
    renderHistory();
    setTab("info");
  }
  function closeDetail() {
    closeVideoPtz();
    document.querySelectorAll(".video-feed.is-fullscreen").forEach(function (feed) { feed.classList.remove("is-fullscreen"); });
    el("dmModalMask").classList.remove("is-open");
    var modal = document.querySelector(".dm-modal");
    var historyTab = document.querySelector('[data-dm-tab="history"]');
    if (modal) modal.classList.remove("is-video");
    if (historyTab) historyTab.hidden = false;
    document.body.style.overflow = "";
  }
  function setTab(tab) {
    if (tab === "history" && isVideoDevice(state.current)) tab = "info";
    state.tab = tab;
    document.querySelectorAll("[data-dm-tab]").forEach(function (b) { b.classList.toggle("is-active", b.dataset.dmTab === tab); });
    document.querySelectorAll("[data-dm-panel]").forEach(function (p) { p.hidden = p.dataset.dmPanel !== tab; });
  }

  /* ---------------- 列表视图（对齐 environment-quality） ---------------- */
  function emptyPath() { return { project: "", corridor: "", room: "", section: "" }; }
  function pathKey(path) {
    return [path.project || "", path.corridor || "", path.room || "", path.section || ""].join("\u0001");
  }
  function samePath(a, b) { return pathKey(a) === pathKey(b); }
  function matchSpacePath(device, path) {
    if (path.project && device.project !== path.project) return false;
    if (path.corridor && device.corridor !== path.corridor) return false;
    if (path.room && device.room !== path.room) return false;
    if (path.section && device.section !== path.section) return false;
    return true;
  }
  function listChipStatus(item) {
    if (item.status === "offline" || item.rawStatus === "offline") return "offline";
    if (item.isAlarm || isWarnRaw(item.rawStatus) || item.status === "warn" || item.status === "fault") return "warn";
    return "online";
  }
  /* 系统类型选「视频监控」时只嵌视频；空间类型始终展示电力设备列表 */
  function showIntrusionList() {
    if (listState.mode === "system" && listState.system === "video") return false;
    return true;
  }
  function countOfPath(path) {
    return DEVICES.filter(function (d) {
      if (listState.status !== "all" && listChipStatus(d) !== listState.status) return false;
      return matchSpacePath(d, path);
    }).length;
  }
  function listVisible() {
    var nameQ = listState.filters.name.toLowerCase();
    var codeQ = listState.filters.code.toLowerCase();
    var category = listState.filters.category || "";
    return DEVICES.filter(function (item) {
      if (listState.status !== "all" && listChipStatus(item) !== listState.status) return false;
      if (listState.mode === "space" && !matchSpacePath(item, listState.spacePath)) return false;
      if (category && item.type !== category) return false;
      if (nameQ && !(item.name || "").toLowerCase().includes(nameQ)) return false;
      if (codeQ && !(item.code || "").toLowerCase().includes(codeQ)) return false;
      var day = (item.time || "").slice(0, 10);
      if (listState.filters.from && day && day < listState.filters.from) return false;
      if (listState.filters.to && day && day > listState.filters.to) return false;
      return true;
    });
  }

  function renderQualityKpis() {
    var total = DEVICES.length;
    var online = DEVICES.filter(function (d) { return listChipStatus(d) === "online"; }).length;
    var offline = DEVICES.filter(function (d) { return listChipStatus(d) === "offline"; }).length;
    var warn = DEVICES.filter(function (d) { return listChipStatus(d) === "warn"; }).length;
    var cards = [
      ["设备总数", total, "fa-solid fa-server", "is-blue"],
      ["在线数", online, "fa-solid fa-link", "is-green"],
      ["离线数", offline, "fa-solid fa-plug-circle-xmark", "is-amber"],
      ["预警数", warn, "fa-solid fa-bell", "is-red"]
    ];
    el("qualityKpis").innerHTML = cards.map(function (c) {
      return '<article class="analysis-kpi ' + c[3] + '">'
        + '<div class="analysis-kpi-icon"><i class="' + c[2] + '"></i></div>'
        + '<div class="analysis-kpi-body">'
        + '<span class="analysis-kpi-label">' + esc(c[0]) + "</span>"
        + '<strong class="analysis-kpi-value">' + esc(c[1]) + "</strong>"
        + "</div></article>";
    }).join("");
  }

  function eqTreeRow(level, path, name, count, options) {
    options = options || {};
    var active = samePath(listState.spacePath, path);
    var key = options.collapseKey || "";
    var hasToggle = !!key;
    var expanded = hasToggle && !listState.collapsed[key];
    var toggle = hasToggle
      ? '<button class="dm-tree-toggle" type="button" data-eq-toggle="' + esc(key) + '" aria-label="' + (expanded ? "收起" : "展开") + '">' + (expanded ? "−" : "+") + "</button>"
      : '<button class="dm-tree-toggle is-leaf" type="button" tabindex="-1" aria-hidden="true"></button>';
    return '<div class="dm-tree-row' + (active ? " is-active" : "") + '" data-eq-project="' + esc(path.project || "") + '" data-eq-corridor="' + esc(path.corridor || "") + '" data-eq-room="' + esc(path.room || "") + '" data-eq-section="' + esc(path.section || "") + '" role="treeitem" style="padding-left:' + (level * 14 + 6) + 'px">'
      + toggle + '<span class="dm-tree-name" title="' + esc(name) + '">' + esc(name) + "</span>"
      + '<span class="dm-tree-count">' + count + "</span></div>";
  }

  function renderEqTree() {
    var host = el("eqTree");
    if (!host) return;
    if (listState.mode === "system") {
      host.innerHTML =
        '<div class="dm-tree-row' + (listState.system === "power" ? " is-active" : "") + '" data-ias-system="power" role="treeitem" style="padding-left:6px">'
        + '<button class="dm-tree-toggle is-leaf" type="button" tabindex="-1" aria-hidden="true"></button>'
        + '<span class="dm-tree-name">电力监测</span>'
        + '<span class="dm-tree-count">' + DEVICES.length + "</span></div>"
        + '<div class="dm-tree-row' + (listState.system === "video" ? " is-active" : "") + '" data-ias-system="video" role="treeitem" style="padding-left:6px">'
        + '<button class="dm-tree-toggle is-leaf" type="button" tabindex="-1" aria-hidden="true"></button>'
        + '<span class="dm-tree-name">视频监控系统</span>'
        + '<span class="dm-tree-count">' + (D.cameras.length) + "</span></div>";
      return;
    }
    var html = "";
    (D.spatialTree || []).forEach(function (project) {
      var projectPath = { project: project.name, corridor: "", room: "", section: "" };
      var projectKey = "project:" + project.name;
      html += eqTreeRow(0, projectPath, project.name, countOfPath(projectPath), { collapseKey: projectKey });
      if (listState.collapsed[projectKey]) return;
      (project.corridors || []).forEach(function (corridor) {
        var corridorPath = { project: project.name, corridor: corridor.name, room: "", section: "" };
        var corridorKey = "corridor:" + pathKey(corridorPath);
        html += eqTreeRow(1, corridorPath, corridor.name, countOfPath(corridorPath), { collapseKey: corridorKey });
        if (listState.collapsed[corridorKey]) return;
        (corridor.cabins || []).forEach(function (cabin) {
          var roomPath = { project: project.name, corridor: corridor.name, room: cabin.name, section: "" };
          var cabinKey = "cabin:" + pathKey(roomPath);
          html += eqTreeRow(2, roomPath, cabin.name, countOfPath(roomPath), { collapseKey: cabinKey });
          if (listState.collapsed[cabinKey]) return;
          (cabin.sections || []).forEach(function (section) {
            var sectionPath = { project: project.name, corridor: corridor.name, room: cabin.name, section: section };
            html += eqTreeRow(3, sectionPath, section, countOfPath(sectionPath));
          });
        });
      });
    });
    host.innerHTML = html || '<div class="dm-tree-empty">暂无可选空间</div>';
  }

  function scopeLabel() {
    if (listState.mode === "system") {
      return listState.system === "video" ? "视频监控系统" : "电力监测";
    }
    var path = listState.spacePath;
    if (!path.project) return "全部空间";
    return [path.project, path.corridor, path.room, path.section].filter(Boolean).join(" / ");
  }

  function renderScopeBar() {
    el("eqScopePath").innerHTML = '<i class="fa-solid fa-location-dot"></i><strong>' + esc(scopeLabel()) + "</strong>";
  }


  function metricAlarm(m) {
    return m && (m.status === "warning" || m.status === "danger");
  }

  function decMetric(value, decimals) {
    var n = Number(value);
    if (Number.isNaN(n)) return esc(value);
    return n.toFixed(decimals == null ? 1 : decimals);
  }

  function buildListHistory(device) {
    var rows = [];
    var i;
    for (i = 0; i < 11; i += 1) {
      var hour = 12 - Math.floor(i / 2);
      var minute = i % 2 === 0 ? "00" : "30";
      var values = (device.metrics || []).map(function (m, mi) {
        if (typeof m.value === "number") {
          var base = Number(m.value) || 0;
          var wave = Math.sin((i + mi) / 3) * (base * 0.03 || 0.2);
          return Number((base + wave).toFixed(m.decimals == null ? 1 : m.decimals));
        }
        return m.value;
      });
      rows.push({
        time: "2026-10-14 " + String(Math.max(0, hour)).padStart(2, "0") + ":" + minute + ":00",
        values: values
      });
    }
    return rows;
  }

  function renderListDetailBody(device) {
    var tab = listState.detailTab || "info";
    var tabs = '<div class="dm-modal-tabs env-detail-tabs" role="tablist">'
      + '<button class="dm-modal-tab' + (tab === "info" ? " is-active" : "") + '" type="button" data-eq-detail-tab="info">设备信息</button>'
      + '<button class="dm-modal-tab' + (tab === "live" ? " is-active" : "") + '" type="button" data-eq-detail-tab="live">实时数据</button>'
      + '<button class="dm-modal-tab' + (tab === "history" ? " is-active" : "") + '" type="button" data-eq-detail-tab="history">历史数据</button>'
      + "</div>";

    var panel = "";
    if (tab === "info") {
      panel = window.DEVICE_DETAIL_INFO.html(device, esc);
    } else if (tab === "live") {
      var metrics = device.metrics || [];
      panel = metrics.length
        ? '<div class="dm-live-grid">' + metrics.map(function (m) {
          var val = typeof m.value === "number" ? decMetric(m.value, m.decimals) : esc(m.value);
          return '<div class="dm-live-card' + (metricAlarm(m) ? " is-alarm" : "") + '">'
            + '<span class="dm-live-name">' + esc(m.name) + "</span>"
            + '<div class="dm-live-value">' + val + (m.unit ? '<span class="dm-live-unit">' + esc(m.unit) + "</span>" : "") + "</div>"
            + '<span class="dm-live-time">' + esc(device.time || "—") + "</span></div>";
        }).join("") + "</div>"
        : '<div class="env-device-metric-empty is-block"><i class="fa-regular fa-folder-open"></i><strong>暂无数据</strong><span>当前设备未上报监测指标</span></div>';
    } else {
      var history = buildListHistory(device);
      var start = ((listState.historyPage || 1) - 1) * PAGE_SIZE;
      var pageRows = history.slice(start, start + PAGE_SIZE);
      var pages = Math.max(1, Math.ceil(history.length / PAGE_SIZE));
      var period = listState.historyPeriod || "today";
      panel = '<h3 class="dm-block-title">历史数据</h3>'
        + '<div class="dm-filter-bar">'
        + '<span class="dm-filter-label">数据接收时间</span>'
        + '<input type="date" data-eq-history-from>'
        + '<span class="dm-filter-sep">-</span>'
        + '<input type="date" data-eq-history-to>'
        + '<button class="btn btn-primary" type="button" data-eq-history-search>搜索</button>'
        + '<button class="btn btn-secondary" type="button" data-eq-history-reset>重置</button>'
        + "</div>"
        + '<div class="dm-history-table-wrap"><table class="dm-table dm-history-table"><thead><tr><th>数据接收时间</th>'
        + (device.metrics || []).map(function (m) { return "<th>" + esc(m.name) + "</th>"; }).join("")
        + "</tr></thead><tbody>"
        + (pageRows.map(function (row) {
          return "<tr><td>" + esc(row.time) + "</td>" + row.values.map(function (v, i) {
            var m = device.metrics[i];
            if (typeof v === "number") return "<td>" + decMetric(v, m && m.decimals) + "</td>";
            return "<td>" + esc(v) + "</td>";
          }).join("") + "</tr>";
        }).join("") || ('<tr><td colspan="' + ((device.metrics || []).length + 1) + '" class="dm-empty">暂无历史数据</td></tr>'))
        + "</tbody></table></div>"
        + '<div class="dm-pager"><span class="dm-pager-total">共 <b>' + history.length + "</b> 条，每页显示 " + PAGE_SIZE + " 条</span>"
        + Array.from({ length: pages }, function (_, i) {
          return '<button class="dm-page-btn' + (listState.historyPage === i + 1 ? " is-active" : "") + '" type="button" data-eq-history-page="' + (i + 1) + '">' + (i + 1) + "</button>";
        }).join("")
        + "</div>"
        + '<div class="dm-chart-head"><h3 class="dm-block-title">历史曲线</h3>'
        + '<div class="dm-period-switch">'
        + '<button type="button" data-eq-period="today"' + (period === "today" ? ' class="is-active"' : "") + ">今日</button>"
        + '<button type="button" data-eq-period="month"' + (period === "month" ? ' class="is-active"' : "") + ">本月</button>"
        + '<button type="button" data-eq-period="year"' + (period === "year" ? ' class="is-active"' : "") + ">本年</button>"
        + "</div></div>"
        + '<div class="dm-chart-legend">'
        + (device.metrics || []).map(function (m, i) {
          return '<span style="--dm-c:' + CHART_COLORS[i % CHART_COLORS.length] + '"><i></i>' + esc(m.name)
            + " <em>" + (typeof m.value === "number" ? decMetric(m.value, m.decimals) : esc(m.value)) + esc(m.unit || "") + "</em></span>";
        }).join("")
        + "</div>"
        + '<div class="dm-chart env-history-chart"><svg viewBox="0 0 640 220" preserveAspectRatio="none" aria-label="历史曲线">'
        + [40, 90, 140, 190].map(function (y) {
          return '<line x1="20" y1="' + y + '" x2="620" y2="' + y + '" stroke="#EDF1F7"/>';
        }).join("")
        + (device.metrics || []).map(function (m, mi) {
          if (typeof m.value !== "number") return "";
          var color = CHART_COLORS[mi % CHART_COLORS.length];
          var pts = history.slice(0, 7).map(function (row, i) {
            var x = 20 + i * 100;
            var base = Number(m.value) || 1;
            var y = 180 - ((Number(row.values[mi]) / (base * 1.2 || 1)) * 120);
            return x + "," + Math.max(30, Math.min(190, y));
          }).join(" ");
          return '<polyline fill="none" stroke="' + color + '" stroke-width="2.5" points="' + pts + '"/>';
        }).join("")
        + "</svg></div>";
    }
    return '<div class="env-device-detail">' + tabs + '<div class="env-detail-panel">' + panel + "</div></div>";
  }

  function refreshListDetail() {
    var device = byId(listState.detailId);
    var body = document.getElementById("drawerBody");
    if (!device || !body) return;
    body.innerHTML = renderListDetailBody(device);
  }

  function openListDetail(id) {
    var item = byId(id);
    if (!item || !window.openAppDrawer) return;
    listState.detailId = id;
    listState.detailTab = "info";
    listState.historyPage = 1;
    listState.historyPeriod = "today";
    window.openAppDrawer({
      title: "设备详情",
      body: renderListDetailBody(item),
      footer: '<button class="btn btn-secondary" type="button" data-drawer-close>关闭</button>'
    });
    var drawer = document.getElementById("drawer");
    if (drawer) drawer.classList.add("is-wide");
  }

  function renderCards() {
    var intrusion = showIntrusionList();
    el("eqScopeFilters").hidden = !intrusion;
    el("eqStatusBar").hidden = !intrusion;
    el("iasListIntrusion").hidden = !intrusion;
    el("iasListVideo").hidden = intrusion;
    if (!intrusion) {
      el("eqCardGrid").innerHTML = "";
      el("eqCardCount").textContent = "0";
      return;
    }

    var list = listVisible();
    el("eqCardCount").textContent = String(list.length);
    var STATUS_LABEL = { online: "在线", offline: "离线", warn: "预警" };
    el("eqCardGrid").innerHTML = list.map(function (item) {
      var status = listChipStatus(item);
      var alarm = item.isAlarm || status === "warn";
      var metrics = item.metrics || [];
      var bodyHtml = metrics.length
        ? '<div class="env-device-card-metrics">' + metrics.map(function (m) {
          return '<div class="env-device-metric' + (m.status === "danger" || m.status === "warning" ? " is-alarm" : "") + '">'
            + '<span class="env-device-metric-name">' + esc(m.name) + "</span>"
            + "<strong>" + esc(metricDisplay(m)) + "<small>" + esc(m.unit || "") + "</small></strong></div>";
        }).join("") + "</div>"
        : '<div class="env-device-card-metrics"><div class="env-device-metric-empty"><i class="fa-regular fa-folder-open"></i><strong>暂无数据</strong><span>当前设备未上报监测指标</span></div></div>';
      return '<button type="button" class="env-device-card' + (status === "offline" ? " is-offline" : "") + (alarm ? " is-alarm" : "") + '" data-eq-card="' + esc(item.id) + '">'
        + '<div class="env-device-card-head"><div>'
        + '<strong class="env-device-card-name">' + esc(item.name) + "</strong>"
        + "<small>" + esc(item.code) + "</small></div>"
        + '<span class="dm-state ' + esc(status) + '"><i></i>' + esc(STATUS_LABEL[status] || displayStatus(item).text) + "</span></div>"
        + bodyHtml
        + '<div class="env-device-card-foot"><span><i class="fa-regular fa-clock"></i> 上报时间 ' + esc(item.time || "—") + "</span><em>查看详情</em></div>"
        + "</button>";
    }).join("") || '<div class="env-quality-empty">当前筛选条件下暂无监测设备</div>';
  }

  function renderListView() {
    document.querySelectorAll("[data-eq-status]").forEach(function (chip) {
      chip.classList.toggle("is-active", chip.dataset.eqStatus === listState.status);
    });
    document.querySelectorAll("[data-ias-mode]").forEach(function (tab) {
      tab.classList.toggle("is-active", tab.dataset.iasMode === listState.mode);
    });
    renderQualityKpis();
    renderEqTree();
    renderScopeBar();
    renderCards();
  }

  function syncViewTabs(next) {
    document.querySelectorAll("[data-ias-view]").forEach(function (btn) {
      var active = btn.dataset.iasView === next;
      btn.classList.toggle("is-active", active);
      btn.setAttribute("aria-selected", active ? "true" : "false");
    });
  }

  function setView(next) {
    view = next === "list" ? "list" : next === "map" ? "map" : "panorama";
    var mapView = el("iasMapView");
    var listView = el("iasListView");
    var panoView = el("iasPanoramaView");
    var showMap = view === "map";
    var showList = view === "list";
    var showPano = view === "panorama";

    /* .dm-root { display:flex } 会盖掉原生 [hidden]，必须用 !important 的显隐类 */
    mapView.hidden = !showMap;
    listView.hidden = !showList;
    panoView.hidden = !showPano;
    mapView.classList.toggle("ias-view-hidden", !showMap);
    listView.classList.toggle("ias-view-hidden", !showList);
    panoView.classList.toggle("ias-view-hidden", !showPano);

    document.body.classList.toggle("dm-page", showMap);
    document.body.classList.toggle("ias-list-mode", showList);
    document.body.classList.toggle("environment-page", showList);
    document.body.classList.toggle("ias-pano-mode", showPano);
    syncViewTabs(view);

    if (showMap && map) window.setTimeout(function () { map.invalidateSize(); }, 80);
    if (showList) renderListView();
  }

  function bindEvents() {
    document.querySelectorAll("[data-ias-view]").forEach(function (btn) {
      btn.addEventListener("click", function () { setView(btn.dataset.iasView); });
    });

    el("dmModalMask").addEventListener("click", function (event) {
      if (event.target === el("dmModalMask")) closeDetail();
    });
    document.querySelector("[data-dm-close]").addEventListener("click", closeDetail);
    document.querySelectorAll("[data-dm-tab]").forEach(function (button) {
      button.addEventListener("click", function () { setTab(button.dataset.dmTab); });
    });

    document.querySelector('[data-dm-panel="live"]').addEventListener("click", function (event) {
      var ptzToggle = event.target.closest("[data-dm-ptz-toggle]");
      if (ptzToggle) {
        var ptzPanel = el("dmLivePtz");
        if (ptzPanel) {
          ptzPanel.hidden = !ptzPanel.hidden;
          ptzToggle.classList.toggle("is-active", !ptzPanel.hidden);
        }
        return;
      }
      if (event.target.closest("[data-dm-ptz-close]")) { closeVideoPtz(); return; }
      var ptzButton = event.target.closest("[data-dm-ptz]");
      if (ptzButton) {
        var pad = ptzButton.closest(".ptz-pad");
        pad.querySelectorAll("[data-dm-ptz]").forEach(function (button) { button.classList.remove("is-active"); });
        ptzButton.classList.add("is-active");
        return;
      }
      var fullscreen = event.target.closest("[data-dm-fullscreen]");
      if (fullscreen) toggleFeedFullscreen(fullscreen.closest(".video-feed"));
    });

    document.querySelectorAll("[data-dm-status]").forEach(function (chip) {
      chip.addEventListener("click", function () {
        state.status = chip.dataset.dmStatus;
        state.tablePage = 1;
        document.querySelectorAll("[data-dm-status]").forEach(function (item) { item.classList.toggle("is-active", item === chip); });
        renderAll();
      });
    });

    document.querySelectorAll("[data-dm-collapse]").forEach(function (button) {
      button.addEventListener("click", function () {
        var side = button.dataset.dmCollapse;
        var collapsed = !state.panels[side];
        state.panels[side] = collapsed;
        el("dmStage").classList.toggle("is-" + side + "-collapsed", collapsed);
        button.classList.toggle("is-collapsed", collapsed);
        button.title = collapsed ? "展开面板" : "收起面板";
        button.setAttribute("aria-label", collapsed ? "展开" + (side === "left" ? "左侧" : "右侧") + "面板" : "收起" + (side === "left" ? "左侧" : "右侧") + "面板");
        if (map) window.setTimeout(function () { map.invalidateSize(); }, 220);
      });
    });

    el("dmPointPager").addEventListener("click", function (event) {
      var button = event.target.closest("[data-dm-point-page]");
      if (!button || button.disabled) return;
      var pages = pointPages(visibleDevices().length);
      var action = button.dataset.dmPointPage;
      if (action === "prev") state.tablePage = Math.max(1, state.tablePage - 1);
      else if (action === "next") state.tablePage = Math.min(pages, state.tablePage + 1);
      else state.tablePage = Number(action);
      renderTable();
      el("dmTableWrap").scrollTop = 0;
    });

    document.querySelectorAll("[data-dm-mode]").forEach(function (button) {
      button.addEventListener("click", function () {
        state.mode = button.dataset.dmMode;
        if (state.mode === "space") state.system = "all";
        else { state.spaceField = ""; state.spaceValue = ""; }
        state.tablePage = 1;
        document.querySelectorAll("[data-dm-mode]").forEach(function (item) { item.classList.toggle("is-active", item === button); });
        renderAll();
      });
    });

    el("dmTree").addEventListener("click", function (event) {
      var toggle = event.target.closest("[data-dm-toggle]");
      if (toggle && !toggle.classList.contains("is-leaf")) {
        event.stopPropagation();
        var key = toggle.dataset.dmToggle;
        if (state.collapsed[key]) delete state.collapsed[key]; else state.collapsed[key] = true;
        renderTree();
        return;
      }
      var row = event.target.closest("[data-dm-kind]");
      if (!row) return;
      var kind = row.dataset.dmKind;
      var value = row.dataset.dmValue;
      if (kind === "system") {
        state.system = value;
      } else {
        state.spaceField = kind;
        state.spaceValue = state.spaceField === state.spaceValue ? "" : value;
        if (!state.spaceValue) state.spaceField = "";
      }
      state.tablePage = 1;
      renderAll();
    });

    el("dmLegendBody").addEventListener("click", function (event) {
      var item = event.target.closest("[data-dm-cat]");
      if (!item) return;
      var name = item.dataset.dmCat;
      if (state.hidden[name]) delete state.hidden[name]; else state.hidden[name] = true;
      state.tablePage = 1;
      renderAll();
    });

    el("dmTableBody").addEventListener("click", function (event) {
      var viewBtn = event.target.closest("[data-dm-view]");
      if (viewBtn) { openDetail(viewBtn.dataset.dmView); return; }
      var row = event.target.closest("[data-dm-id]");
      if (row) openDetail(row.dataset.dmId);
    });

    document.querySelector(".dm-map-tools").addEventListener("click", function (event) {
      var button = event.target.closest("[data-dm-map]");
      if (!button || !map) return;
      var action = button.dataset.dmMap;
      if (action === "zoom-in") map.zoomIn();
      else if (action === "zoom-out") map.zoomOut();
      else if (action === "reset") map.setView(D.mapCenter, 14);
      else if (action === "fullscreen") {
        var stage = document.querySelector(".dm-stage");
        if (document.fullscreenElement) document.exitFullscreen();
        else stage.requestFullscreen && stage.requestFullscreen();
      }
    });

    document.addEventListener("keydown", function (event) {
      if (event.key !== "Escape" || !el("dmModalMask").classList.contains("is-open")) return;
      if (document.fullscreenElement) { if (document.exitFullscreen) document.exitFullscreen(); return; }
      var ptzPanel = el("dmLivePtz");
      if (ptzPanel && !ptzPanel.hidden) { closeVideoPtz(); return; }
      closeDetail();
    });
    window.addEventListener("resize", function () {
      if (map && view === "map") map.invalidateSize();
    });

    document.querySelectorAll("[data-ias-mode]").forEach(function (tab) {
      tab.addEventListener("click", function () {
        listState.mode = tab.dataset.iasMode;
        if (listState.mode === "space") listState.spacePath = emptyPath();
        renderListView();
      });
    });
    el("eqTree").addEventListener("click", function (event) {
      var toggle = event.target.closest("[data-eq-toggle]");
      if (toggle) {
        event.stopPropagation();
        listState.collapsed[toggle.dataset.eqToggle] = !listState.collapsed[toggle.dataset.eqToggle];
        renderEqTree();
        return;
      }
      var systemRow = event.target.closest("[data-ias-system]");
      if (systemRow) {
        listState.system = systemRow.dataset.iasSystem;
        renderListView();
        return;
      }
      var spaceRow = event.target.closest("[data-eq-project]");
      if (spaceRow && listState.mode === "space") {
        var next = {
          project: spaceRow.dataset.eqProject || "",
          corridor: spaceRow.dataset.eqCorridor || "",
          room: spaceRow.dataset.eqRoom || "",
          section: spaceRow.dataset.eqSection || ""
        };
        listState.spacePath = samePath(listState.spacePath, next) ? emptyPath() : next;
        renderListView();
      }
    });
    document.querySelectorAll("[data-eq-status]").forEach(function (chip) {
      chip.addEventListener("click", function () {
        listState.status = chip.dataset.eqStatus;
        renderListView();
      });
    });
    document.querySelector("[data-eq-action='search']").addEventListener("click", function () {
      document.querySelectorAll("[data-eq-filter]").forEach(function (field) {
        listState.filters[field.dataset.eqFilter] = field.value.trim();
      });
      renderListView();
    });
    document.querySelector("[data-eq-action='reset']").addEventListener("click", function () {
      listState.filters = { category: "", name: "", code: "", from: "", to: "" };
      listState.status = "all";
      document.querySelectorAll("[data-eq-filter]").forEach(function (field) { field.value = ""; });
      renderListView();
    });
    el("eqCardGrid").addEventListener("click", function (event) {
      var card = event.target.closest("[data-eq-card]");
      if (card) openListDetail(card.dataset.eqCard);
    });

    document.addEventListener("click", function (event) {
      var detailTab = event.target.closest("[data-eq-detail-tab]");
      if (detailTab) {
        listState.detailTab = detailTab.dataset.eqDetailTab;
        refreshListDetail();
        return;
      }
      var historyPage = event.target.closest("[data-eq-history-page]");
      if (historyPage) {
        listState.historyPage = Number(historyPage.dataset.eqHistoryPage);
        refreshListDetail();
        return;
      }
      var period = event.target.closest("[data-eq-period]");
      if (period) {
        listState.historyPeriod = period.dataset.eqPeriod;
        refreshListDetail();
        return;
      }
      if (event.target.closest("[data-drawer-close]") || event.target.closest(".drawer-close") || event.target.id === "drawerMask") {
        var drawerEl = document.getElementById("drawer");
        if (drawerEl) drawerEl.classList.remove("is-wide");
      }
    });

    var _closeAppDrawer = window.closeAppDrawer;
    if (typeof _closeAppDrawer === "function") {
      window.closeAppDrawer = function () {
        var drawerEl = document.getElementById("drawer");
        if (drawerEl) drawerEl.classList.remove("is-wide");
        return _closeAppDrawer.apply(this, arguments);
      };
    }
  }

  function initPowerPanoList() {
    var list = el("pwrScreenList");
    var frame = el("pwrPanoFrame");
    if (!list || !frame) return;
    var screens = ((window.ConfigurationData && window.ConfigurationData.hmiScreens) || []).filter(function (s) {
      return s.kind === "power";
    });
    if (!screens.length) {
      screens = [
        { id: "power-wl1", name: "未来一路电力监测", hint: "高压进线 · 变压器 · 低压出线" },
        { id: "power-gx7", name: "高新七路电力监测", hint: "高压进线 · 变压器 · 低压出线" },
        { id: "power-cg", name: "春光路电力监测", hint: "高压进线 · 变压器 · 低压出线" }
      ];
    }
    var activeId = screens[0].id;
    function renderList() {
      list.innerHTML = screens.map(function (s) {
        return '<button type="button" class="pwr-screen-item' + (s.id === activeId ? " active" : "") + '" data-pwr-screen="' + s.id + '" role="option" aria-selected="' + (s.id === activeId ? "true" : "false") + '"><strong>' + s.name + "</strong><small>" + (s.hint || "") + "</small></button>";
      }).join("");
    }
    function setScreen(id) {
      if (!screens.some(function (s) { return s.id === id; })) return;
      activeId = id;
      frame.src = "../network/configuration.html?embed=power&screen=" + encodeURIComponent(id);
      renderList();
    }
    list.addEventListener("click", function (event) {
      var btn = event.target.closest("[data-pwr-screen]");
      if (btn) setScreen(btn.dataset.pwrScreen);
    });
    renderList();
  }

  document.addEventListener("DOMContentLoaded", function () {
    initPowerPanoList();
    initMap();
    bindEvents();
    renderAll();
    setView("panorama");
  });
})();
  </script>
</body>
