<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>广播任务 - 科学岛管廊监控中心</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="../../assets/css/tob-ui.css"><style>.card-title-row{padding:16px 0;gap:16px}.btn-row{gap:8px}</style></head><body data-menu-key="broadcast.tasks" data-page-section="广播管理" data-page-title="广播任务"><div class="app-shell"><aside id="app-sidebar" class="sidebar"></aside><header id="app-header" class="header"></header><main class="main"><div class="screen-frame stack"><section class="card filters"><div class="filter-actions"><label class="form-field"><span class="form-label">任务名称</span><input class="form-control" data-filter="name" placeholder="请输入"></label><label class="form-field"><span class="form-label">任务类型</span><select class="form-control" data-filter="type"><option value="">请选择</option><option>服务器音乐</option><option>HTTP流媒体</option><option>TTS文本</option><option>人工广播</option></select></label><label class="form-field"><span class="form-label">任务状态</span><select class="form-control" data-filter="status"><option value="">请选择</option><option>播放中</option><option>已完成</option><option>已停止</option><option>失败</option></select></label><button class="btn btn-secondary" data-action="reset">重置</button><button class="btn btn-primary" data-action="search">搜索</button></div></section><section class="card"><div class="card-title-row"><h1 class="card-title">广播任务</h1><button class="btn btn-secondary" data-action="refresh"><i class="fa-solid fa-rotate"></i> 刷新</button></div><div class="table-wrap"><table class="table"><thead><tr><th>任务名称</th><th>任务类型</th><th>目标区域</th><th>状态</th><th>发起人</th><th>开始时间</th><th>操作</th></tr></thead><tbody id="taskBody"></tbody></table></div><div class="pagination"><span>共 <strong id="taskCount">0</strong> 条，每页 10 条</span><span class="page-item active">1</span></div></section></div></main></div><script src="../../../app/config/menu.js?v=nav-hide-1"></script><script src="../../../app/components/sidebar.js?v=nav-home-1"></script><script src="../../../app/components/header.js?v=nav-home-1"></script><script src="../../../app/components/drawer.js"></script><script src="../../../app/components/requirement.js"></script><script>const tasks=[{name:'早间消防宣传',type:'服务器音乐',area:'1号楼公共区域',status:'播放中',operator:'admin',time:'2026-09-24 08:30:12',id:'T-20260924001'},{name:'午间通知播报',type:'TTS文本',area:'B1地下室',status:'已完成',operator:'物业管理员',time:'2026-09-24 12:00:02',id:'T-20260924002'},{name:'设备检修提示',type:'HTTP流媒体',area:'2号楼大厅',status:'已停止',operator:'admin',time:'2026-09-23 16:21:08',id:'T-20260923008'},{name:'消防控制室人工广播',type:'人工广播',area:'消防广播区域',status:'失败',operator:'值班员',time:'2026-09-23 14:10:31',id:'T-20260923007'}];const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');function render(list=tasks){taskBody.innerHTML=list.map(t=>`<tr><td>${esc(t.name)}</td><td>${esc(t.type)}</td><td>${esc(t.area)}</td><td><span class="tag ${t.status==='播放中'?'primary':t.status==='失败'?'danger':'success'}">${t.status}</span></td><td>${esc(t.operator)}</td><td>${t.time}</td><td><button class="table-action" data-detail="${t.id}">详情</button>${t.status==='播放中'?`<button class="table-action status-danger" data-stop="${t.id}">停止任务</button>`:''}</td></tr>`).join('');taskCount.textContent=list.length}document.addEventListener('click',e=>{const a=e.target.closest('[data-action]')?.dataset.action;if(a==='reset'){document.querySelectorAll('[data-filter]').forEach(x=>x.value='');render()}if(a==='search'){const f=Object.fromEntries([...document.querySelectorAll('[data-filter]')].map(x=>[x.dataset.filter,x.value]));render(tasks.filter(t=>(!f.name||t.name.includes(f.name))&&(!f.type||t.type===f.type)&&(!f.status||t.status===f.status)))}const detail=e.target.closest('[data-detail]');if(detail){const t=tasks.find(x=>x.id===detail.dataset.detail);window.openAppDrawer({title:'广播任务详情',subtitle:'广播管理 · 广播任务',body:`<div class="detail-grid"><div class="info-item"><span class="info-label">任务ID</span><span class="info-value">${t.id}</span></div><div class="info-item"><span class="info-label">任务名称</span><span class="info-value">${t.name}</span></div><div class="info-item"><span class="info-label">任务类型</span><span class="info-value">${t.type}</span></div><div class="info-item"><span class="info-label">目标区域</span><span class="info-value">${t.area}</span></div><div class="info-item"><span class="info-label">当前状态</span><span class="info-value">${t.status}</span></div><div class="info-item"><span class="info-label">第三方TaskID</span><span class="info-value">${t.id}-REMOTE</span></div></div><h3 class="detail-title">接口日志</h3><pre style="background:#f5f7fc;padding:16px;white-space:pre-wrap">actioncode: c2ls_task_control\nresult: 200\nreturn_message: success</pre>`,footer:'<button class="btn btn-secondary" data-drawer-close>关闭</button>'})}const stop=e.target.closest('[data-stop]');if(stop){const t=tasks.find(x=>x.id===stop.dataset.stop);window.openAppConfirm({title:'停止任务',message:`确认停止「${t.name}」吗？停止后目标终端将停止播放。`,confirmText:'确认停止',onConfirm:()=>{t.status='已停止';render();}})}});render();</script></body></html>
