<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>广播终端 - 科学岛管廊监控中心</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="../../assets/css/tob-ui.css"><style>.card-title-row{padding:16px 0;gap:16px}.btn-row{gap:8px}</style></head><body data-menu-key="broadcast.terminals" data-page-section="广播管理" data-page-title="广播终端"><div class="app-shell"><aside id="app-sidebar" class="sidebar"></aside><header id="app-header" class="header"></header><main class="main"><div class="screen-frame stack"><section class="card filters"><div class="filter-actions"><label class="form-field"><span class="form-label">终端名称</span><input class="form-control" data-filter="name" placeholder="请输入"></label><label class="form-field"><span class="form-label">终端类型</span><select class="form-control" data-filter="type"><option value="">请选择</option><option>网络音箱</option><option>桌面话筒</option></select></label><label class="form-field"><span class="form-label">在线状态</span><select class="form-control" data-filter="status"><option value="">请选择</option><option>在线</option><option>离线</option></select></label><button class="btn btn-secondary" data-action="reset">重置</button><button class="btn btn-primary" data-action="search">搜索</button></div></section><section class="card"><div class="card-title-row"><h1 class="card-title">广播终端</h1><div class="btn-row"><button class="btn btn-secondary" data-action="sync">同步终端</button><button class="btn btn-primary" data-action="group">终端分组</button></div></div><div class="table-wrap"><table class="table"><thead><tr><th>终端名称</th><th>EndpointID</th><th>终端类型</th><th>IP地址</th><th>所属区域</th><th>在线状态</th><th>麦克风能力</th><th>操作</th></tr></thead><tbody id="terminalBody"></tbody></table></div><div class="pagination"><span>共 <strong id="terminalCount">0</strong> 条，每页 10 条</span><span class="page-item active">1</span></div></section></div></main></div><script src="../../../app/config/menu.js?v=nav-hide-1"></script><script src="../../../app/components/sidebar.js?v=nav-home-1"></script><script src="../../../app/components/header.js?v=nav-home-1"></script><script src="../../../app/components/drawer.js"></script><script src="../../../app/components/requirement.js"></script><script>const terminals=[{name:'1号楼公共区域音箱',id:1,type:'网络音箱',ip:'192.168.10.21',area:'1号楼公共区域',status:'在线',mic:'否'},{name:'会议室桌面话筒',id:2,type:'桌面话筒',ip:'192.168.10.22',area:'会议室',status:'在线',mic:'是'},{name:'消防控制室话筒',id:3,type:'桌面话筒',ip:'192.168.10.23',area:'消防控制室',status:'在线',mic:'是'},{name:'B1地下室音箱',id:4,type:'网络音箱',ip:'192.168.20.31',area:'B1地下室',status:'离线',mic:'否'}];function render(list=terminals){terminalBody.innerHTML=list.map(t=>`<tr><td>${t.name}</td><td>${t.id}</td><td>${t.type}</td><td>${t.ip}</td><td>${t.area}</td><td><span class="tag ${t.status==='在线'?'success':'danger'}">${t.status}</span></td><td>${t.mic}</td><td><button class="table-action" data-terminal-detail="${t.id}">详情</button></td></tr>`).join('');terminalCount.textContent=list.length}document.addEventListener('click',e=>{const a=e.target.closest('[data-action]')?.dataset.action;if(a==='reset'){document.querySelectorAll('[data-filter]').forEach(x=>x.value='');render()}if(a==='search'){const f=Object.fromEntries([...document.querySelectorAll('[data-filter]')].map(x=>[x.dataset.filter,x.value]));render(terminals.filter(t=>(!f.name||t.name.includes(f.name))&&(!f.type||t.type===f.type)&&(!f.status||t.status===f.status)))}if(a==='sync')window.openAppConfirm({title:'同步终端',message:'终端信息已从第三方广播平台同步。',confirmText:'知道了'});if(a==='group')window.openAppDrawer({title:'终端分组',subtitle:'广播管理 · 广播终端',body:'<label class="form-field form-item"><span class="form-label form-required">分组名称</span><input class="form-control" value="1号楼公共区域"></label><label class="form-field"><span class="form-label">关联终端</span><select class="form-control" multiple><option selected>1号楼公共区域音箱</option><option>会议室桌面话筒</option></select></label>',footer:'<button class="btn btn-secondary" data-drawer-close>取消</button><button class="btn btn-primary" data-drawer-close>保存</button>'});const d=e.target.closest('[data-terminal-detail]');if(d){const t=terminals.find(x=>x.id===Number(d.dataset.terminalDetail));window.openAppDrawer({title:'广播终端详情',subtitle:'广播管理 · 广播终端',body:`<div class="detail-grid"><div class="info-item"><span class="info-label">终端名称</span><span class="info-value">${t.name}</span></div><div class="info-item"><span class="info-label">EndpointID</span><span class="info-value">${t.id}</span></div><div class="info-item"><span class="info-label">IP地址</span><span class="info-value">${t.ip}</span></div><div class="info-item"><span class="info-label">在线状态</span><span class="info-value">${t.status}</span></div><div class="info-item"><span class="info-label">麦克风能力</span><span class="info-value">${t.mic}</span></div></div>`,footer:'<button class="btn btn-secondary" data-drawer-close>关闭</button>'})}});render();</script></body></html>
