<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>广播控制台 - 科学岛管廊监控中心</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="../../assets/css/tob-ui.css"><style>
.broadcast-tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:20px}.broadcast-tab{border:0;background:#fff;padding:12px 20px;color:var(--text-secondary);cursor:pointer}.broadcast-tab.active{color:var(--primary);border-bottom:2px solid var(--primary);font-weight:600}.broadcast-panel{display:none}.broadcast-panel.active{display:block}.broadcast-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.broadcast-choice{border:1px solid var(--border);padding:16px;background:#fff}.broadcast-choice h3{margin:0 0 12px;color:var(--text-title);font-size:15px}.terminal-checks{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.terminal-check{display:flex;gap:8px;align-items:center;padding:8px;background:var(--primary-bg)}.console-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;padding:0 0 8px}.broadcast-multi{position:relative}.broadcast-multi-trigger{min-height:32px;width:100%;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:4px 32px 4px 8px;border:1px solid #d8dee9;background:#fff;color:var(--text-primary);cursor:pointer;text-align:left}.broadcast-multi-trigger:after{content:'\\f107';font-family:'Font Awesome 6 Free';font-weight:900;position:absolute;right:10px;color:var(--text-secondary)}.broadcast-multi.open .broadcast-multi-trigger:after{transform:rotate(180deg)}.broadcast-multi-tags{display:flex;gap:4px;flex-wrap:wrap;min-width:0}.broadcast-multi-placeholder{color:var(--text-secondary)}.broadcast-multi-tag{display:inline-flex;align-items:center;gap:4px;padding:2px 6px;background:var(--primary-light);color:var(--primary);font-size:12px}.broadcast-multi-tag button{border:0;background:transparent;color:var(--primary);padding:0;cursor:pointer}.broadcast-multi-menu{display:none;position:absolute;z-index:20;top:calc(100% + 4px);left:0;right:0;padding:4px 0;background:#fff;border:1px solid var(--border);box-shadow:0 8px 20px rgba(26,28,31,.12)}.broadcast-multi.open .broadcast-multi-menu{display:block}.broadcast-multi-option{display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer}.broadcast-multi-option:hover,.broadcast-multi-option.is-selected{background:var(--primary-bg);color:var(--primary)}@media(max-width:800px){.broadcast-grid{grid-template-columns:1fr}}
</style></head><body class="broadcast-page" data-menu-key="broadcast.console" data-page-section="广播管理" data-page-title="广播控制台"><div class="app-shell"><aside id="app-sidebar" class="sidebar"></aside><header id="app-header" class="header"></header><main class="main"><div class="screen-frame stack"><section class="page-head"><div><h1 class="page-title">广播控制台</h1><p class="page-desc">统一发起服务器音乐、流媒体、TTS 和人工广播任务。</p></div></section><section class="card"><div class="broadcast-tabs"><button class="broadcast-tab active" data-tab="music">服务器音乐</button><button class="broadcast-tab" data-tab="stream">HTTP流媒体</button><button class="broadcast-tab" data-tab="tts">TTS文本</button><button class="broadcast-tab" data-tab="manual">人工广播</button></div><div class="broadcast-panel active" data-panel="music"><div class="broadcast-grid"><div class="broadcast-choice"><h3>选择音频</h3><label class="form-field form-item"><span class="form-label form-required">广播任务名称</span><input class="form-control" placeholder="请输入任务名称"></label><label class="form-field form-item"><span class="form-label form-required">服务器音乐</span><select class="form-control"><option>消防宣传.mp3 · 03:20</option><option>物业通知.mp3 · 02:18</option><option>国歌.mp3 · 04:12</option></select></label><label class="form-field"><span class="form-label">播放模式</span><select class="form-control"><option>单曲播放</option><option>列表循环</option><option>随机播放</option></select></label></div><div class="broadcast-choice"><h3>播放配置</h3><label class="form-field form-item"><span class="form-label">音量：<strong data-volume-label>60</strong></span><input type="range" min="0" max="100" value="60" data-volume></label><label class="form-field"><span class="form-label">优先级</span><input class="form-control" type="number" value="70" min="1" max="100"></label><h3>目标终端</h3><div class="terminal-checks"><label class="terminal-check"><input type="checkbox" checked> 1号楼公共区域</label><label class="terminal-check"><input type="checkbox"> B1地下室</label><label class="terminal-check"><input type="checkbox"> 2号楼大厅</label><label class="terminal-check"><input type="checkbox"> 消防广播区域</label></div></div></div><div class="console-actions"><button class="btn btn-secondary" data-action="preview">试听</button><button class="btn btn-primary" data-action="start" data-task-type="服务器音乐"><i class="fa-solid fa-play"></i> 开始播放</button></div></div><div class="broadcast-panel" data-panel="stream"><div class="broadcast-grid"><div class="broadcast-choice"><h3>流媒体配置</h3><label class="form-field form-item"><span class="form-label form-required">广播任务名称</span><input class="form-control" placeholder="请输入任务名称"></label><label class="form-field form-item"><span class="form-label form-required">HTTP流媒体地址</span><input class="form-control" value="https://example.com/notice.mp3" placeholder="请输入音频地址"></label><button class="btn btn-secondary" data-action="check-stream">检测地址</button></div><div class="broadcast-choice"><h3>目标终端</h3><div class="terminal-checks"><label class="terminal-check"><input type="checkbox" checked> 1号楼公共区域</label><label class="terminal-check"><input type="checkbox"> 2号楼大厅</label></div><label class="form-field form-item"><span class="form-label">音量</span><input type="range" min="0" max="100" value="60"></label><label class="form-field"><span class="form-label">播放模式</span><select class="form-control"><option>单次播放</option><option>循环播放</option></select></label></div></div><div class="console-actions"><button class="btn btn-primary" data-action="start" data-task-type="HTTP流媒体"><i class="fa-solid fa-play"></i> 开始播放</button></div></div><div class="broadcast-panel" data-panel="tts"><div class="broadcast-grid"><div class="broadcast-choice"><h3>文本内容</h3><label class="form-field form-item"><span class="form-label form-required">任务名称</span><input class="form-control" placeholder="请输入任务名称"></label><label class="form-field"><span class="form-label form-required">播报文本</span><textarea class="form-control textarea" rows="6" placeholder="请输入需要播报的内容"></textarea></label></div><div class="broadcast-choice"><h3>语音配置</h3><label class="form-field form-item"><span class="form-label">TTS引擎</span><select class="form-control"><option>普通话女声</option><option>普通话男声</option></select></label><label class="form-field form-item"><span class="form-label">语速</span><input class="form-control" type="number" value="5" min="1" max="10"></label><label class="form-field form-item"><span class="form-label">重复次数</span><input class="form-control" type="number" value="1" min="1"></label><label class="form-field"><span class="form-label">目标终端</span><select class="form-control"><option>1号楼公共区域</option><option>B1地下室</option></select></label></div></div><div class="console-actions"><button class="btn btn-primary" data-action="start" data-task-type="TTS文本"><i class="fa-solid fa-volume-high"></i> 发起播报</button></div></div><div class="broadcast-panel" data-panel="manual"><div class="broadcast-grid"><div class="broadcast-choice"><h3>发起设备</h3><label class="form-field"><span class="form-label form-required">桌面话筒</span><select class="form-control"><option>会议室桌面话筒 · EndpointID 1</option><option>消防控制室话筒 · EndpointID 3</option></select></label></div><div class="broadcast-choice"><h3>接收设备</h3><div class="terminal-checks"><label class="terminal-check"><input type="checkbox" checked> 1号楼公共区域</label><label class="terminal-check"><input type="checkbox"> 2号楼大厅</label><label class="terminal-check"><input type="checkbox"> 消防广播区域</label></div><label class="form-field"><span class="form-label">音量</span><input type="range" min="0" max="100" value="70"></label></div></div><div class="console-actions"><button class="btn btn-primary" data-action="start" data-task-type="人工广播"><i class="fa-solid fa-microphone"></i> 开始广播</button></div></div></section></div></main></div><script src="../../../app/config/menu.js?v=nav-hide-1"></script><script src="../../../app/components/sidebar.js?v=nav-home-1"></script><script src="../../../app/components/header.js?v=nav-home-1"></script><script src="../../../app/components/drawer.js"></script><script src="../../../app/components/requirement.js"></script><script>document.addEventListener('click',e=>{const tab=e.target.closest('[data-tab]');if(tab){document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===tab));document.querySelectorAll('[data-panel]').forEach(x=>x.classList.toggle('active',x.dataset.panel===tab.dataset.tab));}const action=e.target.closest('[data-action]')?.dataset.action;if(action==='start')window.openAppConfirm({title:'任务已提交',message:`${e.target.closest('[data-action]').dataset.taskType}任务已提交，任务正在排队执行。`,confirmText:'知道了'});if(action==='preview')window.openAppConfirm({title:'试听',message:'试听任务已发送到当前选中的终端。',confirmText:'知道了'});if(action==='check-stream')window.openAppConfirm({title:'地址检测',message:'流媒体地址可访问，音频格式符合要求。',confirmText:'知道了'});});document.addEventListener('input',e=>{if(e.target.matches('[data-volume]'))document.querySelector('[data-volume-label]').textContent=e.target.value;});</script></body></html>
