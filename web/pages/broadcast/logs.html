<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>广播日志 - 科学岛管廊监控中心</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="../../assets/css/tob-ui.css"><style>.log-page .filter-actions{grid-template-columns:repeat(5,minmax(0,1fr));margin-bottom:16px}.log-page .filter-actions .btn{min-width:80px}@media(max-width:900px){.log-page .filter-actions{grid-template-columns:1fr}}</style></head><body class="log-page" data-menu-key="broadcast.logs" data-page-section="广播管理" data-page-title="广播日志"><div class="app-shell"><aside id="app-sidebar" class="sidebar"></aside><header id="app-header" class="header"></header><main class="main"><div class="screen-frame stack"><section class="page-head"><div><h1 class="page-title">广播日志</h1><p class="page-desc">记录平台广播操作。</p></div></section><section class="card"><div class="filter-actions"><label class="form-field"><span class="form-label">操作人</span><input class="form-control" data-filter="operator" placeholder="请输入"></label><label class="form-field"><span class="form-label">任务名称</span><input class="form-control" data-filter="name" placeholder="请输入"></label><label class="form-field"><span class="form-label">任务类型</span><select class="form-control" data-filter="type"><option value="">请选择</option><option>服务器音乐</option><option>HTTP流媒体</option><option>TTS文本</option><option>人工广播</option></select></label><label class="form-field"><span class="form-label">操作结果</span><select class="form-control" data-filter="result"><option value="">请选择</option><option>成功</option><option>失败</option></select></label><button class="btn btn-secondary" data-action="reset">重置</button><button class="btn btn-primary" data-action="search">搜索</button></div><div class="card-title-row"><h2 class="card-title">操作日志</h2><span>共 <strong id="operationCount">0</strong> 条</span></div><div class="table-wrap"><table class="table"><thead><tr><th>操作人</th><th>操作时间</th><th>操作类型</th><th>任务ID</th><th>任务名称</th><th>任务类型</th><th>操作结果</th><th>IP地址</th><th>操作</th></tr></thead><tbody id="operationBody"></tbody></table></div><div class="pagination"><span>共 <strong id="pageCount">0</strong> 条记录，每页 10 条</span><span class="page-item active">1</span></div></section></div></main></div><script src="../../../app/config/menu.js?v=nav-hide-1"></script><script src="../../../app/components/sidebar.js?v=nav-home-1"></script><script src="../../../app/components/header.js?v=nav-home-1"></script><script src="../../../app/components/drawer.js"></script><script src="../../../app/components/requirement.js"></script><script>
const logs=[{operator:'admin',time:'2026-09-24 10:12:20',action:'发起播放',id:'T-20260924001',name:'早间消防宣传',type:'服务器音乐',result:'成功',ip:'192.168.1.20'},{operator:'物业管理员',time:'2026-09-24 10:02:11',action:'停止任务',id:'T-20260923008',name:'设备检修提示',type:'HTTP流媒体',result:'成功',ip:'192.168.1.21'},{operator:'值班员',time:'2026-09-24 09:55:42',action:'发起播报',id:'T-20260924002',name:'午间通知播报',type:'TTS文本',result:'失败',ip:'192.168.1.22'}];const esc=value=>String(value??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');function render(list=logs){operationBody.innerHTML=list.map((x,index)=>`<tr><td>${esc(x.operator)}</td><td>${esc(x.time)}</td><td>${esc(x.action)}</td><td>${esc(x.id)}</td><td>${esc(x.name)}</td><td>${esc(x.type)}</td><td><span class="tag ${x.result==='成功'?'success':'danger'}">${esc(x.result)}</span></td><td>${esc(x.ip)}</td><td><button class="table-action" data-detail="${index}">详情</button></td></tr>`).join('');operationCount.textContent=list.length;pageCount.textContent=list.length}function openDetail(log){window.openAppDrawer({title:'操作日志详情',subtitle:'广播管理 · 广播日志',body:`<div class="detail-grid"><div class="info-item"><span class="info-label">操作人</span><span class="info-value">${esc(log.operator)}</span></div><div class="info-item"><span class="info-label">操作时间</span><span class="info-value">${esc(log.time)}</span></div><div class="info-item"><span class="info-label">操作类型</span><span class="info-value">${esc(log.action)}</span></div><div class="info-item"><span class="info-label">任务ID</span><span class="info-value">${esc(log.id)}</span></div><div class="info-item"><span class="info-label">任务名称</span><span class="info-value">${esc(log.name)}</span></div><div class="info-item"><span class="info-label">任务类型</span><span class="info-value">${esc(log.type)}</span></div><div class="info-item"><span class="info-label">操作结果</span><span class="info-value"><span class="tag ${log.result==='成功'?'success':'danger'}">${esc(log.result)}</span></span></div><div class="info-item"><span class="info-label">IP地址</span><span class="info-value">${esc(log.ip)}</span></div></div>`,footer:'<button class="btn btn-secondary" data-drawer-close>关闭</button>'})}document.addEventListener('click',event=>{const action=event.target.closest('[data-action]')?.dataset.action;if(action==='reset'){document.querySelectorAll('[data-filter]').forEach(input=>input.value='');render()}if(action==='search'){const filter=Object.fromEntries([...document.querySelectorAll('[data-filter]')].map(input=>[input.dataset.filter,input.value]));render(logs.filter(x=>(!filter.operator||x.operator.includes(filter.operator))&&(!filter.name||x.name.includes(filter.name))&&(!filter.type||x.type===filter.type)&&(!filter.result||x.result===filter.result)))}const detail=event.target.closest('[data-detail]');if(detail)openDetail(logs[Number(detail.dataset.detail)])});render();
</script></body></html>
