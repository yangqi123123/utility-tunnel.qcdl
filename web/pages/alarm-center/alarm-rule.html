<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>报警规则 - 科学岛管廊监控中心</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/tob-ui.css">

<body class="alarm-page alarm-rule-page" data-menu-key="alarm-center.rule" data-page-section="报警中心" data-page-title="报警规则">
  <div class="app-shell">
    <aside id="app-sidebar" class="sidebar"></aside>
    <header id="app-header" class="header"></header>
    <main class="main">
      <div class="screen-frame stack">
        <section class="card alarm-filter-card">
          <div class="filter-actions alarm-rule-filter-row">
            <label class="form-field"><span class="form-label">规则名称</span><input class="form-control" data-filter="name" placeholder="请输入规则名称"></label>
            <label class="form-field"><span class="form-label">报警类型</span><select class="form-control" data-filter="type"><option value="">请选择</option><option>设备属性</option><option>设备离线</option></select></label>
            <label class="form-field"><span class="form-label">报警等级</span><select class="form-control" data-filter="level"><option value="">请选择</option><option>告警</option><option>预警</option><option>提醒</option></select></label>
            <button class="btn btn-secondary" type="button" data-action="reset">重置</button>
            <button class="btn btn-primary" type="button" data-action="search">搜索</button>
          </div>
        </section>
        <section class="card alarm-list-card">
          <div class="card-title-row alarm-toolbar"><h1 class="card-title">报警规则列表</h1><button class="btn btn-primary" type="button" data-action="create"><i class="fa-solid fa-plus"></i>新增</button></div>
          <div class="table-wrap"><table class="table alarm-rule-table"><thead><tr><th>序号</th><th>报警规则名称</th><th>报警类型</th><th>报警等级</th><th>关联设备</th><th>启用状态</th><th>操作</th></tr></thead><tbody id="alarmRuleBody"></tbody></table></div>
          <div class="pagination"><span>共 <strong id="alarmRuleCount">0</strong> 条，每页 10 条</span><span class="page-item active">1</span></div>
        </section>
      </div>
    </main>
  </div>
  <script src="../../../app/config/menu.js?v=nav-hide-1"></script>
  <script src="../../../app/components/sidebar.js?v=nav-home-1"></script>
  <script src="../../../app/components/header.js?v=nav-home-1"></script>
  <script src="../../../app/components/drawer.js"></script>
  <script src="../../../app/components/requirement.js"></script>
  <script>
    const alarmRules = [
      { id: 1, name: "配电室设备离线", type: "设备离线", level: "告警", devices: "配电室网关-01、02", status: "启用", description: "配电室网关离线超过 60 秒触发告警。" },
      { id: 2, name: "冷水机组高温预警", type: "设备属性", level: "预警", devices: "冷水机组-01、02", status: "启用", description: "冷冻水供水温度连续超过 12℃触发预警。" },
      { id: 3, name: "消防水箱低液位提醒", type: "设备属性", level: "提醒", devices: "消防水箱液位计", status: "停用", description: "消防水箱液位低于下限触发提醒。" }
    ];
    const alarmRuleBody = document.getElementById("alarmRuleBody");
    const notificationDirectory = [
      { id: "project", name: "项目管理部", people: [{ id: "li", name: "李工" }, { id: "wang", name: "王工" }] },
      { id: "equipment", name: "设备管理部", people: [{ id: "zhao", name: "赵工" }, { id: "chen", name: "陈工" }] },
      { id: "safety", name: "安全质量部", people: [{ id: "liu", name: "刘主任" }, { id: "sun", name: "孙工" }] }
    ];
    const emptyCondition = () => ({ property: "", operator: "", threshold: "" });
    let wizardState = { step: 1, mode: "create", rule: null, trigger: "property", monitorRule: "any", model: "", filter: "periodic", period: "60", offlineSeconds: "60", conditionValues: [emptyCondition(), emptyCondition()], departments: [], people: [], method: "站内消息", openMulti: null };
    function ruleLevelClass(level) { return level === "告警" ? "high" : level === "预警" ? "medium" : "low"; }
    function renderAlarmRules(list = alarmRules) {
      alarmRuleBody.innerHTML = list.map((item, index) => `<tr data-rule-id="${item.id}"><td>${index + 1}</td><td>${item.name}</td><td>${item.type}</td><td><span class="alarm-level ${ruleLevelClass(item.level)}">${item.level}</span></td><td>${item.devices}</td><td><label class="alarm-rule-switch" data-rule-status="${item.id}"><input type="checkbox" ${item.status === "启用" ? "checked" : ""} aria-label="${item.name}${item.status === "启用" ? "已启用" : "已停用"}"><span class="alarm-rule-switch-track"></span></label></td><td><button class="table-action" type="button" data-rule-action="detail" data-rule-id="${item.id}">详情</button><button class="table-action" type="button" data-rule-action="edit" data-rule-id="${item.id}">编辑</button><button class="table-action status-danger" type="button" data-rule-action="delete" data-rule-id="${item.id}">删除</button></td></tr>`).join("");
      document.getElementById("alarmRuleCount").textContent = list.length;
    }
    function alarmRuleById(id) { return alarmRules.find((item) => String(item.id) === String(id)) || alarmRules[0]; }
    function ruleSummary(item) {
      window.openAppDrawer({ title: "报警规则详情", subtitle: "报警中心 · 报警规则", body: `<section class="detail-section"><h3 class="detail-title">基本信息</h3><div class="detail-grid alarm-detail-grid"><div class="info-item"><span class="info-label">规则名称</span><span class="info-value">${item.name}</span></div><div class="info-item"><span class="info-label">报警类型</span><span class="info-value">${item.type}</span></div><div class="info-item"><span class="info-label">报警等级</span><span class="info-value"><span class="alarm-level ${ruleLevelClass(item.level)}">${item.level}</span></span></div><div class="info-item"><span class="info-label">启用状态</span><span class="info-value">${item.status}</span></div><div class="info-item"><span class="info-label">关联设备</span><span class="info-value">${item.devices}</span></div><div class="info-item"><span class="info-label">规则说明</span><span class="info-value">${item.description}</span></div></div></section><section class="detail-section"><h3 class="detail-title">触发与过滤</h3><div class="detail-grid alarm-detail-grid"><div class="info-item"><span class="info-label">触发方式</span><span class="info-value">${item.type === "设备离线" ? "设备离线监测触发" : item.type === "第三方报警信息" ? "第三方报警信息" : "设备属性监测触发"}</span></div><div class="info-item"><span class="info-label">过滤方式</span><span class="info-value">周期性报警，报警周期 60 分钟</span></div></div></section>`, footer: `<button class="btn btn-secondary" type="button" data-drawer-close>关闭</button>` });
    }
    function wizardStepMarkup() {
      const rule = wizardState.rule || {};
      return `<div class="alarm-wizard" data-wizard-mode="${wizardState.mode}">
        <div class="alarm-wizard-steps"><button class="alarm-wizard-step active" type="button" data-step="1" data-wizard-step="1">输入基本信息</button><button class="alarm-wizard-step" type="button" data-step="2" data-wizard-step="2">触发条件</button><button class="alarm-wizard-step" type="button" data-step="3" data-wizard-step="3">过滤规则</button><button class="alarm-wizard-step" type="button" data-step="4" data-wizard-step="4">发送方式</button><button class="alarm-wizard-step" type="button" data-step="5" data-wizard-step="5">保存预览</button></div>
        <div class="alarm-wizard-content">
          <section data-wizard-panel="1"><div class="form-grid-2"><label class="form-field form-item"><span class="form-label form-required">规则名称</span><input class="form-control" data-wizard-field="name" value="${rule.name || ""}" placeholder="请输入规则名称"></label><label class="form-field form-item"><span class="form-label form-required">报警类型</span><select class="form-control" data-wizard-field="type"><option value="">请选择报警类型</option><option ${rule.type === "设备属性" ? "selected" : ""}>设备属性</option><option ${rule.type === "设备离线" ? "selected" : ""}>设备离线</option></select></label><label class="form-field form-item"><span class="form-label form-required">报警等级</span><select class="form-control" data-wizard-field="level"><option value="">请选择报警等级</option><option ${rule.level === "告警" ? "selected" : ""}>告警</option><option ${rule.level === "预警" ? "selected" : ""}>预警</option><option ${rule.level === "提醒" ? "selected" : ""}>提醒</option></select></label><div></div><label class="form-field form-item form-span-2"><span class="form-label">规则说明</span><textarea class="form-control textarea" data-wizard-field="description" placeholder="请输入规则说明">${rule.description || ""}</textarea></label></div></section>
          <section class="hidden" data-wizard-panel="2"><div class="alarm-tip">请设置当前报警规则的触发条件（触发源符合触发条件才能触发报警，满足自身相关条件的属性标记为异常），条件至多可添加五项。</div><div class="alarm-choice-row"><span class="form-label form-required">触发方式</span><label class="alarm-choice"><input type="radio" name="alarm-trigger" value="property" ${wizardState.trigger === "property" ? "checked" : ""}>设备属性监测触发</label><label class="alarm-choice"><input type="radio" name="alarm-trigger" value="offline" ${wizardState.trigger === "offline" ? "checked" : ""}>设备离线监测触发</label><label class="alarm-choice"><input type="radio" name="alarm-trigger" value="third-party" ${wizardState.trigger === "third-party" ? "checked" : ""}>第三方报警信息</label></div><div class="trigger-panel" data-trigger-panel="property"><div class="alarm-field-group"><label class="form-field"><span class="form-label form-required">选择设备</span><select class="form-control" data-wizard-field="model"><option value="">请选择设备</option><option value="冷水机组" ${wizardState.model === "冷水机组" ? "selected" : ""}>冷水机组</option><option value="配电室网关" ${wizardState.model === "配电室网关" ? "selected" : ""}>配电室网关</option><option value="消防水箱液位计" ${wizardState.model === "消防水箱液位计" ? "selected" : ""}>消防水箱液位计</option></select></label><div class="alarm-choice-row alarm-trigger-rule-row"><span class="form-label form-required">监测规则</span><label class="alarm-choice"><input type="radio" name="monitor-rule" value="any" ${wizardState.monitorRule === "any" ? "checked" : ""}>满足以下任一条件</label><label class="alarm-choice"><input type="radio" name="monitor-rule" value="all" ${wizardState.monitorRule === "all" ? "checked" : ""}>满足以下全部条件</label></div></div><div class="alarm-condition-toolbar"><span class="form-label">条件列表：</span><button class="alarm-link" type="button" data-condition-action="add"><i class="fa-solid fa-circle-plus"></i>添加条件</button><button class="alarm-link" type="button" data-condition-action="clear"><i class="fa-solid fa-circle-xmark"></i>清空列表</button></div><div class="alarm-condition-list" id="alarmConditionList"></div></div><div class="trigger-panel hidden" data-trigger-panel="offline"><div class="alarm-rule-line"><span class="form-label form-required">监测规则：</span>设备离线持续超过 <input class="form-control" data-wizard-field="offlineSeconds" value="${wizardState.offlineSeconds}" inputmode="numeric"> 秒时触发报警</div></div><div class="trigger-panel hidden" data-trigger-panel="third-party"><div class="alarm-rule-line alarm-third-party-rule"><span class="form-label form-required">监测规则：</span>接收到报警类型为【设备属性】的第三方报警信息，且报警设备是规则关联设备时，触发报警</div></div></section>
          <section class="hidden" data-wizard-panel="3"><div class="alarm-tip"><strong>重复报警处理</strong>选择一种过滤方式，控制同一报警的重复生成与通知。</div><div class="alarm-choice-row alarm-filter-label-row"><span class="form-label form-required">过滤方式</span></div><div class="alarm-filter-options"><label class="alarm-filter-option"><input type="radio" name="alarm-filter" value="periodic" ${wizardState.filter === "periodic" ? "checked" : ""}><span class="alarm-filter-card-option"><span class="alarm-filter-card-head"><span class="alarm-filter-card-icon"><i class="fa-solid fa-clock-rotate-left"></i></span><span><strong>周期性报警</strong><small>在指定周期内只生成一次</small></span></span><span class="alarm-filter-card-body">同一个设备、同一个报警在周期之内，将不再重复生成告警和通知，直到周期结束后若报警还存在，再次触发。</span></span></label><label class="alarm-filter-option"><input type="radio" name="alarm-filter" value="merge" ${wizardState.filter === "merge" ? "checked" : ""}><span class="alarm-filter-card-option"><span class="alarm-filter-card-head"><span class="alarm-filter-card-icon"><i class="fa-solid fa-layer-group"></i></span><span><strong>持续报警合并报警一次</strong><small>持续异常只保留一条报警</small></span></span><span class="alarm-filter-card-body">同一设备同一报警只触发一次，直到设备不满足触发条件为止。该过滤方式不适用于第三方消息报警。</span></span></label><label class="alarm-filter-option"><input type="radio" name="alarm-filter" value="none" ${wizardState.filter === "none" ? "checked" : ""}><span class="alarm-filter-card-option"><span class="alarm-filter-card-head"><span class="alarm-filter-card-icon"><i class="fa-solid fa-bolt"></i></span><span><strong>立即报警，不过滤</strong><small>每次满足条件都立即通知</small></span></span><span class="alarm-filter-card-body">只要设备满足报警触发规则，就立即报警。不过滤极易导致大量服务器报警，仅限第三方消息报警使用。</span></span></label></div><div class="alarm-period ${wizardState.filter === "periodic" ? "" : "hidden"}" data-alarm-period><span class="form-label form-required">报警周期</span><input class="form-control" data-wizard-field="period" value="${wizardState.period}" inputmode="numeric"><span>分钟</span></div></section>
          <section class="hidden" data-wizard-panel="4"><div class="alarm-tip">请设置报警通知的部门、人员和通知方式。</div><div class="alarm-send-section"><h3 class="alarm-summary-title">发送方式</h3><div class="alarm-send-grid"><div class="form-field form-item"><span class="form-label form-required">部门</span><div class="alarm-tag-select" data-multi-select="departments"><button class="alarm-tag-control" type="button" data-multi-trigger="departments" aria-expanded="false"><span data-multi-value="departments"></span><i class="fa-solid fa-chevron-down"></i></button><div class="alarm-tag-dropdown" data-multi-options="departments"></div></div></div><div class="form-field form-item"><span class="form-label form-required">通知人员</span><div class="alarm-tag-select" data-multi-select="people"><button class="alarm-tag-control" type="button" data-multi-trigger="people" aria-expanded="false"><span data-multi-value="people"></span><i class="fa-solid fa-chevron-down"></i></button><div class="alarm-tag-dropdown" data-multi-options="people"></div></div></div><label class="form-field form-item"><span class="form-label form-required">通知方式</span><select class="form-control" data-wizard-field="method"><option value="站内消息" selected>站内消息</option></select></label></div></div></section>
          <section class="hidden" data-wizard-panel="5"><div class="alarm-tip">确认已填写信息，提交保存：</div><div class="alarm-summary-section"><h3 class="alarm-summary-title">基本信息</h3><table class="alarm-summary-table"><tbody><tr><th class="summary-label">规则名称</th><td data-summary="name">-</td><th class="summary-label">报警类型</th><td data-summary="type">-</td></tr><tr><th class="summary-label">报警等级</th><td data-summary="level">-</td><th class="summary-label">规则说明</th><td data-summary="description">-</td></tr></tbody></table></div><div class="alarm-summary-section"><h3 class="alarm-summary-title">触发条件</h3><table class="alarm-summary-table"><tbody><tr><th class="summary-label">触发方式</th><td data-summary="trigger">-</td><th class="summary-label">设备</th><td data-summary="model">-</td></tr><tr><th class="summary-label">监测规则</th><td colspan="3" data-summary="monitor">-</td></tr><tr><th class="summary-label">条件列表</th><td colspan="3" data-summary="conditions">-</td></tr></tbody></table></div><div class="alarm-summary-section"><h3 class="alarm-summary-title">过滤方式</h3><table class="alarm-summary-table"><tbody><tr><th class="summary-label">过滤方式</th><td data-summary="filter">-</td><th class="summary-label">报警周期</th><td data-summary="period">-</td></tr></tbody></table></div><div class="alarm-summary-section"><h3 class="alarm-summary-title">发送方式</h3><table class="alarm-summary-table"><tbody><tr><th class="summary-label">部门</th><td data-summary="departments">-</td><th class="summary-label">通知人员</th><td data-summary="people">-</td></tr><tr><th class="summary-label">通知方式</th><td colspan="3" data-summary="method">站内消息</td></tr></tbody></table></div></section>
        </div>
      </div>`;
    }
    function conditionMarkup() { return wizardState.conditionValues.map((condition, index) => `<div class="alarm-condition"><span class="alarm-condition-label">条件${index + 1}：</span><select class="form-control" data-condition-field="property" aria-label="条件${index + 1}属性"><option value="">请选择属性</option><option value="供水温度" ${condition.property === "供水温度" ? "selected" : ""}>供水温度</option><option value="回水温度" ${condition.property === "回水温度" ? "selected" : ""}>回水温度</option><option value="运行电流" ${condition.property === "运行电流" ? "selected" : ""}>运行电流</option><option value="液位高度" ${condition.property === "液位高度" ? "selected" : ""}>液位高度</option></select><select class="form-control" data-condition-field="operator" aria-label="条件${index + 1}运算符"><option value="">请选择运算符</option><option value="等于" ${condition.operator === "等于" ? "selected" : ""}>等于</option><option value="大于" ${condition.operator === "大于" ? "selected" : ""}>大于</option><option value="大于等于" ${condition.operator === "大于等于" ? "selected" : ""}>大于等于</option><option value="小于" ${condition.operator === "小于" ? "selected" : ""}>小于</option><option value="小于等于" ${condition.operator === "小于等于" ? "selected" : ""}>小于等于</option></select><input class="form-control" data-condition-field="threshold" value="${condition.threshold}" placeholder="请输入阈值" aria-label="条件${index + 1}阈值"><button class="alarm-condition-remove" type="button" data-condition-action="remove" data-condition-index="${index}" aria-label="删除条件"><i class="fa-solid fa-circle-minus"></i></button></div>`).join(""); }
    function updateConditions() { const list = document.getElementById("alarmConditionList"); if (list) list.innerHTML = conditionMarkup(); }
    function updateTrigger(trigger) { wizardState.trigger = trigger; document.querySelectorAll("[data-trigger-panel]").forEach((panel) => panel.classList.toggle("hidden", panel.dataset.triggerPanel !== trigger)); }
    function updateFilterMode(mode) { wizardState.filter = mode; const period = document.querySelector("[data-alarm-period]"); if (period) period.classList.toggle("hidden", mode !== "periodic"); }
    function captureWizardState() { const body = document.getElementById("drawerBody"); if (!body) return; const get = (key) => body.querySelector(`[data-wizard-field="${key}"]`)?.value || ""; wizardState.model = get("model"); wizardState.offlineSeconds = get("offlineSeconds"); wizardState.period = get("period"); wizardState.monitorRule = body.querySelector("input[name=monitor-rule]:checked")?.value || wizardState.monitorRule; wizardState.method = get("method") || "站内消息"; wizardState.conditionValues = [...body.querySelectorAll("#alarmConditionList .alarm-condition")].map((row) => ({ property: row.querySelector('[data-condition-field="property"]')?.value || "", operator: row.querySelector('[data-condition-field="operator"]')?.value || "", threshold: row.querySelector('[data-condition-field="threshold"]')?.value.trim() || "" })); }
    function renderMultiSelects() { const body = document.getElementById("drawerBody"); if (!body) return; const allPeople = notificationDirectory.flatMap((item) => item.people); const allowedPeople = notificationDirectory.filter((item) => wizardState.departments.includes(item.id)).flatMap((item) => item.people); const render = (key, source, placeholder) => { const component = body.querySelector(`[data-multi-select="${key}"]`); if (!component) return; const value = component.querySelector(`[data-multi-value="${key}"]`); const dropdown = component.querySelector(`[data-multi-options="${key}"]`); const selected = wizardState[key].map((id) => source.find((item) => item.id === id)).filter(Boolean); const control = component.querySelector("[data-multi-trigger]"); value.innerHTML = selected.length ? selected.map((item) => `<span class="alarm-selection-tag">${item.name}<span role="button" tabindex="0" data-tag-remove="${key}" data-tag-id="${item.id}" aria-label="移除${item.name}">×</span></span>`).join("") : `<span class="alarm-tag-placeholder">${placeholder}</span>`; dropdown.innerHTML = source.length ? source.map((item) => `<button class="alarm-tag-option ${wizardState[key].includes(item.id) ? "selected" : ""}" type="button" data-multi-option="${key}" data-option-id="${item.id}"><span>${item.name}</span>${wizardState[key].includes(item.id) ? '<i class="fa-solid fa-check"></i>' : ""}</button>`).join("") : '<span class="alarm-tag-empty">请先选择部门</span>'; component.classList.toggle("open", wizardState.openMulti === key); control?.setAttribute("aria-expanded", String(wizardState.openMulti === key)); if (selected.length) { control?.classList.remove("error"); component.closest(".form-field")?.querySelector(".form-error")?.remove(); } }; render("departments", notificationDirectory, "请选择部门"); render("people", allowedPeople, wizardState.departments.length ? "请选择通知人员" : "请先选择部门"); wizardState.people = wizardState.people.filter((id) => allPeople.some((item) => item.id === id) && allowedPeople.some((item) => item.id === id)); }
    function updateNotificationPeople() { const allowed = notificationDirectory.filter((item) => wizardState.departments.includes(item.id)).flatMap((item) => item.people); wizardState.people = wizardState.people.filter((id) => allowed.some((item) => item.id === id)); if (!wizardState.departments.length && wizardState.openMulti === "people") wizardState.openMulti = null; renderMultiSelects(); }
    function updateSummary() { const body = document.getElementById("drawerBody"); if (!body) return; captureWizardState(); const get = (key) => body.querySelector(`[data-wizard-field="${key}"]`)?.value || "-"; const set = (key, value) => { const item = body.querySelector(`[data-summary="${key}"]`); if (item) item.textContent = value || "-"; }; const names = (ids, source) => ids.map((id) => source.find((item) => item.id === id)?.name).filter(Boolean).join("、") || "-"; const people = notificationDirectory.flatMap((item) => item.people); set("name", get("name")); set("type", get("type")); set("level", get("level")); set("description", get("description")); set("trigger", ({ property: "设备属性监测触发", offline: "设备离线监测触发", "third-party": "第三方报警信息" })[wizardState.trigger]); set("model", wizardState.model); set("monitor", ({ any: "满足以下任一条件", all: "满足以下全部条件" })[wizardState.monitorRule] || "-"); set("conditions", wizardState.conditionValues.map((item) => `${item.property} ${item.operator} ${item.threshold}`).join("；") || "-"); set("filter", ({ periodic: "周期性报警", merge: "持续报警合并报警一次", none: "立即报警，不过滤" })[wizardState.filter]); set("period", wizardState.filter === "periodic" ? `${wizardState.period || 60} 分钟` : "-"); set("departments", names(wizardState.departments, notificationDirectory)); set("people", names(wizardState.people, people)); set("method", wizardState.method); }
    function clearValidation(panel) { panel.querySelectorAll(".error").forEach((item) => item.classList.remove("error")); panel.querySelectorAll(".form-error").forEach((item) => item.remove()); }
    function markValidation(field, message) { field.classList.add("error"); const host = field.closest(".form-field") || field.parentElement; if (!host || host.querySelector(".form-error")) return; const error = document.createElement("span"); error.className = "form-error"; error.textContent = message; host.appendChild(error); }
    function validateWizardStep(step) { const body = document.getElementById("drawerBody"); const panel = body?.querySelector(`[data-wizard-panel="${step}"]`); if (!panel) return true; captureWizardState(); clearValidation(panel); let valid = true; const required = (field, message) => { if (!field || !field.value.trim()) { if (field) markValidation(field, message); valid = false; } }; if (step === 1) { required(panel.querySelector('[data-wizard-field="name"]'), "请输入规则名称"); required(panel.querySelector('[data-wizard-field="type"]'), "请选择报警类型"); required(panel.querySelector('[data-wizard-field="level"]'), "请选择报警等级"); } if (step === 2 && wizardState.trigger === "property") { const model = panel.querySelector('[data-wizard-field="model"]'); required(model, "请选择设备"); if (!panel.querySelector("input[name=monitor-rule]:checked")) { markValidation(panel.querySelector("input[name=monitor-rule]") || model, "请选择监测规则"); valid = false; } panel.querySelectorAll("#alarmConditionList .alarm-condition").forEach((row) => { ["property", "operator", "threshold"].forEach((fieldName) => { const field = row.querySelector(`[data-condition-field="${fieldName}"]`); if (!field || !field.value.trim()) { markValidation(field, fieldName === "property" ? "请选择属性" : fieldName === "operator" ? "请选择运算符" : "请输入阈值"); valid = false; } }); }); if (!wizardState.conditionValues.length) { markValidation(panel.querySelector("#alarmConditionList"), "请至少保留一条条件"); valid = false; } } if (step === 2 && wizardState.trigger === "offline") { const seconds = panel.querySelector('[data-wizard-field="offlineSeconds"]'); if (!seconds || !/^\d+$/.test(seconds.value.trim()) || Number(seconds.value) < 1) { markValidation(seconds, "请输入大于等于1的整数秒数"); valid = false; } } if (step === 3 && wizardState.filter === "periodic") { const period = panel.querySelector('[data-wizard-field="period"]'); if (!period || !/^\d+$/.test(period.value.trim()) || Number(period.value) < 1) { markValidation(period, "请输入大于等于1的整数分钟"); valid = false; } } if (step === 4) { const departmentControl = panel.querySelector('[data-multi-select="departments"] .alarm-tag-control'); const peopleControl = panel.querySelector('[data-multi-select="people"] .alarm-tag-control'); const method = panel.querySelector('[data-wizard-field="method"]'); if (!wizardState.departments.length) { markValidation(departmentControl, "请选择通知部门"); valid = false; } if (!wizardState.people.length) { markValidation(peopleControl, "请选择通知人员"); valid = false; } required(method, "请选择通知方式"); } return valid; }
    function syncWizard() { const body = document.getElementById("drawerBody"); if (!body) return; body.querySelectorAll("[data-wizard-step]").forEach((item) => { const step = Number(item.dataset.wizardStep); item.classList.toggle("active", step === wizardState.step); item.classList.toggle("done", step < wizardState.step); }); body.querySelectorAll("[data-wizard-panel]").forEach((panel) => panel.classList.toggle("hidden", Number(panel.dataset.wizardPanel) !== wizardState.step)); const footer = document.getElementById("drawerFooter"); if (footer) footer.innerHTML = `${wizardState.step > 1 ? '<button class="btn btn-secondary" type="button" data-wizard-action="prev">上一步</button>' : ""}<button class="btn btn-primary" type="button" data-wizard-action="${wizardState.step === 5 ? "save" : "next"}">${wizardState.step === 5 ? "保存" : "下一步"}</button><button class="btn btn-secondary" type="button" data-drawer-close>取消</button>`; footer.querySelectorAll("[data-drawer-close]").forEach((item) => item.addEventListener("click", window.closeAppDrawer)); updateConditions(); updateNotificationPeople(); }
    function openRuleWizard(mode, rule = null) { wizardState = { step: 1, mode, rule, trigger: rule?.type === "设备离线" ? "offline" : rule?.type === "第三方报警信息" ? "third-party" : "property", monitorRule: "any", model: "", filter: "periodic", period: "60", offlineSeconds: "60", conditionValues: [emptyCondition(), emptyCondition()], departments: [], people: [], method: "站内消息", openMulti: null }; window.openAppDrawer({ title: mode === "edit" ? "编辑报警规则" : "新增报警规则", subtitle: "报警中心 · 报警规则", body: wizardStepMarkup(), footer: "" }); syncWizard(); updateTrigger(wizardState.trigger); updateFilterMode(wizardState.filter); }
    function filterRules() { const filters = Object.fromEntries([...document.querySelectorAll("[data-filter]")].map((input) => [input.dataset.filter, input.value.trim()])); renderAlarmRules(alarmRules.filter((item) => (!filters.name || item.name.includes(filters.name)) && (!filters.type || item.type === filters.type) && (!filters.level || item.level === filters.level))); }
    document.addEventListener("click", (event) => {
      const action = event.target.closest("[data-action]")?.dataset.action;
      if (action === "create") openRuleWizard("create");
      if (action === "search") filterRules();
      if (action === "reset") { document.querySelectorAll("[data-filter]").forEach((input) => { input.value = ""; }); renderAlarmRules(); }
      const rowAction = event.target.closest("[data-rule-action]");
      if (rowAction) { const rule = alarmRuleById(rowAction.dataset.ruleId); if (rowAction.dataset.ruleAction === "detail") ruleSummary(rule); if (rowAction.dataset.ruleAction === "edit") openRuleWizard("edit", rule); if (rowAction.dataset.ruleAction === "delete") window.openAppConfirm({ title: "提示", message: `确认删除报警规则「${rule.name}」吗？`, onConfirm: () => { const index = alarmRules.findIndex((item) => item.id === rule.id); if (index >= 0) alarmRules.splice(index, 1); renderAlarmRules(); } }); }
      const status = event.target.closest("[data-rule-status]");
      if (status) { const rule = alarmRuleById(status.dataset.ruleStatus); rule.status = rule.status === "启用" ? "停用" : "启用"; renderAlarmRules(); }
      const wizardAction = event.target.closest("[data-wizard-action]")?.dataset.wizardAction;
      if (wizardAction === "prev") { captureWizardState(); wizardState.step = Math.max(1, wizardState.step - 1); syncWizard(); }
      if (wizardAction === "next") { if (!validateWizardStep(wizardState.step)) return; captureWizardState(); wizardState.step = Math.min(5, wizardState.step + 1); syncWizard(); if (wizardState.step === 5) updateSummary(); }
      if (wizardAction === "save") { if (!validateWizardStep(4)) return; captureWizardState(); window.closeAppDrawer(); }
      const step = event.target.closest("[data-wizard-step]"); if (step && Number(step.dataset.wizardStep) <= wizardState.step) { captureWizardState(); wizardState.step = Number(step.dataset.wizardStep); syncWizard(); if (wizardState.step === 5) updateSummary(); }
      const tagRemove = event.target.closest("[data-tag-remove]"); if (tagRemove) { event.stopPropagation(); const key = tagRemove.dataset.tagRemove; wizardState[key] = wizardState[key].filter((id) => id !== tagRemove.dataset.tagId); if (key === "departments") updateNotificationPeople(); else renderMultiSelects(); }
      const multiOption = event.target.closest("[data-multi-option]"); if (multiOption) { const key = multiOption.dataset.multiOption; const id = multiOption.dataset.optionId; wizardState[key] = wizardState[key].includes(id) ? wizardState[key].filter((item) => item !== id) : wizardState[key].concat(id); wizardState.openMulti = key; if (key === "departments") updateNotificationPeople(); else renderMultiSelects(); }
      const multiTrigger = event.target.closest("[data-multi-trigger]"); if (multiTrigger && !tagRemove) { const key = multiTrigger.dataset.multiTrigger; if (key !== "people" || wizardState.departments.length) wizardState.openMulti = wizardState.openMulti === key ? null : key; renderMultiSelects(); }
      if (!multiOption && !multiTrigger && !tagRemove && !event.target.closest("[data-multi-select]")) { wizardState.openMulti = null; renderMultiSelects(); }
      const conditionAction = event.target.closest("[data-condition-action]")?.dataset.conditionAction;
      if (conditionAction === "add" && wizardState.conditionValues.length < 5) { captureWizardState(); wizardState.conditionValues.push(emptyCondition()); updateConditions(); }
      if (conditionAction === "remove" && wizardState.conditionValues.length > 1) { captureWizardState(); wizardState.conditionValues.splice(Number(event.target.closest("[data-condition-index]")?.dataset.conditionIndex || wizardState.conditionValues.length - 1), 1); updateConditions(); }
      if (conditionAction === "clear") { captureWizardState(); wizardState.conditionValues = []; updateConditions(); }
    });
    document.addEventListener("change", (event) => { if (event.target.name === "alarm-trigger") updateTrigger(event.target.value); if (event.target.name === "alarm-filter") updateFilterMode(event.target.value); });
    renderAlarmRules();
  </script>
