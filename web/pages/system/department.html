<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>部门管理 - 科学岛管廊监控中心</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="../../assets/css/tob-ui.css"><style>.department-toolbar .title-with-helper{display:flex;align-items:center;gap:8px}.department-toolbar .panel-helper{margin-left:0}</style></head>
<body class="department-page" data-menu-key="system.department" data-page-section="系统管理" data-page-title="部门管理"><div class="app-shell"><aside id="app-sidebar" class="sidebar"></aside><header id="app-header" class="header"></header><main class="main"><div class="screen-frame stack">
<section class="page-head"><div><h1 class="page-title">部门管理</h1><p class="page-desc">维护组织架构、部门负责人及部门状态。</p></div></section>
<section class="card filters department-filters"><div class="filter-actions department-filter-row"><label class="form-field"><span class="form-label">部门名称</span><input class="form-control" data-filter="name" placeholder="请输入"></label><label class="form-field"><span class="form-label">部门状态</span><select class="form-control" data-filter="status"><option value="">请选择</option><option>正常</option><option>停用</option></select></label><button class="btn btn-secondary" data-action="reset">重置</button><button class="btn btn-primary" data-action="search">搜索</button></div></section>
<section class="card department-list-card"><div class="card-title-row department-toolbar"><div class="title-with-helper"><h2 class="card-title">部门列表</h2><span class="panel-helper">双击展开/收起</span></div><div class="btn-row"><button class="btn btn-secondary" data-action="collapse-all">全部收起</button><button class="btn btn-primary" data-action="create"><i class="fa-solid fa-plus"></i> 新增</button></div></div><div class="table-wrap"><table class="table department-table"><thead><tr><th>部门名称</th><th>类别编码</th><th>创建时间</th><th>排序</th><th>状态</th><th>操作</th></tr></thead><tbody id="departmentTable"></tbody></table></div></section>
</div></main></div>
<script src="../../../app/config/menu.js?v=nav-hide-1"></script><script src="../../../app/components/sidebar.js?v=nav-home-1"></script><script src="../../../app/components/header.js?v=nav-home-1"></script><script src="../../../app/components/drawer.js"></script><script src="../../../app/components/requirement.js"></script>
<script>
const departments=[
{id:1,name:"科学岛管廊监控中心",code:"XMJS",created:"2026-07-01 10:02:28",sort:0,status:"正常",level:0,parent:null,open:true},
{id:2,name:"项目管理中心",code:"XMGLZX",created:"2026-07-01 10:02:28",sort:1,status:"正常",level:1,parent:1,open:true},
{id:3,name:"项目综合管理部",code:"XMZHGLB",created:"2026-07-01 10:02:28",sort:1,status:"正常",level:2,parent:2},
{id:4,name:"招商运营部",code:"ZSYYB",created:"2026-07-01 10:02:28",sort:2,status:"正常",level:2,parent:2},
{id:5,name:"客户服务部",code:"KHFWB",created:"2026-07-01 10:02:28",sort:3,status:"正常",level:2,parent:2},
{id:6,name:"工程管理中心",code:"GCGLZX",created:"2026-07-01 10:02:28",sort:2,status:"正常",level:1,parent:1,open:true},
{id:7,name:"机电工程部",code:"JDGCB",created:"2026-07-01 10:02:28",sort:1,status:"正常",level:2,parent:6},
{id:8,name:"土建工程部",code:"TJGCB",created:"2026-07-01 10:02:28",sort:2,status:"正常",level:2,parent:6},
{id:9,name:"设备运维部",code:"SBYWB",created:"2026-07-01 10:02:28",sort:3,status:"正常",level:2,parent:6},
{id:10,name:"物业运营中心",code:"WYYYZX",created:"2026-07-01 10:02:28",sort:3,status:"正常",level:1,parent:1,open:true},
{id:11,name:"物业服务部",code:"WYFWB",created:"2026-07-01 10:02:28",sort:1,status:"正常",level:2,parent:10},
{id:12,name:"环境管理部",code:"HJGLB",created:"2026-07-01 10:02:28",sort:2,status:"正常",level:2,parent:10},
{id:13,name:"秩序维护部",code:"ZXWHB",created:"2026-07-01 10:02:28",sort:3,status:"正常",level:2,parent:10},
{id:14,name:"财务管理部",code:"CWGLB",created:"2026-07-01 10:02:28",sort:4,status:"正常",level:1,parent:1},
{id:15,name:"财务核算组",code:"CWHSZ",created:"2026-07-01 10:02:28",sort:1,status:"正常",level:2,parent:14},
{id:16,name:"成本管理组",code:"CBGLZ",created:"2026-07-01 10:02:28",sort:2,status:"正常",level:2,parent:14}
];
const table=document.getElementById("departmentTable");function deptById(id){return departments.find((item)=>String(item.id)===String(id))||departments[0];}function renderDepartments(list=departments){table.innerHTML=list.map((item)=>`<tr data-dept-id="${item.id}" data-parent="${item.parent||""}" class="department-level-${item.level}"><td><span class="department-name" style="--level:${item.level}">${departments.some((child)=>child.parent===item.id)?`<i class="fa-solid fa-caret-down department-caret" data-dept-toggle="${item.id}"></i>`:`<span class="department-indent"></span>`}${item.name}</span></td><td>${item.code}</td><td>${item.created}</td><td>${item.sort}</td><td><span class="tag ${item.status === "正常" ? "success" : "danger"}">${item.status}</span></td><td><button class="table-action" data-dept-action="edit" data-dept-id="${item.id}">编辑</button><button class="table-action" data-dept-action="add" data-dept-id="${item.id}">新增</button><button class="table-action status-danger" data-dept-action="delete" data-dept-id="${item.id}">删除</button></td></tr>`).join("");}
function openDepartmentDrawer(mode="create",parent){const body=`<label class="form-field form-item"><span class="form-label form-required">部门名称</span><input class="form-control" placeholder="请输入"></label><label class="form-field form-item"><span class="form-label form-required">显示排序</span><input class="form-control" value="1"></label><label class="form-field form-item"><span class="form-label">类别编码</span><input class="form-control" placeholder="请输入"></label><label class="form-field form-item"><span class="form-label">负责人</span><select class="form-control"><option>仅在更新时可选部门负责人</option><option>Open AI</option><option>用户4</option></select></label><label class="form-field form-item"><span class="form-label">手机号码</span><input class="form-control" placeholder="请输入"></label><label class="form-field form-item"><span class="form-label">电子邮箱</span><input class="form-control" placeholder="请输入"></label><div class="menu-choice-row"><span class="form-label">部门状态</span><button class="active">正常</button><button>停用</button></div>`;window.openAppDrawer({title:mode==="edit"?"编辑":"新增",subtitle:`系统管理 · 部门管理${parent?` · ${parent.name}`:""}`,body,footer:`<button class="btn btn-secondary" data-drawer-close>取消</button><button class="btn btn-primary" data-drawer-close>确认</button>`});}
renderDepartments();document.addEventListener("click",(event)=>{const action=event.target.closest("[data-action]")?.dataset.action;if(action==="create")openDepartmentDrawer();if(action==="collapse-all"){document.querySelectorAll("[data-dept-toggle]").forEach((toggle)=>toggle.classList.add("collapsed"));document.querySelectorAll("#departmentTable tr[data-parent]").forEach((row)=>row.hidden=row.dataset.parent!=="");}if(action==="reset"){document.querySelectorAll("[data-filter]").forEach((input)=>input.value="");renderDepartments();}if(action==="search"){const f=Object.fromEntries([...document.querySelectorAll("[data-filter]")].map((input)=>[input.dataset.filter,input.value]));renderDepartments(departments.filter((item)=>(!f.name||item.name.includes(f.name))&&(!f.status||item.status===f.status)));}const deptAction=event.target.closest("[data-dept-action]");if(deptAction){const target=deptById(deptAction.dataset.deptId);if(deptAction.dataset.deptAction==="add")openDepartmentDrawer("create",target);else if(deptAction.dataset.deptAction==="edit")openDepartmentDrawer("edit",target);else {target.status="停用";renderDepartments();}}const toggle=event.target.closest("[data-dept-toggle]");if(toggle){const id=toggle.dataset.deptToggle;const collapsed=toggle.classList.toggle("collapsed");let next=toggle.closest("tr").nextElementSibling;while(next&&next.dataset.parent===id){next.hidden=collapsed;next=next.nextElementSibling;}}});
const baseDepartmentDrawer = openDepartmentDrawer;
openDepartmentDrawer = function (mode, parent) { baseDepartmentDrawer(mode, parent); setTimeout(() => { const owner = document.querySelector("#drawerBody select"); if (owner) owner.disabled = mode !== "edit"; }, 0); };
let departmentsCollapsed = false;
document.addEventListener("click", (event) => {
  const collapseButton = event.target.closest('[data-action="collapse-all"]');
  if (collapseButton) { event.preventDefault(); event.stopImmediatePropagation(); departmentsCollapsed = !departmentsCollapsed; document.querySelectorAll("#departmentTable tr[data-parent]").forEach((row) => row.hidden = departmentsCollapsed && row.dataset.parent !== ""); document.querySelectorAll("[data-dept-toggle]").forEach((toggle) => toggle.classList.toggle("collapsed", departmentsCollapsed)); collapseButton.textContent = departmentsCollapsed ? "全部展开" : "全部收起"; }
}, true);
document.addEventListener("click", (event) => {
  const deleteButton = event.target.closest('[data-dept-action="delete"]');
  if (deleteButton) { event.preventDefault(); event.stopImmediatePropagation(); const target = deptById(deleteButton.dataset.deptId); const hasChildren = departments.some((item) => item.parent === target.id); if (hasChildren) { window.openAppConfirm({ title: "提示", message: "当前部门下存在子级部门，不允许删除。", confirmText: "知道了" }); } else { window.openAppConfirm({ title: "提示", message: `确认删除部门「${target.name}」吗？`, onConfirm: () => { const index = departments.findIndex((item) => item.id === target.id); if (index >= 0) departments.splice(index, 1); renderDepartments(); } }); } }
}, true);
</script></body></html>
