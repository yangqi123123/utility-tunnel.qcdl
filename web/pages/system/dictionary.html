<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>字典管理 - 科学岛管廊监控中心</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="../../assets/css/tob-ui.css"></head><body class="dictionary-page" data-menu-key="system.dictionary" data-page-section="系统管理" data-page-title="字典管理"><div class="app-shell"><aside id="app-sidebar" class="sidebar"></aside><header id="app-header" class="header"></header><main class="main"><div class="screen-frame stack"><section class="card filters"><div class="filter-actions dictionary-filter-row"><label class="form-field"><span class="form-label">字典名称</span><input class="form-control" data-filter="name" placeholder="请输入"></label><label class="form-field"><span class="form-label">字典类型</span><input class="form-control" data-filter="type" placeholder="请输入"></label><button class="btn btn-secondary" data-action="reset">重置</button><button class="btn btn-primary" data-action="search">搜索</button></div></section><section class="dictionary-workspace"><article class="card dictionary-panel"><div class="card-title-row dictionary-panel-head"><h2 class="card-title">字典类型列表</h2><div class="btn-row"><button class="btn btn-secondary" data-action="refresh-cache">刷新缓存</button><button class="btn btn-secondary">导出</button><button class="btn btn-danger-outline" data-action="delete-types" disabled>删除</button><button class="btn btn-primary" data-action="create-type">新增</button></div></div><div class="table-wrap"><table class="table dictionary-type-table"><thead><tr><th class="check-cell"><input type="checkbox" data-select-all="type"></th><th>字典名称</th><th>字典类型</th><th>备注</th><th>创建时间</th><th>操作</th></tr></thead><tbody id="dictionaryTypeTable"></tbody></table></div></article><article class="card dictionary-panel"><div class="card-title-row dictionary-panel-head"><div><h2 class="card-title">字典数据列表</h2></div><div class="btn-row"><button class="btn btn-secondary">导出</button><button class="btn btn-danger-outline" data-action="delete-data" disabled>删除</button><button class="btn btn-primary" data-action="create-data">新增</button></div></div><div class="table-wrap"><table class="table dictionary-data-table"><thead><tr><th class="check-cell"><input type="checkbox" data-select-all="data"></th><th>字典标签</th><th>字典键值</th><th>字典排序</th><th>备注</th><th>创建时间</th><th>操作</th></tr></thead><tbody id="dictionaryDataTable"></tbody></table></div></article></section></div></main></div><script src="../../../app/config/menu.js?v=nav-hide-1"></script><script src="../../../app/config/dictionary.js?v=project-1"></script><script src="../../../app/components/sidebar.js?v=nav-home-1"></script><script src="../../../app/components/header.js?v=nav-home-1"></script><script src="../../../app/components/drawer.js"></script><script src="../../../app/components/requirement.js"></script><script>
const types=[{id:1,name:"业务状态",type:"wf_business_status",remark:"业务状态列表",created:"2026-07-01 10:02:28"},{id:2,name:"表单类型",type:"wf_form_type",remark:"表单类型列表",created:"2026-07-01 10:02:28"},{id:3,name:"任务状态",type:"wf_task_status",remark:"任务状态",created:"2026-07-01 10:02:28"},{id:4,name:"工程用途",type:"project_usage",remark:"项目工程用途下拉选项",created:"2026-09-05 09:00:00"},{id:5,name:"工程状态",type:"project_status",remark:"项目工程状态下拉选项",created:"2026-09-05 09:00:00"},{id:6,name:"法规分类",type:"regulation_category",remark:"法规制度库分类下拉选项",created:"2026-10-13 10:00:00"}];
const data=[{id:1,typeId:3,label:"撤销",value:"cancel",sort:1,remark:"撤销"},{id:2,typeId:3,label:"通过",value:"pass",sort:2,remark:"通过"},{id:3,typeId:3,label:"待审核",value:"waiting",sort:3,remark:"待审核"},{id:4,typeId:3,label:"作废",value:"invalid",sort:4,remark:"作废"},{id:5,typeId:3,label:"退回",value:"back",sort:5,remark:"退回"},{id:6,typeId:4,label:"办公建筑",value:"office",sort:1,remark:"办公建筑"},{id:7,typeId:4,label:"园区",value:"park",sort:2,remark:"园区"},{id:8,typeId:5,label:"未开工",value:"not-started",sort:1,remark:"未开工"},{id:9,typeId:5,label:"在建",value:"building",sort:2,remark:"在建"},{id:10,typeId:5,label:"停工",value:"suspended",sort:3,remark:"停工"},{id:11,typeId:5,label:"竣备",value:"completed",sort:4,remark:"竣备"},{id:12,typeId:5,label:"其他",value:"other",sort:5,remark:"其他"},{id:13,typeId:6,label:"安全生产",value:"安全生产",sort:1,remark:"安全生产"},{id:14,typeId:6,label:"消防安全",value:"消防安全",sort:2,remark:"消防安全"},{id:15,typeId:6,label:"应急管理",value:"应急管理",sort:3,remark:"应急管理"},{id:16,typeId:6,label:"职业健康",value:"职业健康",sort:4,remark:"职业健康"}];
let currentType=3;
const typeBody=document.getElementById("dictionaryTypeTable"),dataBody=document.getElementById("dictionaryDataTable");
const esc=(v)=>String(v??"").replaceAll("\"","&quot;");
function syncProjectDictionary(){
  const projectUsage=data.filter((item)=>item.typeId===4).sort((a,b)=>a.sort-b.sort).map((item)=>({label:item.label,value:item.value}));
  const projectStatus=data.filter((item)=>item.typeId===5).sort((a,b)=>a.sort-b.sort).map((item)=>({label:item.label,value:item.value}));
  const regulationCategory=data.filter((item)=>item.typeId===6).sort((a,b)=>a.sort-b.sort).map((item)=>({label:item.label,value:item.value}));
  localStorage.setItem("app-project-dictionary",JSON.stringify({projectUsage,projectStatus}));
  localStorage.setItem("app-regulation-dictionary",JSON.stringify({regulationCategory}));
  window.APP_DICTIONARY={...(window.APP_DICTIONARY||{}),projectUsage,projectStatus,regulationCategory};
}
function render(){typeBody.innerHTML=types.map(t=>`<tr data-type-id="${t.id}" class="${t.id===currentType?"selected":""}"><td class="check-cell"><input type="checkbox" data-type-check></td><td>${t.name}</td><td>${t.type}</td><td>${t.remark}</td><td>${t.created}</td><td><button class="table-action" data-edit-type="${t.id}">编辑</button><button class="table-action status-danger" data-delete-type="${t.id}">删除</button></td></tr>`).join("");dataBody.innerHTML=data.filter(d=>d.typeId===currentType).map(d=>`<tr><td class="check-cell"><input type="checkbox" data-data-check data-data-id="${d.id}"></td><td><span class="tag primary">${d.label}</span></td><td>${d.value}</td><td>${d.sort}</td><td>${d.remark}</td><td>2026-07-01 10:02:28</td><td><button class="table-action" data-edit-data="${d.id}">编辑</button><button class="table-action status-danger" data-delete-data="${d.id}">删除</button></td></tr>`).join("");updateButtons();}
function updateButtons(){document.querySelector('[data-action="delete-types"]').disabled=!document.querySelector("[data-type-check]:checked");document.querySelector('[data-action="delete-data"]').disabled=!document.querySelector("[data-data-check]:checked");}function typeOf(id){return types.find(t=>t.id===Number(id));}function dataOf(id){return data.find(d=>d.id===Number(id));}
function typeDrawer(edit){const t=edit||{};window.openAppDrawer({title:edit?"编辑":"新增",subtitle:"系统管理 · 字典管理",body:`<label class="form-field form-item"><span class="form-label form-required">字典名称</span><input class="form-control" value="${esc(t.name)}" placeholder="请输入"></label><label class="form-field form-item"><span class="form-label form-required">字典类型</span><input class="form-control" value="${esc(t.type)}" placeholder="请输入"></label><label class="form-field form-item"><span class="form-label">备注</span><textarea class="form-control textarea" placeholder="请输入">${esc(t.remark)}</textarea></label>`,footer:`<button class="btn btn-secondary" data-drawer-close>取消</button><button class="btn btn-primary" data-drawer-close>确认</button>`});}function dataDrawer(edit){const d=edit||{},t=typeOf(currentType);window.openAppDrawer({title:edit?"编辑":"新增",subtitle:"系统管理 · 字典管理",body:`<label class="form-field form-item"><span class="form-label">字典类型</span><input class="form-control" value="${t?.type||""}" disabled></label><div class="form-item"><span class="form-label">标签样式</span><div class="dictionary-style-switch"><button class="active" data-style="default">默认颜色</button><button data-style="custom">自定义颜色</button></div><select class="form-control dictionary-style-select"><option>请选择标签样式</option><option>主要(primary)</option><option>成功(success)</option><option>危险(danger)</option><option>警告(warning)</option></select><input class="form-control dictionary-color-input" type="color" value="#1677ff" hidden></div><label class="form-field form-item"><span class="form-label form-required">数据标签</span><input class="form-control" value="${esc(d.label)}" placeholder="请输入"></label><label class="form-field form-item"><span class="form-label form-required">数据键值</span><input class="form-control" value="${esc(d.value)}" placeholder="请输入"></label><label class="form-field form-item"><span class="form-label">CSS类名</span><textarea class="form-control textarea" placeholder="可使用tailwind类名"></textarea></label><label class="form-field form-item"><span class="form-label form-required">显示排序</span><input class="form-control" value="${d.sort||1}"></label><label class="form-field form-item"><span class="form-label">备注</span><textarea class="form-control textarea">${esc(d.remark)}</textarea></label>`,footer:`<button class="btn btn-secondary" data-drawer-close>取消</button><button class="btn btn-primary" data-drawer-close>确认</button>`});setTimeout(()=>{document.querySelectorAll("[data-style]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-style]").forEach(x=>x.classList.toggle("active",x===b));document.querySelector(".dictionary-style-select").hidden=b.dataset.style!=="default";document.querySelector(".dictionary-color-input").hidden=b.dataset.style!=="custom";});},0);}
render();document.addEventListener("click",e=>{const row=e.target.closest("tr[data-type-id]");if(row&&!e.target.closest("button,input")){currentType=Number(row.dataset.typeId);render();}const a=e.target.closest("[data-action]")?.dataset.action;if(a==="create-type")typeDrawer();if(a==="create-data")dataDrawer();if(a==="reset"){document.querySelectorAll("[data-filter]").forEach(x=>x.value="");render();}if(a==="search"){const f=Object.fromEntries([...document.querySelectorAll("[data-filter]")].map(x=>[x.dataset.filter,x.value]));typeBody.innerHTML=types.filter(t=>(!f.name||t.name.includes(f.name))&&(!f.type||t.type.includes(f.type))).map(t=>`<tr data-type-id="${t.id}"><td></td><td>${t.name}</td><td>${t.type}</td><td>${t.remark}</td><td>${t.created}</td><td>编辑</td></tr>`).join("");}const et=e.target.closest("[data-edit-type]");if(et)typeDrawer(typeOf(et.dataset.editType));const ed=e.target.closest("[data-edit-data]");if(ed)dataDrawer(dataOf(ed.dataset.editData));const dt=e.target.closest("[data-delete-type]");if(dt){const t=typeOf(dt.dataset.deleteType);if(data.some(d=>d.typeId===t.id)){window.openAppConfirm({title:"提示",message:"当前字典类型下存在字典数据，不允许删除。"});}else window.openAppConfirm({title:"提示",message:`确认删除字典类型「${t.name}」吗？`,onConfirm:()=>{types.splice(types.indexOf(t),1);render();}});}const dd=e.target.closest("[data-delete-data]");if(dd)window.openAppConfirm({title:"提示",message:"确认删除该字典数据吗？",onConfirm:()=>{const d=dataOf(dd.dataset.deleteData);data.splice(data.indexOf(d),1);render();}});if(e.target.matches("[data-type-check],[data-data-check]"))updateButtons();});document.addEventListener("change",e=>{if(e.target.matches("[data-select-all=type]"))document.querySelectorAll("[data-type-check]").forEach(x=>x.checked=e.target.checked);if(e.target.matches("[data-select-all=data]"))document.querySelectorAll("[data-data-check]").forEach(x=>x.checked=e.target.checked);updateButtons();});
</script><script>
document.addEventListener("click",e=>{const action=e.target.closest("[data-action]")?.dataset.action;if(action!=="delete-types"&&action!=="delete-data")return;const selector=action==="delete-types"?"[data-type-check]:checked":"[data-data-check]:checked";const selected=[...document.querySelectorAll(selector)];if(!selected.length)return;if(action==="delete-types"&&selected.some(x=>data.some(d=>d.typeId===Number(x.closest("tr").dataset.typeId)))){window.openAppConfirm({title:"提示",message:"当前字典类型下存在字典数据，不允许删除。"});return;}window.openAppConfirm({title:"提示",message:`确认删除选中的【${selected.length}】条记录吗？`,onConfirm:()=>{if(action==="delete-types"){selected.map(x=>typeOf(x.closest("tr").dataset.typeId)).forEach(t=>types.splice(types.indexOf(t),1));}else selected.map(x=>dataOf(x.dataset.dataId)).forEach(d=>data.splice(data.indexOf(d),1));render();}});});
</script><script>syncProjectDictionary();</script></body></html>
