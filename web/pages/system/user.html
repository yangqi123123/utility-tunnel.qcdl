<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>用户管理 - 科学岛管廊监控中心</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/tob-ui.css">
</head>
<body class="user-page" data-menu-key="system.user" data-page-section="系统管理" data-page-title="用户管理">
  <div class="app-shell">
    <aside id="app-sidebar" class="sidebar"></aside>
    <header id="app-header" class="header"></header>
    <main class="main">
      <div class="screen-frame stack">
        <section class="page-head">
          <div><h1 class="page-title">用户管理</h1><p class="page-desc">管理平台用户账号、角色、组织归属与账号状态。</p></div>
          <div class="btn-row"></div>
        </section>

        <section class="card filters user-filters">
          <div class="filter-actions">
            <label class="form-field"><span class="form-label">用户账号</span><input class="form-control" data-filter="account" placeholder="请输入"></label>
            <label class="form-field"><span class="form-label">用户昵称</span><input class="form-control" data-filter="nickname" placeholder="请输入"></label>
            <label class="form-field"><span class="form-label">手机号码</span><input class="form-control" data-filter="phone" placeholder="请输入"></label>
            <label class="form-field"><span class="form-label">用户状态</span><select class="form-control" data-filter="status"><option value="">请选择</option><option value="正常">正常</option><option value="停用">停用</option></select></label>
            <label class="form-field"><span class="form-label">创建时间</span><input class="form-control" data-filter="date" placeholder="开始日期  —  结束日期"></label>
            <button class="btn btn-ghost" type="button" data-action="collapse">收起 <i class="fa-solid fa-chevron-up"></i></button>
            <button class="btn btn-secondary" type="button" data-action="reset">重置</button>
            <button class="btn btn-primary" type="button" data-action="search">搜索</button>
          </div>
        </section>

        <section class="card user-list-card">
          <div class="card-title-row user-toolbar"><h2 class="card-title">用户列表</h2><div class="btn-row"><button class="btn btn-secondary" type="button" data-action="export"><i class="fa-solid fa-download"></i> 导出</button><button class="btn btn-secondary" type="button" data-action="import"><i class="fa-solid fa-upload"></i> 导入</button><button class="btn btn-primary" type="button" data-action="create"><i class="fa-solid fa-plus"></i> 新增</button></div></div>
          <div class="table-wrap"><table class="table user-table"><thead><tr><th class="check-cell"><input type="checkbox" data-select-all></th><th>用户账号</th><th>用户信息</th><th>所属部门</th><th>创建时间</th><th>状态</th><th class="user-actions-col">操作</th></tr></thead><tbody id="userTableBody"></tbody></table></div>
          <div class="pagination"><span>共 <strong id="userCount">0</strong> 条记录，每页 10 条</span><span class="page-item" data-page-action="prev">‹</span><span class="page-item active" data-page-number="1">1</span><span class="page-item" data-page-number="2">2</span><span class="page-item" data-page-number="3">3</span><span class="page-item" data-page-number="4">4</span><span>...</span><span class="page-item" data-page-number="4">4</span><span class="page-item" data-page-action="next">›</span></div>
        </section>
      </div>
    </main>
  </div>

  <script>
    document.addEventListener("click", (event) => {
      const deleteButton = event.target.closest('[data-user-action="delete"]');
      if (!deleteButton) return;
      event.preventDefault();
      event.stopImmediatePropagation();
      const user = userById(deleteButton.dataset.userId);
      window.openAppConfirm({ title: "提示", message: `确认删除用户「${user.nickname}」吗？`, onConfirm: () => { const index = users.findIndex((item) => item.id === user.id); if (index >= 0) users.splice(index, 1); currentPage = 1; renderUsers(users); } });
    }, true);
  </script>
  <script src="../../../app/config/menu.js?v=nav-hide-1"></script>
  <script src="../../../app/components/sidebar.js?v=nav-home-1"></script>
  <script src="../../../app/components/header.js?v=nav-home-1"></script>
  <script src="../../../app/components/drawer.js"></script>
  <script src="../../../app/components/requirement.js"></script>
  <script>
    const users = [
      { id: 1, account: "1000001", nickname: "Open AI", phone: "-", department: "市场部门", created: "2026-07-11 14:01:25", status: "停用" },
      { id: 2, account: "1000002", nickname: "DeepSeek 深蓝", phone: "-", department: "市场部门", created: "2026-07-11 14:01:25", status: "停用" },
      { id: 3, account: "1000003", nickname: "Qwen 克温", phone: "-", department: "市场部门", created: "2026-07-11 14:01:25", status: "停用" },
      ...Array.from({ length: 28 }, (_, index) => ({ id: index + 4, account: `100000${index + 4}`, nickname: `用户${index + 4}`, phone: "-", department: index % 3 === 0 ? "研发部门" : "市场部门", created: "2026-07-11 14:01:25", status: "正常" }))
    ];
    const body = document.getElementById("userTableBody");
    let filteredUsers = users;
    let currentPage = 1;
    const pageSize = 10;
    function renderUsers(list = filteredUsers) {
      filteredUsers = list;
      const totalPages = Math.max(1, Math.ceil(filteredUsers.length / pageSize));
      currentPage = Math.min(currentPage, totalPages);
      const pageUsers = filteredUsers.slice((currentPage - 1) * pageSize, currentPage * pageSize);
      body.innerHTML = pageUsers.map((user) => `<tr data-user-id="${user.id}"><td class="check-cell"><input type="checkbox" data-user-check></td><td>${user.account}</td><td><div class="user-cell"><span class="user-list-avatar"><i class="fa-solid fa-user"></i></span><div><strong>${user.nickname}</strong><small>${user.phone}</small></div></div></td><td>${user.department}</td><td>${user.created}</td><td><button class="status-switch ${user.status === "正常" ? "on" : "off"}" type="button" data-toggle-status="${user.id}">${user.status}</button></td><td class="user-actions-col"><button class="table-action" data-user-action="edit" data-user-id="${user.id}">编辑</button><button class="table-action status-danger" data-user-action="delete" data-user-id="${user.id}">删除</button><button class="table-action" data-user-action="more" data-user-id="${user.id}">更多</button></td></tr>`).join("");
      document.getElementById("userCount").textContent = filteredUsers.length;
      document.querySelectorAll("[data-page-number]").forEach((item) => item.classList.toggle("active", Number(item.dataset.pageNumber) === currentPage));
      document.querySelector('[data-page-action="prev"]').classList.toggle("disabled", currentPage === 1);
      document.querySelector('[data-page-action="next"]').classList.toggle("disabled", currentPage === totalPages);
    }
    function userById(id) { return users.find((user) => String(user.id) === String(id)) || users[0]; }
    function openUserDrawer(mode, user = users[0]) {
      const isCreate = mode === "create";
      const isReset = mode === "reset";
      const title = isCreate ? "新增用户" : isReset ? "重置密码" : mode === "detail" ? "用户信息" : "编辑用户";
      const content = isReset ? `<section class="detail-section"><h3 class="detail-title">基础信息</h3><div class="detail-grid"><div class="info-item"><span class="info-label">用户账号</span><span class="info-value">${user.account}</span></div><div class="info-item"><span class="info-label">用户昵称</span><span class="info-value">${user.nickname}</span></div></div></section><label class="form-field form-item"><span class="form-label form-required">新的密码</span><input class="form-control" type="password" placeholder="请输入新密码，密码长度为 5 - 20 位"></label>` : mode === "detail" ? `<section class="detail-section"><h3 class="detail-title">基础信息</h3><div class="detail-grid user-detail-grid"><div class="info-item"><span class="info-label">唯一标识</span><span class="info-value">${user.id}</span></div><div class="info-item"><span class="info-label">用户信息</span><span class="info-value">${user.account} / ${user.nickname} / ${user.department}</span></div><div class="info-item"><span class="info-label">手机号码</span><span class="info-value">${user.phone}</span></div><div class="info-item"><span class="info-label">电子邮箱</span><span class="info-value">-</span></div><div class="info-item"><span class="info-label">所属岗位</span><span class="info-value">-</span></div><div class="info-item"><span class="info-label">角色权限</span><span class="info-value">仅本人</span></div><div class="info-item"><span class="info-label">创建时间</span><span class="info-value">${user.created}</span></div><div class="info-item"><span class="info-label">用户状态</span><span class="info-value"><span class="tag ${user.status === "正常" ? "success" : "danger"}">${user.status}</span></span></div><div class="info-item"><span class="info-label">上次登录IP</span><span class="info-value">-</span></div><div class="info-item"><span class="info-label">上次登录时间</span><span class="info-value">-</span></div><div class="info-item"><span class="info-label">备注信息</span><span class="info-value">-</span></div></div></section>` : `<div class="form-grid-2"><label class="form-field form-item"><span class="form-label form-required">用户账号</span><input class="form-control" value="${isCreate ? "" : user.account}" placeholder="请输入"></label><label class="form-field form-item"><span class="form-label form-required">用户昵称</span><input class="form-control" value="${isCreate ? "" : user.nickname}" placeholder="请输入"></label><label class="form-field form-item"><span class="form-label">手机号码</span><input class="form-control" value="${user.phone === "-" ? "" : user.phone}" placeholder="请输入"></label><label class="form-field form-item"><span class="form-label form-required">所属角色</span><select class="form-control"><option>请选择</option><option>普通用户</option><option>管理员</option></select></label></div><label class="form-field form-item"><span class="form-label form-required">所属部门</span><select class="form-control"><option>市场部门</option><option>研发部门</option><option>财务部门</option></select></label><label class="form-field form-item"><span class="form-label">备注信息</span><textarea class="form-control textarea" placeholder="请输入"> </textarea></label>`;
      window.openAppDrawer({ title, subtitle: "系统管理 · 用户管理", body: content, footer: `<button class="btn btn-secondary" type="button" data-drawer-close>取消</button>${mode === "detail" ? "" : `<button class="btn btn-primary" type="button" data-drawer-close>${isReset ? "确认重置" : "确认"}</button>`}` });
    }
    renderUsers();
    document.addEventListener("click", (event) => {
      const action = event.target.closest("[data-action]")?.dataset.action;
      if (action === "create") openUserDrawer("create");
      if (action === "import") window.openAppDrawer({ title: "用户导入", subtitle: "系统管理 · 用户管理", body: `<div class="upload-box"><i class="fa-solid fa-box-open"></i><p>点击或拖拽到此处上传文件</p></div><p class="helper-text">允许导入 xlsx、xls 文件　<a href="#">下载模板</a></p><label class="switch-line"><span>是否更新/覆盖已存在的用户数据</span><input type="checkbox"></label>`, footer: `<button class="btn btn-secondary" data-drawer-close>取消</button><button class="btn btn-primary" data-drawer-close>确认</button>` });
      const rowAction = event.target.closest("[data-user-action]");
      if (rowAction) {
        if (rowAction.dataset.userAction === "more") {
          document.querySelectorAll(".user-more-menu").forEach((menu) => menu.remove());
          const menu = document.createElement("div"); menu.className = "user-more-menu"; menu.innerHTML = `<button type="button" data-more-action="info" data-user-id="${rowAction.dataset.userId}">用户信息</button><button type="button" data-more-action="reset" data-user-id="${rowAction.dataset.userId}">重置密码</button>`;
          document.body.append(menu);
          const rect = rowAction.getBoundingClientRect();
          menu.style.top = `${rect.bottom + 8}px`;
          menu.style.left = `${Math.max(8, rect.right - 96)}px`;
          return;
        }
        openUserDrawer(rowAction.dataset.userAction, userById(rowAction.dataset.userId));
      }
      const moreAction = event.target.closest("[data-more-action]");
      if (moreAction) { document.querySelectorAll(".user-more-menu").forEach((menu) => menu.remove()); openUserDrawer(moreAction.dataset.moreAction === "info" ? "detail" : "reset", userById(moreAction.dataset.userId)); }
      if (!event.target.closest("[data-user-action], .user-more-menu")) document.querySelectorAll(".user-more-menu").forEach((menu) => menu.remove());
      const toggle = event.target.closest("[data-toggle-status]");
      if (toggle) { const user = userById(toggle.dataset.toggleStatus); user.status = user.status === "正常" ? "停用" : "正常"; renderUsers(); }
      if (action === "reset") { document.querySelectorAll("[data-filter]").forEach((input) => input.value = ""); currentPage = 1; renderUsers(users); }
      if (action === "search") { const filters = Object.fromEntries([...document.querySelectorAll("[data-filter]")].map((input) => [input.dataset.filter, input.value])); currentPage = 1; renderUsers(users.filter((user) => (!filters.account || user.account.includes(filters.account)) && (!filters.nickname || user.nickname.includes(filters.nickname)) && (!filters.phone || user.phone.includes(filters.phone)) && (!filters.status || user.status === filters.status))); }
      const pageNumber = event.target.closest("[data-page-number]");
      const pageAction = event.target.closest("[data-page-action]");
      if (pageNumber) { currentPage = Number(pageNumber.dataset.pageNumber); renderUsers(); }
      if (pageAction) { const totalPages = Math.max(1, Math.ceil(filteredUsers.length / pageSize)); currentPage = pageAction.dataset.pageAction === "prev" ? Math.max(1, currentPage - 1) : Math.min(totalPages, currentPage + 1); renderUsers(); }
      const row = event.target.closest("#userTableBody tr");
      if (row && !event.target.closest("button, input, select, a")) openUserDrawer("detail", userById(row.dataset.userId));
    });
  </script>
<script>
document.addEventListener("click", (event) => {
  const deleteButton = event.target.closest('[data-user-action="delete"]');
  if (!deleteButton) return;
  event.preventDefault();
  event.stopImmediatePropagation();
  const user = userById(deleteButton.dataset.userId);
  window.openAppConfirm({ title: "提示", message: `确认删除用户「${user.nickname}」吗？`, onConfirm: () => { const index = users.findIndex((item) => item.id === user.id); if (index >= 0) users.splice(index, 1); currentPage = 1; renderUsers(users); } });
}, true);
</script>
</body>
</html>
