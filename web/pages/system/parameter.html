<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>参数设置</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="../../assets/css/tob-ui.css"></head><body class="parameter-page" data-menu-key="system.parameter" data-page-section="系统管理" data-page-title="参数设置"><div class="app-shell"><aside id="app-sidebar" class="sidebar"></aside><header id="app-header" class="header"></header><main class="main"><div class="screen-frame stack"><section class="card filters"><div class="filter-actions parameter-filter-row"><label class="form-field"><span class="form-label">参数名称</span><input class="form-control" data-filter="name" placeholder="请输入"></label><label class="form-field"><span class="form-label">参数键名</span><input class="form-control" data-filter="key" placeholder="请输入"></label><label class="form-field"><span class="form-label">系统内置</span><select class="form-control" data-filter="builtin"><option value="">请选择</option><option>是</option><option>否</option></select></label><button class="btn btn-secondary" data-action="reset">重置</button><button class="btn btn-primary" data-action="search">搜索</button></div></section><section class="card parameter-list-card"><div class="card-title-row parameter-toolbar"><h2 class="card-title">参数列表</h2><div class="btn-row"><button class="btn btn-secondary">刷新缓存</button><button class="btn btn-danger-outline" data-action="delete-selected" disabled>删除</button><button class="btn btn-primary" data-action="create">新增</button></div></div><div class="table-wrap"><table class="table parameter-table"><thead><tr><th class="check-cell"><input type="checkbox" data-select-all></th><th>参数名称</th><th>参数键名</th><th>参数键值</th><th>备注信息</th><th>内置</th><th>操作</th></tr></thead><tbody id="parameterTable"></tbody></table></div></section></div></main></div><script src="../../../app/config/menu.js?v=nav-hide-1"></script><script src="../../../app/components/sidebar.js?v=nav-home-1"></script><script src="../../../app/components/header.js?v=nav-home-1"></script><script src="../../../app/components/drawer.js"></script><script>
const parameters=[{id:1,name:"用户管理-账号初始密码",key:"sys.user.initPassword",value:"123456",remark:"初始化密码 123456",builtin:"是"},{id:2,name:"账号自助-是否开启用户注册功能",key:"sys.account.registerUser",value:"false",remark:"是否开启注册用户功能（true开启，false关闭）",builtin:"是"},{id:3,name:"OSS预览列表资源开关",key:"sys.oss.previewListResource",value:"true",remark:"true:开启, false:关闭",builtin:"是"},{id:4,name:"prod环境方法限制排除路径",key:"sys.security.prodMethodExcludePaths",value:"/demo/leave/**",remark:"逗号/分号/换行分隔，支持Ant路径",builtin:"否"},{id:5,name:"登录公告开关",key:"sys.notice.enable",value:"true",remark:"true开启登录公告，false关闭",builtin:"否"},{id:6,name:"登录公告内容",key:"sys.notice.content",value:"当前部署为后端v6版本",remark:"登录页公告内容",builtin:"否"},{id:7,name:"登录IP黑名单",key:"sys.security.loginIpBlacklist",value:"36.129.8.62",remark:"禁止登录的IP规则",builtin:"否"}];const table=document.getElementById("parameterTable");const esc=v=>String(v??"").replaceAll("\"","&quot;");function render(list=parameters){table.innerHTML=list.map(p=>`<tr><td class="check-cell"><input type="checkbox" data-check data-id="${p.id}"></td><td>${p.name}</td><td>${p.key}</td><td>${p.value}</td><td>${p.remark}</td><td><span class="tag ${p.builtin==="是"?"primary":"danger"}">${p.builtin}</span></td><td><button class="table-action" data-edit="${p.id}">编辑</button><button class="table-action status-danger" data-delete="${p.id}">删除</button></td></tr>`).join("");document.querySelector('[data-action="delete-selected"]').disabled=!document.querySelector("[data-check]:checked");}function openParameter(edit){const p=edit||{};window.openAppDrawer({title:edit?"编辑":"新增",subtitle:"系统管理 · 参数设置",body:`<label class="form-field form-item"><span class="form-label form-required">参数名称</span><input class="form-control" value="${esc(p.name)}" placeholder="请输入"></label><label class="form-field form-item"><span class="form-label form-required">参数键名</span><input class="form-control" value="${esc(p.key)}" placeholder="请输入"></label><label class="form-field form-item"><span class="form-label form-required">参数键值</span><input class="form-control" value="${esc(p.value)}" placeholder="请输入"></label><div class="menu-choice-row"><span class="form-label">是否内置</span><button class="active">是</button><button>否</button></div><label class="form-field form-item"><span class="form-label">备注信息</span><textarea class="form-control textarea" placeholder="请输入">${esc(p.remark)}</textarea></label>`,footer:`<button class="btn btn-secondary" data-drawer-close>取消</button><button class="btn btn-primary" data-drawer-close>确认</button>`});}render();document.addEventListener("click",e=>{const a=e.target.closest("[data-action]")?.dataset.action;if(a==="create")openParameter();if(a==="reset"){document.querySelectorAll("[data-filter]").forEach(x=>x.value="");render();}if(a==="search"){const f=Object.fromEntries([...document.querySelectorAll("[data-filter]")].map(x=>[x.dataset.filter,x.value]));render(parameters.filter(p=>(!f.name||p.name.includes(f.name))&&(!f.key||p.key.includes(f.key))&&(!f.builtin||p.builtin===f.builtin)));}const edit=e.target.closest("[data-edit]");if(edit)openParameter(parameters.find(p=>p.id===Number(edit.dataset.edit)));const del=e.target.closest("[data-delete]");if(del){const p=parameters.find(x=>x.id===Number(del.dataset.delete));window.openAppConfirm({title:"提示",message:`确认删除参数「${p.name}」吗？`,onConfirm:()=>{parameters.splice(parameters.indexOf(p),1);render();}});}if(e.target.matches("[data-check]"))render();if(a==="delete-selected"){const selected=[...document.querySelectorAll("[data-check]:checked")];if(selected.length)window.openAppConfirm({title:"提示",message:`确认删除选中的【${selected.length}】条参数记录吗？`,onConfirm:()=>{selected.forEach(x=>{const p=parameters.find(v=>v.id===Number(x.dataset.id));parameters.splice(parameters.indexOf(p),1);});render();}});}});document.addEventListener("change",e=>{if(e.target.matches("[data-select-all]"))document.querySelectorAll("[data-check]").forEach(x=>x.checked=e.target.checked);render();});
</script><script src="../../../app/components/requirement.js"></script></body></html>
