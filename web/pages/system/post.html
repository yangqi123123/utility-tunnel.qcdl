<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>岗位管理 - 科学岛管廊监控中心</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="../../assets/css/tob-ui.css"></head>
<body class="post-page" data-menu-key="system.post" data-page-section="系统管理" data-page-title="岗位管理">
<div class="app-shell"><aside id="app-sidebar" class="sidebar"></aside><header id="app-header" class="header"></header><main class="main"><div class="screen-frame stack">
<section class="page-head"><div><h1 class="page-title">岗位管理</h1><p class="page-desc">维护岗位编码、岗位名称、所属部门与岗位状态。</p></div></section>
<section class="card filters post-filters"><div class="filter-actions post-filter-row"><label class="form-field"><span class="form-label">岗位编码</span><input class="form-control" data-filter="code" placeholder="请输入"></label><label class="form-field"><span class="form-label">岗位名称</span><input class="form-control" data-filter="name" placeholder="请输入"></label><label class="form-field"><span class="form-label">状态</span><select class="form-control" data-filter="status"><option value="">请选择</option><option>正常</option><option>停用</option></select></label><button class="btn btn-ghost">收起 <i class="fa-solid fa-chevron-up"></i></button><button class="btn btn-secondary" data-action="reset">重置</button><button class="btn btn-primary" data-action="search">搜索</button></div></section>
<section class="card post-list-card"><div class="card-title-row post-toolbar"><h2 class="card-title">岗位列表</h2><div class="btn-row"><button class="btn btn-secondary">导出</button><button class="btn btn-secondary" data-action="delete-selected" disabled>删除</button><button class="btn btn-primary" data-action="create"><i class="fa-solid fa-plus"></i> 新增</button></div></div><div class="table-wrap"><table class="table post-table"><thead><tr><th class="check-cell"><input type="checkbox"></th><th>岗位编码</th><th>类别编码</th><th>岗位名称</th><th>排序</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead><tbody id="postTable"></tbody></table></div></section>
</div></main></div>
<script src="../../../app/config/menu.js?v=nav-hide-1"></script><script src="../../../app/components/sidebar.js?v=nav-home-1"></script><script src="../../../app/components/header.js?v=nav-home-1"></script><script src="../../../app/components/drawer.js"></script><script src="../../../app/components/requirement.js"></script>
<script>
const posts=[{id:1,code:"ceo",category:"",name:"董事长",sort:1,status:"正常",created:"2026-07-01 10:02:28",department:"XXX科技"},{id:2,code:"a",category:"",name:"a",sort:1,status:"正常",created:"2026-07-22 18:53:07",department:"深圳总公司"},{id:3,code:"se",category:"",name:"项目经理",sort:2,status:"正常",created:"2026-07-01 10:02:28",department:"研发部门"},{id:4,code:"hr",category:"",name:"人力资源",sort:3,status:"正常",created:"2026-07-01 10:02:28",department:"市场部门"},{id:5,code:"user",category:"",name:"普通员工",sort:4,status:"正常",created:"2026-07-01 10:02:28",department:"财务部门"}];
const table=document.getElementById("postTable");
function renderPosts(list=posts){table.innerHTML=list.map((post)=>`<tr><td class="check-cell"><input type="checkbox" data-post-check></td><td>${post.code}</td><td>${post.category}</td><td>${post.name}</td><td>${post.sort}</td><td><span class="tag success">${post.status}</span></td><td>${post.created}</td><td><button class="table-action" data-post-action="edit" data-post-id="${post.id}">编辑</button><button class="table-action status-danger" data-post-action="delete" data-post-id="${post.id}">删除</button></td></tr>`).join("");}
function postById(id){return posts.find((post)=>String(post.id)===String(id))||posts[0];}
function openPostDrawer(mode="create",post=posts[0]){const body=`<label class="form-field form-item"><span class="form-label form-required">所属部门</span><select class="form-control"><option>请选择</option><option>${post.department}</option><option>深圳总公司</option><option>研发部门</option></select></label><label class="form-field form-item"><span class="form-label form-required">岗位名称</span><input class="form-control" value="${mode==="edit"?post.name:""}" placeholder="请输入"></label><label class="form-field form-item"><span class="form-label form-required">岗位编码</span><input class="form-control" value="${mode==="edit"?post.code:""}" placeholder="请输入"></label><label class="form-field form-item"><span class="form-label">类别编码</span><input class="form-control" placeholder="请输入"></label><label class="form-field form-item"><span class="form-label form-required">岗位排序</span><input class="form-control" value="${mode==="edit"?post.sort:1}"></label><div class="menu-choice-row"><span class="form-label">岗位状态</span><button class="active">正常</button><button>停用</button></div><label class="form-field form-item"><span class="form-label">备注</span><textarea class="form-control textarea" placeholder="请输入"></textarea></label>`;window.openAppDrawer({title:mode==="edit"?"编辑":"新增",subtitle:"系统管理 · 岗位管理",body,footer:`<button class="btn btn-secondary" data-drawer-close>取消</button><button class="btn btn-primary" data-drawer-close>确认</button>`});}
renderPosts();document.addEventListener("click",(event)=>{const action=event.target.closest("[data-action]")?.dataset.action;if(action==="create")openPostDrawer();if(action==="reset"){document.querySelectorAll("[data-filter]").forEach((input)=>input.value="");renderPosts();}if(action==="search"){const f=Object.fromEntries([...document.querySelectorAll("[data-filter]")].map((input)=>[input.dataset.filter,input.value]));renderPosts(posts.filter((post)=>(!f.code||post.code.includes(f.code))&&(!f.name||post.name.includes(f.name))&&(!f.status||post.status===f.status)));}const rowAction=event.target.closest("[data-post-action]");if(rowAction){const post=postById(rowAction.dataset.postId);if(rowAction.dataset.postAction==="edit")openPostDrawer("edit",post);else window.openAppConfirm({title:"提示",message:`确认删除岗位「${post.name}」吗？`,onConfirm:()=>{const index=posts.findIndex((item)=>item.id===post.id);if(index>=0)posts.splice(index,1);renderPosts();}});}if(event.target.closest("[data-post-check]"))document.querySelector('[data-action="delete-selected"]').disabled=!document.querySelector("[data-post-check]:checked");});
</script><script>
document.addEventListener("click", (event) => {
  const button = event.target.closest('[data-action="delete-selected"]');
  if (!button || button.disabled) return;
  const selected = [...document.querySelectorAll("[data-post-check]:checked")];
  if (!selected.length) return;
  window.openAppConfirm({title: "提示", message: `确认删除选中的【${selected.length}】条岗位记录吗？`, onConfirm: () => {
    const ids = new Set(selected.map((item) => item.closest("tr")?.querySelector("[data-post-action]")?.dataset.postId));
    for (let index = posts.length - 1; index >= 0; index -= 1) if (ids.has(String(posts[index].id))) posts.splice(index, 1);
    renderPosts();
    document.querySelector('[data-action="delete-selected"]').disabled = true;
  }});
});
</script></body></html>
