<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>项目管理</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="../../assets/css/tob-ui.css" />
    <link rel="stylesheet" href="../../assets/css/project-management.css?v=3" />
  </head>
  <body
    class="project-page"
    data-menu-key="project.manage"
    data-page-section="数据库管理"
    data-page-title="项目管理"
  >
    <div class="app-shell">
      <aside id="app-sidebar" class="sidebar"></aside>
      <header id="app-header" class="header"></header>
      <main class="main">
        <div class="screen-frame stack">
          <section class="project-filter-card">
            <div class="project-filter-grid">
              <label
                ><span class="form-label">项目名称</span
                ><input
                  class="form-control"
                  data-filter="name"
                  placeholder="请输入项目名称" /></label
              ><label><span class="form-label">项目编码</span><input class="form-control" data-filter="code" placeholder="请输入项目编码" /></label
              ><label
                ><span class="form-label">项目类型</span
                ><select class="form-control" data-filter="type">
                  <option value="">请选择</option>
                  <option>综合管廊</option><option>缆线管廊</option><option>地下管廊</option><option>跨河管廊</option>
                </select></label
              ><label
                ><span class="form-label">项目状态</span
                ><select class="form-control" data-filter="status">
                  <option value="">请选择</option>
                  <option>建设中</option>
                  <option>待完善</option>
                  <option>已完工</option>
                  <option>停用</option>
                </select></label
              >
              <button class="btn btn-ghost" data-action="collapse">
                <span>展开</span> <i class="fa-solid fa-chevron-down"></i>
              </button>
              <button class="btn btn-secondary" data-action="reset">重置</button>
              <button class="btn btn-primary" data-action="search">搜索</button>
              <label class="extra-filter"
                ><span class="form-label">项目负责人</span><input class="form-control" data-filter="owner" placeholder="请输入项目负责人" /></label
              ><label class="extra-filter"
                ><span class="form-label">所在区域</span
                ><select class="form-control" data-filter="region">
                  <option value="">请选择</option>
                  <option>东湖高新区</option><option>洪山区</option><option>江夏区</option><option>汉阳区</option>
                </select></label
              ><label class="extra-filter"
                ><span class="form-label">建设单位</span><input class="form-control" data-filter="builder" placeholder="请输入建设单位" /></label
              ><label class="extra-filter"
                ><span class="form-label">运营单位</span><input class="form-control" data-filter="operator" placeholder="请输入运营单位" /></label
              >
            </div>
          </section>
          <section class="project-list-card">
            <div class="project-toolbar">
              <h2>项目档案</h2>
              <div class="project-toolbar-actions">
                <button class="btn btn-secondary" data-action="export"><i class="fa-solid fa-file-export"></i> 导出</button>
                <button class="btn btn-secondary" data-action="delete-selected" disabled style="display:none"><!-- 隐藏删除按钮：后续恢复请删除 style="display:none" --><i class="fa-solid fa-trash"></i> 删除</button>
                <button class="btn btn-primary project-create-button" data-action="create" style="display:none"><!-- 隐藏新增项目按钮：后续恢复请删除 style="display:none" -->
                  <i class="fa-solid fa-plus"></i> 新增项目
                </button>
              </div>
            </div>
            <div class="table-wrap">
              <table class="table project-table">
                <thead>
                  <tr>
                    <th class="check-cell"><input type="checkbox" data-select-all aria-label="全选" /></th>
                    <th>项目编码</th>
                    <th>项目名称</th>
                    <th>项目类型</th>
                    <th>建设单位</th>
                    <th>运营单位</th>
                    <th>所在区域</th>
                    <th>项目状态</th>
                    <th>舱室数量</th>
                    <th>管廊数量</th>
                    <th>区段数量</th>
                    <th>管线数量</th>
                    <th>设备数量</th>
                    <th>项目负责人</th>
                    <th>建设开始日期</th>
                    <th>计划完工日期</th>
                    <th>最后更新时间</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="projectRows"></tbody>
              </table>
            </div>
            <div class="project-pagination">
              <span id="projectCount"></span
              ><span>10条/页　‹　«　<b>1</b>　»　›</span>
            </div>
          </section>
        </div>
      </main>
    </div>
    <script src="../../../app/config/menu.js?v=nav-hide-1"></script>
    <script src="../../../app/components/sidebar.js?v=nav-home-1"></script>
    <script src="../../../app/components/header.js?v=nav-home-1"></script>
    <script src="../../../app/components/drawer.js"></script>
    <script src="../../assets/vendor/xlsx.full.min.js"></script>
    <script src="../../../app/components/requirement.js"></script>
    <script>
      (() => {
        let drawerDraft = null;
        let drawerMode = "";
        let drawerProjectId = null;
        const projects = [
          {
            id: 1,
            code: "PRJ-DH-001",
            name: "光谷科学岛综合管廊一期",
            shortName: "科学岛一期",
            corridorProject: "光谷科学岛综合开发项目",
            type: "综合管廊",
            status: "建设中",
            region: "东湖高新区",
            addressRegion: "湖北省 / 武汉市",
            address: "东湖高新区科学岛大道",
            longitude: "114.447",
            latitude: "30.489",
            builder: "东湖高新区建设局",
            designer: "武汉市政设计研究院",
            constructor: "科学岛建设发展有限公司",
            supervisor: "武汉工程建设监理有限公司",
            operator: "光谷科学岛运维中心",
            owner: "张建国",
            phone: "13800001234",
            corridorCount: 2,
            cabinCount: 4,
            sectionCount: 33,
            pipelineCount: 16,
            deviceCount: 286,
            startDate: "2023-03-01",
            plannedEndDate: "2026-12-31",
            actualEndDate: "",
            updatedAt: "2026-09-26 14:20",
            description: "服务科学岛片区的综合管廊工程。",
          },
        ];
        const esc = (v) =>
          String(v ?? "").replace(
            /[&<>"']/g,
            (c) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              })[c],
          );
        const byId = (id) => projects.find((p) => p.id === +id);
        function filtered() {
          const val = (k) => document.querySelector(`[data-filter="${k}"]`)?.value.trim() || "";
          const name = val("name"),
            code = val("code"),
            owner = val("owner"),
            builder = val("builder"),
            operator = val("operator"),
            t = val("type"),
            s = val("status"),
            region = val("region");
          return projects.filter(
            (p) =>
              (!name || p.name.includes(name)) &&
              (!code || p.code.includes(code)) &&
              (!t || p.type === t) &&
              (!s || p.status === s) &&
              (!owner || (p.owner || "").includes(owner)) &&
              (!region || p.region === region) &&
              (!builder || (p.builder || "").includes(builder)) &&
              (!operator || (p.operator || "").includes(operator)),
          );
        }
        const selectedIds = new Set();
        function syncSelection() {
          const deleteBtn = document.querySelector('[data-action="delete-selected"]');
          if (deleteBtn) deleteBtn.disabled = selectedIds.size === 0;
          const selectAll = document.querySelector("[data-select-all]");
          if (selectAll) {
            const boxes = [...document.querySelectorAll("[data-select-id]")];
            selectAll.checked =
              boxes.length > 0 && boxes.every((b) => selectedIds.has(+b.dataset.selectId));
          }
        }
        function renderRows(list = filtered()) {
          document.getElementById("projectRows").innerHTML = list.length
            ? list
                .map(
                  (p) =>
                    `<tr><td class="check-cell"><input type="checkbox" data-select-id="${p.id}" ${selectedIds.has(p.id) ? "checked" : ""} aria-label="选择${esc(p.name)}" /></td><td>${esc(p.code)}</td><td>${esc(p.name)}</td><td>${esc(p.type)}</td><td>${esc(p.builder)}</td><td>${esc(p.operator)}</td><td>${esc(p.region)}</td><td><span class="tag ${p.status === "建设中" ? "primary" : p.status === "停用" ? "danger" : p.status === "已完工" ? "success" : "warning"}">${esc(p.status)}</span></td><td>${p.cabinCount || 0}</td><td>${p.corridorCount || 0}</td><td>${p.sectionCount || 0}</td><td>${p.pipelineCount || 0}</td><td>${p.deviceCount || 0}</td><td>${esc(p.owner)}</td><td>${esc(p.startDate)}</td><td>${esc(p.plannedEndDate)}</td><td>${esc(p.updatedAt)}</td><td class="action-cell"><button class="table-action" data-project-action="detail" data-project-id="${p.id}">详情</button><button class="table-action" data-project-action="edit" data-project-id="${p.id}">编辑</button><button class="table-action" data-project-action="corridors" data-project-id="${p.id}">管廊管理</button><button class="table-action status-danger" data-project-action="delete" data-project-id="${p.id}" style="display:none">删除</button></td></tr>`,
                )
                .join("")
            : '<tr><td colspan="18" class="empty-cell">暂无数据</td></tr>';
          document.getElementById("projectCount").textContent =
            `共 ${list.length} 条记录`;
          syncSelection();
        }
        const exportHeaders = [
          "项目编码", "项目名称", "项目简称", "项目类型", "项目状态", "所在区域",
          "项目地址", "详细地址", "经度", "纬度", "建设单位", "设计单位", "施工单位",
          "监理单位", "运营单位", "项目负责人", "联系电话", "舱室数量", "管廊数量",
          "区段数量", "管线数量", "设备数量", "建设开始日期", "计划完工日期",
          "实际完工日期", "最后更新时间", "项目简介",
        ];
        function ensureXlsx() {
          if (window.XLSX) return true;
          window.openAppConfirm?.({ title: "提示", message: "Excel 组件加载失败，请刷新页面后重试。", confirmText: "知道了" });
          return false;
        }
        function downloadWorkbook(book, name) {
          const content = XLSX.write(book, { bookType: "xlsx", type: "array" });
          const blob = new Blob([content], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = name;
          document.body.append(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
        }
        function exportProjects() {
          if (!ensureXlsx()) return;
          const rows = filtered().map((p) => ({
            项目编码: p.code || "",
            项目名称: p.name || "",
            项目简称: p.shortName || "",
            项目类型: p.type || "",
            项目状态: p.status || "",
            所在区域: p.region || "",
            项目地址: p.addressRegion || "",
            详细地址: p.address || "",
            经度: p.longitude || "",
            纬度: p.latitude || "",
            建设单位: p.builder || "",
            设计单位: p.designer || "",
            施工单位: p.constructor || "",
            监理单位: p.supervisor || "",
            运营单位: p.operator || "",
            项目负责人: p.owner || "",
            联系电话: p.phone || "",
            舱室数量: p.cabinCount ?? 0,
            管廊数量: p.corridorCount ?? 0,
            区段数量: p.sectionCount ?? 0,
            管线数量: p.pipelineCount ?? 0,
            设备数量: p.deviceCount ?? 0,
            建设开始日期: p.startDate || "",
            计划完工日期: p.plannedEndDate || "",
            实际完工日期: p.actualEndDate || "",
            最后更新时间: p.updatedAt || "",
            项目简介: p.description || "",
          }));
          const sheet = XLSX.utils.json_to_sheet(rows.length ? rows : [{ 项目编码: "" }], { header: exportHeaders });
          const book = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(book, sheet, "项目管理");
          downloadWorkbook(book, "项目管理.xlsx");
        }
        const fields = [
          ["code", "项目编码"],
          ["name", "项目名称"],
          ["shortName", "项目简称"],
          ["type", "项目类型"],
          ["status", "项目状态"],
          ["addressRegion", "项目地址"],
          ["longitude", "经纬度"],
          ["builder", "建设单位"],
          ["designer", "设计单位"],
          ["constructor", "施工单位"],
          ["supervisor", "监理单位"],
          ["operator", "运营单位"],
          ["owner", "项目负责人"],
          ["phone", "联系电话"],
          ["startDate", "建设开始日期"],
          ["plannedEndDate", "计划完工日期"],
          ["actualEndDate", "实际完工日期"],
          ["description", "项目简介"],
        ];
        function formBody(p = {}, detail = false) {
          const regions = ["湖北省 / 武汉市", "福建省 / 厦门市", "广东省 / 广州市"];
          return `<div class="project-drawer-grid">${fields.map(([k, l]) => {
            const disabled = detail ? "disabled" : "";
            if (k === "type") return `<label class="project-field"><span class="form-label form-required">项目类型</span><select class="form-control" data-project-field="type" ${disabled}><option value="">请选择</option>${["综合管廊","缆线管廊","地下管廊","跨河管廊"].map((type) => `<option ${type === p.type ? "selected" : ""}>${type}</option>`).join("")}</select></label>`;
            if (k === "status") return `<label class="project-field"><span class="form-label">项目状态</span><select class="form-control" data-project-field="status" ${disabled}>${["建设中","待完善","已完工","停用"].map((status) => `<option ${status === (p.status || "待完善") ? "selected" : ""}>${status}</option>`).join("")}</select></label>`;
            if (k === "addressRegion") return `<label class="project-field full"><span class="form-label">项目地址</span><span class="project-address"><select class="form-control" data-project-field="addressRegion" ${disabled}>${regions.map((region) => `<option ${region === (p.addressRegion || regions[0]) ? "selected" : ""}>${region}</option>`).join("")}</select><input class="form-control" data-project-field="address" value="${esc(p.address || "")}" placeholder="请输入详细地址" ${disabled}></span></label>`;
            if (k === "longitude") return `<label class="project-field full"><span class="form-label">经纬度</span><span class="project-coordinates"><input class="form-control" data-project-field="longitude" value="${esc(p.longitude || "")}" placeholder="经度" ${disabled}><input class="form-control" data-project-field="latitude" value="${esc(p.latitude || "")}" placeholder="纬度" ${disabled}><button class="map-locate-btn" type="button" data-map-location ${disabled}><i class="fa-solid fa-location-dot"></i></button></span></label>`;
            if (k === "description") return `<label class="project-field full"><span class="form-label">项目简介</span><textarea class="form-control textarea" rows="4" data-project-field="${k}" ${disabled}>${esc(p[k] || "")}</textarea></label>`;
            const type = ["startDate", "plannedEndDate", "actualEndDate"].includes(k) ? "date" : "text";
            const value = Object.prototype.hasOwnProperty.call(p, k) ? p[k] : "";
            return `<label class="project-field"><span class="form-label ${["code", "name", "type"].includes(k) ? "form-required" : ""}">${l}</span><input class="form-control" type="${type}" data-project-field="${k}" value="${esc(value || "")}" ${disabled}></label>`;
          }).join("")}</div>`;
        }
        function openProjectDrawer(mode, p = {}) {
          drawerMode = mode;
          drawerProjectId = p.id || null;
          const d = mode === "detail";
          window.openAppDrawer({
            title: d ? "项目详情" : mode === "edit" ? "编辑项目" : "新增项目",
            subtitle: "数据库管理 · 项目管理",
            body: formBody(p, d),
            footer: `<button class="btn btn-secondary" data-drawer-close>${d ? "关闭" : "取消"}</button>${d ? "" : `<button class="btn btn-primary" data-save-project data-mode="${mode}" data-project-id="${p.id || ""}">保存</button>`}`,
          });
          setTimeout(() => {
            document
              .querySelector("[data-save-project]")
              ?.addEventListener("click", () => {
                const o = {};
                document
                  .querySelectorAll("[data-project-field]")
                  .forEach((x) => (o[x.dataset.projectField] = x.value));
                if (!o.code || !o.name || !o.type) { const invalid = document.querySelector(`[data-project-field="${!o.code ? "code" : !o.name ? "name" : "type"}"]`); invalid?.classList.add("error"); return; }
                if (mode === "edit") Object.assign(byId(p.id), o);
                else
                  projects.push({
                    ...o,
                    id: Math.max(...projects.map((x) => x.id)) + 1,
                    cabinCount: 0,
                    corridorCount: 0,
                    sectionCount: 0,
                    pipelineCount: 0,
                    deviceCount: 0,
                    updatedAt: "2026-09-30 10:00",
                  });
                renderRows();
                closeAppDrawer();
              });
            document
              .querySelector("[data-map-location]")
              ?.addEventListener("click", () => {
                drawerDraft = Object.fromEntries([...document.querySelectorAll("[data-project-field]")].map(x => [x.dataset.projectField, x.value]));
                window.openAppDrawer({
                  title: "地图定位",
                  body: '<div class="map-canvas"><div class="map-pin"><i class="fa-solid fa-location-dot"></i></div></div>',
                  footer:
                    '<button class="btn btn-primary" id="mapOk">确认选点</button>',
                });
              });
            document.getElementById("mapOk")?.addEventListener("click", () => {
              drawerDraft = { ...(drawerDraft || {}), longitude: "114.447", latitude: "30.489" };
              closeAppDrawer();
              openProjectDrawer(drawerMode, { ...(drawerMode === "edit" ? byId(drawerProjectId) : {}), ...drawerDraft, id: drawerProjectId });
            });
          }, 0);
        }
        renderRows();
        document.addEventListener("change", (e) => {
          if (e.target.matches("[data-select-id]")) {
            const id = +e.target.dataset.selectId;
            if (e.target.checked) selectedIds.add(id);
            else selectedIds.delete(id);
            syncSelection();
          }
          if (e.target.matches("[data-select-all]")) {
            const checked = e.target.checked;
            document.querySelectorAll("[data-select-id]").forEach((b) => {
              const id = +b.dataset.selectId;
              if (checked) selectedIds.add(id);
              else selectedIds.delete(id);
            });
            renderRows();
          }
        });
        document.addEventListener("click", (e) => {
          const a = e.target.closest("[data-action]")?.dataset.action;
          if (a === "search" || a === "reset") {
            if (a === "reset")
              document
                .querySelectorAll("[data-filter]")
                .forEach((x) => (x.value = ""));
            renderRows();
          }
          if (a === "refresh") renderRows();
          if (a === "collapse") {
            const card = document.querySelector(".project-filter-card");
            const expanded = card.classList.toggle("expanded");
            const btn = e.target.closest("[data-action=collapse]");
            const label = btn.querySelector("span");
            const icon = btn.querySelector("i");
            if (label) label.textContent = expanded ? "收起" : "展开";
            if (icon) icon.className = expanded ? "fa-solid fa-chevron-up" : "fa-solid fa-chevron-down";
          }
          if (a === "create") openProjectDrawer("create");
          if (a === "export") exportProjects();
          if (a === "delete-selected" && selectedIds.size > 0) {
            const list = [...selectedIds].map(byId).filter(Boolean);
            const blocked = list.filter((p) => p.corridorCount || p.cabinCount || p.sectionCount || p.pipelineCount || p.deviceCount);
            if (blocked.length)
              window.openAppConfirm({ title: "无法删除项目", message: `所选项目中「${blocked.map((p) => p.name).join("」、「")}」下关联了管廊/舱室/区段/管线/设备，将无法删除，请解除关联后删除。`, confirmText: "知道了" });
            else
              window.openAppConfirm({ title: "删除项目", message: `确认删除选中的 ${list.length} 个项目吗？删除后将无法恢复。`, confirmText: "确认删除", onConfirm: () => { list.forEach((p) => { const index = projects.indexOf(p); if (index >= 0) projects.splice(index, 1); selectedIds.delete(p.id); }); renderRows(); } });
          }
          const r = e.target.closest("[data-project-action]");
          if (r) {
            const p = byId(r.dataset.projectId),
              x = r.dataset.projectAction;
            if (x === "corridors") { window.location.href = `building.html?project=${encodeURIComponent(p.corridorProject || p.name)}`; return; }
            if (x === "detail" || x === "edit") openProjectDrawer(x, p);
            if (x === "delete")
              p.corridorCount || p.cabinCount || p.sectionCount || p.pipelineCount || p.deviceCount
                ? window.openAppConfirm({ title: "无法删除项目", message: "当前项目下关联了管廊/舱室/区段/管线/设备，将无法删除，请解除关联后删除。", confirmText: "知道了" })
                : window.openAppConfirm({ title: "删除项目", message: `确认删除项目「${p.name}」吗？删除后将无法恢复。`, confirmText: "确认删除", onConfirm: () => { const index = projects.indexOf(p); if (index >= 0) projects.splice(index, 1); selectedIds.delete(p.id); renderRows(); } });
          }
        });
      })();
    </script>
  </body>
</html>
