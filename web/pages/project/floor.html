<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>舱室管理 - 科学岛管廊监控中心</title><script src="https://cdn.tailwindcss.com"></script><script src="../../assets/vendor/xlsx.full.min.js"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="../../assets/css/tob-ui.css"><link rel="stylesheet" href="../../assets/css/floor-management.css?v=4"></head><body class="floor-page" data-menu-key="project.floor" data-page-section="项目管理" data-page-title="舱室管理"><div class="app-shell"><aside id="app-sidebar" class="sidebar"></aside><header id="app-header" class="header"></header><main class="main"><div class="screen-frame stack"><section class="card filters floor-filters"><div class="filter-actions"><label class="form-field"><span class="form-label">关键词</span><input class="form-control" data-filter="keyword" placeholder="搜索舱室编码或名称"></label><label class="form-field"><span class="form-label">分类</span><select class="form-control" data-filter="type"><option value="">请选择</option><option>电力舱</option><option>水信舱</option><option>燃气舱</option><option>热力舱</option><option>综合舱</option><option>通风设备间</option><option>变电所</option><option>投料口或设备间</option></select></label><label class="form-field"><span class="form-label">舱室状态</span><select class="form-control" data-filter="status"><option value="">请选择</option><option>建设中</option><option>待完善</option><option>已完工</option><option>停用</option></select></label><label class="form-field"><span class="form-label">所属项目</span><select class="form-control" data-filter="project"><option value="">请选择</option><option>光谷科学岛综合开发项目</option><option>科学岛东区管廊延伸工程</option></select></label><label class="form-field"><span class="form-label">所属管廊</span><select class="form-control" data-filter="corridor" disabled><option value="">请选择</option></select></label><button class="btn btn-secondary" data-action="reset">重置</button><button class="btn btn-primary" data-action="search">搜索</button></div></section><section class="card floor-list-card"><div class="card-title-row floor-toolbar"><h2 class="card-title">舱室档案</h2><div class="btn-row"><button class="btn btn-secondary" data-action="import"><i class="fa-solid fa-file-arrow-up"></i> 导入</button><button class="btn btn-secondary" data-action="export"><i class="fa-solid fa-file-arrow-down"></i> 导出</button><button class="btn btn-danger-outline" data-action="delete-selected" disabled><i class="fa-solid fa-trash"></i> 删除</button><button class="btn btn-primary" data-action="create"><i class="fa-solid fa-plus"></i> 新增舱室</button></div></div><div class="table-wrap"><table class="table floor-table table-actions-sticky"><thead><tr><th class="check-cell"><input type="checkbox" data-select-all></th><th>舱室编码</th><th>舱室名称</th><th>所属管廊</th><th>舱室类型</th><th>起止里程</th><th>长度（m）</th><th>净高（m）</th><th>净宽（m）</th><th>设计容量</th><th>防火等级</th><th>防水等级</th><th>结构形式</th><th>管线数量</th><th>设备数量</th><th>投运日期</th><th>舱室状态</th><th>操作</th></tr></thead><tbody id="cabinTableBody"></tbody></table></div><div class="pagination"><span>共 <strong id="cabinCount">0</strong> 条记录，每页 10 条</span><span class="page-item disabled">‹</span><span class="page-item active">1</span><span class="page-item disabled">›</span></div></section></div></main></div><script src="../../../app/config/menu.js?v=nav-hide-1"></script><script src="../../../app/components/sidebar.js?v=nav-home-1"></script><script src="../../../app/components/header.js?v=nav-home-1"></script><script src="../../../app/components/drawer.js"></script><script src="../../../app/components/requirement.js"></script><script>
const corridorProjects={'光谷科学岛综合开发项目':['高新大道综合管廊','科学岛大道综合管廊'],'科学岛东区管廊延伸工程':['科学岛东区综合管廊']};
const cabins=[{id:1,project:'光谷科学岛综合开发项目',code:'CB-001',name:'综合舱',corridor:'高新大道综合管廊',type:'综合舱',mile:'K0+000',length:'2400',height:'4.2',width:'6.8',capacity:'通信 144 芯 / 给水 DN600',fire:'一级',waterproof:'一级',structure:'现浇钢筋混凝土',pipeline:3,device:38,date:'2024-06-30',status:'已完工',note:'通信与给水管线综合舱室',relations:{sections:2,pipelines:3,devices:38}},{id:2,project:'光谷科学岛综合开发项目',code:'CB-002',name:'电力舱',corridor:'科学岛大道综合管廊',type:'电力舱',mile:'K0+000',length:'1680',height:'4.0',width:'5.2',capacity:'10kV 电缆 12 回',fire:'一级',waterproof:'一级',structure:'预制装配式',pipeline:2,device:20,date:'2025-03-18',status:'待完善',note:'电力电缆专用舱室',relations:{sections:2,pipelines:2,devices:20}},{id:3,project:'光谷科学岛综合开发项目',code:'CB-003',name:'燃气舱',corridor:'科学岛大道综合管廊',type:'燃气舱',mile:'K0+000',length:'1680',height:'3.8',width:'4.6',capacity:'燃气 DN300 4 回',fire:'一级',waterproof:'一级',structure:'预制装配式',pipeline:2,device:18,date:'2025-03-18',status:'停用',note:'独立防火分区',relations:{sections:2,pipelines:2,devices:18}},{id:4,project:'科学岛东区管廊延伸工程',code:'CB-004',name:'综合舱',corridor:'科学岛东区综合管廊',type:'综合舱',mile:'K0+000',length:'1200',height:'4.2',width:'6.8',capacity:'综合管线 18 回',fire:'一级',waterproof:'一级',structure:'现浇钢筋混凝土',pipeline:2,device:30,date:'2025-09-01',status:'已完工',note:'科学岛东区综合舱室',relations:{sections:2,pipelines:2,devices:30}},{id:5,project:'光谷科学岛综合开发项目',code:'CB-005',name:'电力舱',corridor:'高新大道综合管廊',type:'电力舱',mile:'K0+000',length:'2400',height:'4.0',width:'5.2',capacity:'10kV 电缆 12 回',fire:'一级',waterproof:'一级',structure:'现浇钢筋混凝土',pipeline:2,device:42,date:'2024-06-30',status:'已完工',note:'电力电缆专用舱室',relations:{sections:2,pipelines:2,devices:42}},{id:6,project:'光谷科学岛综合开发项目',code:'CB-006',name:'燃气舱',corridor:'高新大道综合管廊',type:'燃气舱',mile:'K0+000',length:'2400',height:'3.8',width:'4.6',capacity:'燃气 DN300 4 回',fire:'一级',waterproof:'一级',structure:'现浇钢筋混凝土',pipeline:1,device:26,date:'2024-06-30',status:'停用',note:'独立防火分区',relations:{sections:2,pipelines:1,devices:26}}];
const headers=['所属项目','舱室编码','舱室名称','所属管廊','舱室类型','起止里程','长度（m）','净高（m）','净宽（m）','设计容量','防火等级','防水等级','结构形式','管线数量','设备数量','投运日期','舱室状态','备注'];const keys=['project','code','name','corridor','type','mile','length','height','width','capacity','fire','waterproof','structure','pipeline','device','date','status','note'];const body=document.getElementById('cabinTableBody'),count=document.getElementById('cabinCount'),esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c])),statusClass=s=>s==='已完工'?'success':s==='停用'?'warning':s==='建设中'?'info':'primary';
let currentRows=[...cabins];function updateSelection(){const boxes=[...body.querySelectorAll('[data-cabin-check]')];document.querySelector('[data-action="delete-selected"]').disabled=!boxes.some(x=>x.checked);document.querySelector('[data-select-all]').checked=boxes.length>0&&boxes.every(x=>x.checked);}function renderRows(list){if(list)currentRows=list;body.innerHTML=currentRows.map(i=>`<tr data-id="${i.id}"><td class="check-cell"><input type="checkbox" data-cabin-check></td><td>${i.code}</td><td>${esc(i.name)}</td><td>${esc(i.corridor)}</td><td>${i.type}</td><td>${i.mile}</td><td>${i.length}</td><td>${i.height}</td><td>${i.width}</td><td class="capacity-cell" title="${esc(i.capacity)}">${esc(i.capacity)}</td><td>${i.fire}</td><td>${i.waterproof}</td><td>${i.structure}</td><td>${i.pipeline}</td><td>${i.device}</td><td>${i.date}</td><td><span class="tag ${statusClass(i.status)}">${i.status}</span></td><td><button class="table-action" data-cabin-action="detail">详情</button><button class="table-action" data-cabin-action="edit">编辑</button><button class="table-action" data-cabin-action="segments">区段管理</button><button class="table-action status-danger" data-cabin-action="delete">删除</button></td></tr>`).join('');count.textContent=currentRows.length;updateSelection();}
function selectOptions(values,current){return values.map(v=>`<option ${v===current?'selected':''}>${v}</option>`).join('');}function field(k,label,i,create,required){let value=create?'':esc(i[k]||'');if(k==='project')return `<select class="form-control" data-cabin-project><option value="">请选择</option>${selectOptions(Object.keys(corridorProjects),i.project)}</select>`;if(k==='corridor')return `<select class="form-control" data-cabin-corridor><option value="">请选择</option>${selectOptions(corridorProjects[i.project]||[],i.corridor)}</select>`;if(k==='type')return `<select class="form-control"><option value="">请选择</option>${selectOptions(['电力舱','水信舱','燃气舱','热力舱','综合舱','通风设备间','变电所','投料口或设备间'],i.type)}</select>`;if(k==='status')return `<select class="form-control">${selectOptions(['建设中','待完善','已完工','停用'],create?'建设中':i.status)}</select>`;return `<input class="form-control" type="${k==='date'?'date':'text'}" value="${value}" placeholder="${k==='date'?'请选择日期':'请输入'}">`;}
const projectFilter=document.querySelector('[data-filter="project"]'),corridorFilter=document.querySelector('[data-filter="corridor"]');projectFilter.addEventListener('change',()=>{corridorFilter.innerHTML='<option value="">请选择</option>'+selectOptions(corridorProjects[projectFilter.value]||[],'');corridorFilter.disabled=!projectFilter.value;});
function applyFilters(){const k=document.querySelector('[data-filter="keyword"]').value.trim(),t=document.querySelector('[data-filter="type"]').value,s=document.querySelector('[data-filter="status"]').value,p=projectFilter.value,co=corridorFilter.value;renderRows(cabins.filter(i=>(!k||(i.code+i.name).includes(k))&&(!t||i.type===t)&&(!s||i.status===s)&&(!p||i.project===p)&&(!co||i.corridor===co)));}
const fieldDefs=[['project','所属项目',1],['corridor','所属管廊',1],['code','舱室编码',1],['name','舱室名称',1],['type','舱室类型',1],['status','舱室状态'],['mile','起止里程'],['length','长度（m）'],['height','净高（m）'],['width','净宽（m）'],['capacity','设计容量'],['fire','防火等级'],['waterproof','防水等级'],['structure','结构形式'],['pipeline','管线数量'],['device','设备数量'],['date','投运日期']];
function detailBody(i){return `<section class="detail-section"><h3 class="detail-title">舱室信息</h3><div class="detail-grid">${fieldDefs.map(([k,l])=>`<div class="info-item"><span class="info-label">${l}</span><span class="info-value">${k==='status'?`<span class="tag ${statusClass(i.status)}">${i.status}</span>`:esc(i[k]||'-')}</span></div>`).join('')}</div></section><section class="detail-section"><h3 class="detail-title">备注</h3><p class="detail-text">${esc(i.note||'-')}</p></section>`;}
function formBody(i={},mode){const create=mode==='create';const formFields=fieldDefs.filter(([k])=>k!=='pipeline'&&k!=='device');return `<div class="form-grid-2">${formFields.map(([k,l,r])=>`<label class="form-field form-item"><span class="form-label ${r?'form-required':''}">${l}</span>${field(k,l,i,create,r)}</label>`).join('')}</div><label class="form-field form-item"><span class="form-label">备注</span><textarea class="form-control textarea" maxlength="200" placeholder="请输入">${create?'':esc(i.note||'')}</textarea></label>`;}
function openDrawer(mode,i=cabins[0]){window.openAppDrawer({title:mode==='create'?'新增舱室':mode==='edit'?'编辑舱室':'舱室详情',subtitle:`项目管理 · 舱室管理${mode==='create'?'':` · ${i.name}`}`,body:mode==='detail'?detailBody(i):formBody(i,mode),footer:`<button class="btn btn-secondary" type="button" data-drawer-close>${mode==='detail'?'关闭':'取消'}</button>${mode==='detail'?'':'<button class="btn btn-primary" type="button" data-drawer-close>确认</button>'}`});setTimeout(()=>{const p=document.querySelector('[data-cabin-project]'),c=document.querySelector('[data-cabin-corridor]');if(p&&c){p.addEventListener('change',()=>{c.innerHTML='<option value="">请选择</option>'+selectOptions(corridorProjects[p.value]||[],'');});}},0);}
function downloadExcel(rows,name){const data=rows.map(i=>Object.fromEntries(keys.map((k,n)=>[headers[n],i[k]??''])));const ws=XLSX.utils.json_to_sheet(data,{header:headers});const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'舱室档案');XLSX.writeFile(wb,name);}
function importDrawer(){window.openAppDrawer({title:'导入舱室',subtitle:'项目管理 · 舱室管理',body:'<div class="upload-box"><i class="fa-solid fa-cloud-arrow-up"></i><p>点击或拖拽文件到此处上传</p><small>支持 xlsx、xls 格式</small><input type="file" accept=".xlsx,.xls" data-import-file hidden></div><p data-import-name>尚未选择文件</p>',footer:'<button class="btn btn-secondary" type="button" data-drawer-close>取消</button><button class="btn btn-secondary" type="button" data-download-template>下载模板</button><button class="btn btn-primary" type="button" data-drawer-close>确认导入</button>'});setTimeout(()=>document.querySelector('[data-import-file]')?.closest('.upload-box').addEventListener('click',()=>document.querySelector('[data-import-file]').click()),0);}
document.addEventListener('click',e=>{if(e.target.closest('[data-download-template]'))downloadExcel([Object.fromEntries(keys.map(k=>[k,'']))],'舱室导入模板.xlsx');});
document.addEventListener('change',e=>{if(e.target.matches('[data-import-file]'))document.querySelector('[data-import-name]').textContent=e.target.files[0]?.name||'尚未选择文件';if(e.target.matches('[data-select-all]')){body.querySelectorAll('[data-cabin-check]').forEach(x=>x.checked=e.target.checked);updateSelection();}if(e.target.matches('[data-cabin-check]'))updateSelection();});document.addEventListener('click',e=>{const a=e.target.closest('[data-action]')?.dataset.action;if(a==='create')openDrawer('create');if(a==='import')importDrawer();if(a==='export')downloadExcel(cabins,'舱室档案.xlsx');if(a==='reset'){document.querySelectorAll('[data-filter]').forEach(x=>x.value='');corridorFilter.innerHTML='<option value="">请选择</option>';corridorFilter.disabled=true;applyFilters();}if(a==='search')applyFilters();if(a==='delete-selected'){const selected=currentRows.filter(i=>body.querySelector('tr[data-id="'+i.id+'"] [data-cabin-check]')?.checked);if(!selected.length)return;const blocked=selected.filter(i=>{const r=i.relations||{};return r.sections||r.pipelines||r.devices;});if(blocked.length)window.openAppConfirm({title:'无法删除舱室',message:'当前舱室下关联了区段/管线/设备，将无法删除，请解除关联后删除',confirmText:'知道了'});else window.openAppConfirm({title:'批量删除',message:'确认删除已选中的 '+selected.length+' 条舱室吗？',confirmText:'确认删除',onConfirm:()=>{selected.forEach(i=>{const idx=cabins.indexOf(i);if(idx>=0)cabins.splice(idx,1);});applyFilters();}});}const r=e.target.closest('[data-cabin-action]');if(!r)return;const i=cabins.find(x=>x.id==r.closest('tr').dataset.id);if(r.dataset.cabinAction==='segments'){location.href=`house.html?cabin=${encodeURIComponent(i.name)}&corridor=${encodeURIComponent(i.corridor)}`;}else if(r.dataset.cabinAction==='delete'){const rel=i.relations||{};if(rel.sections||rel.pipelines||rel.devices)window.openAppConfirm({title:'无法删除舱室',message:'当前舱室下关联了区段/管线/设备，将无法删除，请解除关联后删除',confirmText:'知道了'});else window.openAppConfirm({title:'提示',message:`确认删除舱室「${i.name}」吗？`,onConfirm:()=>{cabins.splice(cabins.indexOf(i),1);applyFilters();}});}else openDrawer(r.dataset.cabinAction,i);});const _q=new URLSearchParams(location.search);const _qp=_q.get('project'),_qb=_q.get('building');if(_qp){for(const o of projectFilter.options){if(o.value===_qp){projectFilter.value=_qp;projectFilter.dispatchEvent(new Event('change'));break;}}}if(_qb){for(const o of corridorFilter.options){if(o.value===_qb){corridorFilter.value=_qb;break;}}}applyFilters();
</script></body></html>
