<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>应急事件 - 科学岛管廊监控中心</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../../assets/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="../../assets/css/tob-ui.css">
  <link rel="stylesheet" href="../../assets/css/inspection.css">
  <link rel="stylesheet" href="../../assets/css/emergency.css">
</head>
<body class="emergency-page emergency-ledger-page" data-menu-key="emergency.events" data-page-section="应急管理系统" data-page-title="应急事件">
  <div class="app-shell">
    <aside id="app-sidebar" class="sidebar"></aside>
    <header id="app-header" class="header"></header>
    <main class="main">
      <div class="screen-frame stack">
        <section class="card filters emergency-ledger-filter">
          <div class="filter-actions">
            <label class="form-field"><span class="form-label">事件编号 / 标题</span><input class="form-control" data-event-filter="keyword" type="search" placeholder="请输入关键词"></label>
            <label class="form-field"><span class="form-label">事件类型</span><select class="form-control" data-event-filter="eventType"><option value="">全部类型</option></select></label>
            <label class="form-field"><span class="form-label">事件等级</span><select class="form-control" data-event-filter="level"><option value="">全部等级</option><option>P1</option><option>P2</option><option>P3</option><option>P4</option></select></label>
            <label class="form-field"><span class="form-label">事件状态</span><select class="form-control" data-event-filter="status"><option value="">全部状态</option><option>待指派</option><option>待处理</option><option>处理中</option><option>验收中</option><option>已完成</option><option>已关闭</option></select></label>
            <button class="btn btn-secondary" type="button" data-event-action="reset">重置</button>
            <button class="btn btn-primary" type="button" data-event-action="search">搜索</button>
          </div>
        </section>
        <section class="card">
          <div class="card-title-row emergency-ledger-toolbar">
            <h1 class="card-title">应急事件</h1>
            <div class="btn-row">
              <button class="btn btn-primary" type="button" data-event-action="create"><i class="fa-solid fa-plus"></i> 新增</button>
            </div>
          </div>
          <div class="table-wrap">
            <table class="table emergency-ledger-table" aria-label="应急事件列表">
              <thead>
                <tr>
                  <th>事件编号</th>
                  <th>事件标题</th>
                  <th>事件类型</th>
                  <th>等级</th>
                  <th>发生位置</th>
                  <th>来源</th>
                  <th>状态</th>
                  <th>当前处理人</th>
                  <th>更新时间</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="eventBody"></tbody>
            </table>
          </div>
          <div id="eventCount"></div>
        </section>
      </div>
    </main>
  </div>
  <script src="../../assets/vendor/leaflet/leaflet.js"></script>
  <script src="../../../app/config/menu.js?v=nav-hide-1"></script>
  <script src="../../../app/data/emergency-data.js"></script>
  <script src="../../../app/data/work-order-data.js"></script>
  <script src="../../../app/components/sidebar.js?v=nav-home-1"></script>
  <script src="../../../app/components/header.js?v=nav-home-1"></script>
  <script src="../../../app/components/drawer.js"></script>
  <script src="../../../app/components/requirement.js"></script>
  <script src="../../../app/components/emergency-common.js"></script>
  <script src="../../../app/components/emergency-point-picker.js"></script>
  <script src="../../../app/components/emergency-events.js"></script>
</body>
</html>
