<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>应急通讯录 - 科学岛管廊监控中心</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../../assets/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="../../assets/css/tob-ui.css">
  <link rel="stylesheet" href="../../assets/css/emergency.css">
</head>
<body class="emergency-page emergency-ledger-page" data-menu-key="emergency.personnel" data-page-section="应急管理系统" data-page-title="应急通讯录">
  <div class="app-shell">
    <aside id="app-sidebar" class="sidebar"></aside>
    <header id="app-header" class="header"></header>
    <main class="main">
      <div class="screen-frame stack">
        <section class="card filters emergency-ledger-filter">
          <div class="filter-actions">
            <label class="form-field"><span class="form-label">姓名 / 手机号</span><input class="form-control" id="personnelKeyword" type="search" placeholder="请输入姓名或手机号"></label>
            <label class="form-field"><span class="form-label">所属部门</span><select class="form-control" id="personnelUnit"><option value="">全部部门</option></select></label>
            <label class="form-field"><span class="form-label">人员分类</span><select class="form-control" id="personnelType"><option value="">全部分类</option></select></label>
            <label class="form-field"><span class="form-label">当前状态</span><select class="form-control" id="personnelStatus"><option value="">全部状态</option><option>在线</option><option>离线</option><option>忙碌</option><option>休假</option></select></label>
            <label class="form-field"><span class="form-label">可调度状态</span><select class="form-control" id="personnelDispatch"><option value="">全部状态</option><option>可调度</option><option>已调度</option><option>不可调度</option></select></label>
            <button class="btn btn-secondary" type="button" data-person-action="reset">重置</button>
            <button class="btn btn-primary" type="button" data-person-action="filter">搜索</button>
          </div>
        </section>
        <section class="card">
          <div class="card-title-row emergency-ledger-toolbar">
            <h1 class="card-title">应急通讯录</h1>
            <div class="btn-row">
              <button class="btn btn-secondary" type="button" data-person-action="export"><i class="fa-solid fa-file-export"></i> 导出</button>
              <button class="btn btn-secondary" type="button" data-person-action="categories"><i class="fa-solid fa-tags"></i> 人员分类</button>
              <button class="btn btn-primary" type="button" data-person-action="create"><i class="fa-solid fa-plus"></i> 新增人员</button>
            </div>
          </div>
          <div class="table-wrap">
            <table class="table emergency-ledger-table" aria-label="应急通讯录列表">
              <thead>
                <tr>
                  <th>姓名</th>
                  <th>所属部门</th>
                  <th>人员分类</th>
                  <th>联系方式</th>
                  <th>当前状态</th>
                  <th>所在位置</th>
                  <th>可调度状态</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="personnelBody"></tbody>
            </table>
          </div>
          <div id="personnelCount"></div>
        </section>
      </div>
    </main>
  </div>
  <script src="../../../app/config/menu.js?v=nav-hide-1"></script>
  <script src="../../../app/data/emergency-data.js"></script>
  <script src="../../assets/vendor/leaflet/leaflet.js"></script>
  <script src="../../assets/vendor/xlsx.full.min.js"></script>
  <script src="../../../app/components/sidebar.js?v=nav-home-1"></script>
  <script src="../../../app/components/header.js?v=nav-home-1"></script>
  <script src="../../../app/components/drawer.js"></script>
  <script src="../../../app/components/emergency-common.js"></script>
  <script src="../../../app/components/emergency-point-picker.js"></script>
  <script src="../../../app/components/emergency-personnel.js"></script>
  <script src="../../../app/components/requirement.js"></script>
</body>
</html>
