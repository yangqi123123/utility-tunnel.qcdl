<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>应急物资 - 科学岛管廊监控中心</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../../assets/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="../../assets/css/tob-ui.css">
  <link rel="stylesheet" href="../../assets/css/emergency.css">
</head>
<body class="emergency-page emergency-ledger-page" data-menu-key="emergency.resources" data-page-section="应急管理系统" data-page-title="应急物资">
  <div class="app-shell">
    <aside id="app-sidebar" class="sidebar"></aside>
    <header id="app-header" class="header"></header>
    <main class="main">
      <div class="screen-frame stack">
        <section class="card filters emergency-ledger-filter">
          <div class="filter-actions">
            <label class="form-field"><span class="form-label">物资名称</span><input class="form-control" id="resourceKeyword" type="search" placeholder="请输入物资名称"></label>
            <label class="form-field"><span class="form-label">物资分类</span><select class="form-control" id="resourceCategory"><option value="">全部分类</option></select></label>
            <label class="form-field"><span class="form-label">所在仓库</span><select class="form-control" id="resourceWarehouse"><option value="">全部仓库</option></select></label>
            <label class="form-field"><span class="form-label">状态</span><select class="form-control" id="resourceStatus"><option value="">全部状态</option><option>可用</option><option>已占用</option><option>维修中</option><option>报废</option></select></label>
            <label class="form-field"><span class="form-label">库存提醒</span><select class="form-control" id="resourceAlert"><option value="">全部</option><option value="low">低库存</option><option value="expiring">临期</option></select></label>
            <button class="btn btn-secondary" type="button" data-resource-action="reset">重置</button>
            <button class="btn btn-primary" type="button" data-resource-action="filter">搜索</button>
          </div>
        </section>
        <section class="card">
          <div class="card-title-row emergency-ledger-toolbar">
            <h1 class="card-title">应急物资</h1>
            <div class="btn-row">
              <button class="btn btn-secondary" type="button" data-resource-action="export"><i class="fa-solid fa-file-export"></i> 导出</button>
              <button class="btn btn-secondary" type="button" data-resource-action="categories"><i class="fa-solid fa-tags"></i> 物资分类</button>
              <button class="btn btn-primary" type="button" data-resource-action="create"><i class="fa-solid fa-plus"></i> 新增物资</button>
            </div>
          </div>
          <div class="table-wrap">
            <table class="table emergency-ledger-table" aria-label="应急物资列表">
              <thead>
                <tr>
                  <th>物资名称</th>
                  <th>分类</th>
                  <th>规格</th>
                  <th>可用数量</th>
                  <th>所在位置</th>
                  <th>负责人</th>
                  <th>状态</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="resourceBody"></tbody>
            </table>
          </div>
          <div id="resourceCount"></div>
        </section>
      </div>
    </main>
  </div>
  <script src="../../../app/config/menu.js?v=nav-hide-1"></script>
  <script src="../../../app/data/emergency-data.js"></script>
  <script src="../../assets/vendor/leaflet/leaflet.js"></script>
  <script src="../../assets/vendor/xlsx.full.min.js"></script>
  <script src="../../../app/components/sidebar.js?v=nav-home-1"></script>
  <script src="../../../app/components/header.js?v=nav-home-1"></script>
  <script src="../../../app/components/drawer.js"></script>
  <script src="../../../app/components/emergency-common.js"></script>
  <script src="../../../app/components/emergency-point-picker.js"></script>
  <script src="../../../app/components/emergency-resources.js"></script>
  <script src="../../../app/components/requirement.js"></script>
</body>
</html>
