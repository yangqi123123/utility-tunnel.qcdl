<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>应急预案库 - 科学岛管廊监控中心</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/tob-ui.css">
  <link rel="stylesheet" href="../../assets/css/emergency.css">
</head>
<body class="emergency-page emergency-ledger-page" data-menu-key="safety.plans" data-page-section="安全管理" data-page-title="应急预案库">
  <div class="app-shell">
    <aside id="app-sidebar" class="sidebar"></aside>
    <header id="app-header" class="header"></header>
    <main class="main">
      <div class="screen-frame stack">
        <section class="card filters emergency-ledger-filter">
          <div class="filter-actions">
            <label class="form-field"><span class="form-label">预案编号 / 名称</span><input class="form-control" data-plan-filter="keyword" type="search" placeholder="请输入关键词"></label>
            <label class="form-field"><span class="form-label">预案类型</span><select class="form-control" data-plan-filter="eventType"><option value="">全部类型</option></select></label>
            <label class="form-field"><span class="form-label">响应等级</span><select class="form-control" data-plan-filter="level"><option value="">全部等级</option><option>P1</option><option>P2</option><option>P3</option><option>P4</option></select></label>
            <label class="form-field"><span class="form-label">启用状态</span><select class="form-control" data-plan-filter="enabled"><option value="">全部状态</option><option>启用</option><option>停用</option></select></label>
            <button class="btn btn-secondary" type="button" data-plan-action="reset">重置</button>
            <button class="btn btn-primary" type="button" data-plan-action="search">搜索</button>
          </div>
        </section>
        <section class="card">
          <div class="card-title-row emergency-ledger-toolbar">
            <h1 class="card-title">应急预案库</h1>
            <div class="btn-row">
              <button class="btn btn-secondary" type="button" data-plan-action="export"><i class="fa-solid fa-file-export"></i> 导出</button>
              <button class="btn btn-primary" type="button" data-plan-action="create"><i class="fa-solid fa-plus"></i> 新增预案</button>
            </div>
          </div>
          <div class="table-wrap">
            <table class="table emergency-ledger-table" aria-label="应急预案列表">
              <thead>
                <tr>
                  <th>预案编号</th>
                  <th>预案名称</th>
                  <th>预案类型</th>
                  <th>响应等级</th>
                  <th>适用区域</th>
                  <th>步骤数</th>
                  <th>版本</th>
                  <th>责任部门</th>
                  <th>负责人</th>
                  <th>启用状态</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="planBody"></tbody>
            </table>
          </div>
          <div id="planCount"></div>
        </section>
      </div>
    </main>
  </div>
  <script src="../../../app/config/menu.js?v=nav-hide-1"></script>
  <script src="../../../app/data/emergency-data.js"></script>
  <script src="../../assets/vendor/xlsx.full.min.js"></script>
  <script src="../../../app/components/sidebar.js?v=nav-home-1"></script>
  <script src="../../../app/components/header.js?v=nav-home-1"></script>
  <script src="../../../app/components/drawer.js"></script>
  <script src="../../../app/components/requirement.js"></script>
  <script src="../../../app/components/emergency-common.js"></script>
  <script src="../../../app/components/safety-plans.js"></script>
</body>
</html>
