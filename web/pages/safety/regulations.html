<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>法规制度库 - 科学岛管廊监控中心</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/tob-ui.css">
  <link rel="stylesheet" href="../../assets/css/emergency.css">
</head>
<body class="emergency-page emergency-ledger-page" data-menu-key="safety.regulations" data-page-section="安全管理" data-page-title="法规制度库">
  <div class="app-shell">
    <aside id="app-sidebar" class="sidebar"></aside>
    <header id="app-header" class="header"></header>
    <main class="main">
      <div class="screen-frame stack">
        <section class="card filters emergency-ledger-filter">
          <div class="filter-actions">
            <label class="form-field"><span class="form-label">关键词</span><input class="form-control" data-filter="keyword" type="search" placeholder="法规编号或名称"></label>
            <label class="form-field"><span class="form-label">法规层级</span><select class="form-control" data-filter="level"><option value="">全部层级</option><option>国家</option><option>地方</option><option>公司</option></select></label>
            <label class="form-field"><span class="form-label">法规分类</span><select class="form-control" data-filter="category" id="filterCategory"><option value="">全部分类</option></select></label>
            <label class="form-field"><span class="form-label">有效状态</span><select class="form-control" data-filter="status"><option value="">全部状态</option><option>有效</option><option>已失效</option></select></label>
            <button class="btn btn-secondary" type="button" data-action="reset">重置</button>
            <button class="btn btn-primary" type="button" data-action="search">搜索</button>
          </div>
        </section>
        <section class="card">
          <div class="card-title-row emergency-ledger-toolbar">
            <h1 class="card-title">法规制度库</h1>
            <div class="btn-row">
              <button class="btn btn-secondary" type="button" data-action="export"><i class="fa-solid fa-download"></i> 导出</button>
              <button class="btn btn-primary" type="button" data-action="create"><i class="fa-solid fa-plus"></i> 新增法规</button>
            </div>
          </div>
          <div class="table-wrap">
            <table class="table emergency-ledger-table" aria-label="法规清单">
              <thead>
                <tr>
                  <th>法规编号</th>
                  <th>法规名称</th>
                  <th>法规层级</th>
                  <th>发布部门</th>
                  <th>发布日期</th>
                  <th>生效日期</th>
                  <th>失效日期</th>
                  <th>法规分类</th>
                  <th>适用范围</th>
                  <th>有效状态</th>
                  <th>最近更新</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="body"></tbody>
            </table>
          </div>
          <div class="pagination"><span>共 <strong id="count">0</strong> 条，每页 10 条</span><span class="page-item disabled">‹</span><span class="page-item active">1</span><span class="page-item disabled">›</span></div>
        </section>
      </div>
    </main>
  </div>
  <script src="../../../app/config/menu.js?v=nav-hide-1"></script>
  <script src="../../../app/config/dictionary.js?v=reg-2"></script>
  <script src="../../../app/components/sidebar.js?v=nav-home-1"></script>
  <script src="../../../app/components/header.js?v=nav-home-1"></script>
  <script src="../../../app/components/drawer.js"></script>
  <script src="../../../app/components/requirement.js"></script>
  <script src="../../../app/components/emergency-common.js"></script>
  <script src="../../../app/components/safety-regulations.js?v=reg-upload-fmt-1"></script>
</body>
</html>
