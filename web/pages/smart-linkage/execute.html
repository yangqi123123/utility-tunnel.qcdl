<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>联动执行台 - 联动管理系统 - 科学岛管廊监控中心</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/tob-ui.css">
  <link rel="stylesheet" href="../../assets/css/smart-linkage.css">
</head>
<body class="sl-page" data-menu-key="linkage.execute" data-page-section="联动管理系统" data-page-title="联动执行台">
  <div class="app-shell">
    <aside id="app-sidebar" class="sidebar"></aside>
    <header id="app-header" class="header"></header>
    <main class="main">
      <div class="screen-frame stack">
        <section class="card sl-setup-card">
          <div class="sl-setup-head">
            <h1>联动执行台</h1>
            <div class="sl-setup-actions">
              <a class="btn btn-secondary" href="../linkage/smart.html">返回智能联动</a>
            </div>
          </div>
          <div class="sl-setup">
            <label class="form-field"><span class="form-label">联动规则</span>
              <select class="form-control" id="ruleSelect"></select></label>
            <label class="form-field"><span class="form-label">适用空间</span>
              <input class="form-control" id="spaceInput" readonly placeholder="由规则适用区域带入"></label>
            <label class="form-field"><span class="form-label">执行模式</span>
              <select class="form-control" id="modeSelect">
                <option value="step">逐步确认</option>
                <option value="auto">一键自动</option>
              </select></label>
            <button class="btn btn-primary" type="button" id="btnLoadPlan">载入联动</button>
          </div>
          <div class="sl-rule-context" id="ruleContext">
            <div class="sl-rule-context-empty">请选择一条智能联动规则后载入。</div>
          </div>
        </section>
        <div class="sl-exec">
          <aside class="sl-panel">
            <h2>联动步骤</h2>
            <div id="planStepList"><div class="sl-empty">请先选择智能联动规则，点击「载入联动」</div></div>
            <div class="sl-toolbar" id="stepToolbar">
              <button class="btn btn-primary" type="button" id="btnStart" disabled>开始执行</button>
              <button class="btn btn-secondary" type="button" id="btnNext" disabled>确认并执行下一步</button>
              <button class="btn btn-secondary" type="button" id="btnSkip" disabled>跳过</button>
            </div>
          </aside>
          <section class="sl-panel sl-panel-situation">
            <h2>执行态势</h2>
            <div class="sl-situation">
              <div class="sl-situation-summary" id="runSummaryWrap">
                <div class="sl-situation-summary-top">
                  <span class="sl-situation-status" id="runStatusBadge">待载入</span>
                  <span class="sl-situation-progress-text" id="runProgressText">0 / 0</span>
                </div>
                <p class="sl-situation-summary-text" id="runSummary">从智能联动选择规则并载入后，可在此观察联动下发态势。</p>
                <div class="sl-situation-progress"><i id="runProgressBar"></i></div>
                <div class="sl-situation-metrics" id="runMetrics">
                  <div class="sl-metric is-success"><i class="fa-solid fa-circle-check"></i><span>成功</span><strong id="metricSuccess">0</strong></div>
                  <div class="sl-metric is-running"><i class="fa-solid fa-spinner"></i><span>进行中</span><strong id="metricRunning">0</strong></div>
                  <div class="sl-metric is-skipped"><i class="fa-solid fa-forward"></i><span>跳过</span><strong id="metricSkipped">0</strong></div>
                  <div class="sl-metric is-pending"><i class="fa-regular fa-clock"></i><span>待执行</span><strong id="metricPending">0</strong></div>
                </div>
              </div>
              <div class="sl-log-head"><span>实时日志</span><span id="runLogCount">0 条</span></div>
              <div id="runLog" class="sl-log-stream"><div class="sl-log-empty">暂无执行日志</div></div>
            </div>
          </section>
          <aside class="sl-panel">
            <div class="sl-video-panel-head">
              <h2>附近视频</h2>
            </div>
            <div class="sl-video-grid" id="nearbyVideo"></div>
          </aside>
        </div>
      </div>
    </main>
  </div>
  <script src="../../../app/config/menu.js?v=nav-hide-1"></script>
  <script src="../../../app/components/sidebar.js?v=nav-home-1"></script>
  <script src="../../../app/components/header.js?v=nav-home-1"></script>
  <script src="../../../app/components/drawer.js"></script>
  <script src="../../../app/components/requirement.js"></script>
  <script src="../../../app/data/smart-linkage-data.js"></script>
  <script>
(function () {
  "use strict";
  var DATA = window.SMART_LINKAGE_DATA || {};
  try {
    var savedRules = JSON.parse(sessionStorage.getItem("SMART_LINKAGE_RULES") || "null");
    if (Array.isArray(savedRules) && savedRules.length) DATA.linkageRules = savedRules;
  } catch (_) {}

  var VIDEO_FEEDS = [
    { name: "综合舱 F0102", status: "在线" },
    { name: "电力舱 F0103", status: "在线" },
    { name: "水信舱 F0301", status: "在线" },
    { name: "出入口 K1+280", status: "在线" },
  ];
  var VIDEO_IMG = "../../assets/images/corridor-monitor.jpg";
  var FALLBACK_IMG = "../../assets/images/access-gate.jpg";

  var SITUATION_EXTRA = [
    { system: "消防监控系统", device: "本区防火阀", action: "关闭", execTime: "30 秒" },
    { system: "环境与设备监控", device: "排烟风机", action: "启动", execTime: "持续至触发条件解除" },
    { system: "电力监测系统", device: "非消防电源断路器", action: "切断非消防电源", execTime: "30 秒" },
    { system: "消防监控系统", device: "应急照明与疏散指示", action: "应急改向", execTime: "持续至触发条件解除" },
    { system: "视频监控系统", device: "附近枪机", action: "调取预置位", execTime: "5 分钟" },
  ];

  var runId = "";
  var runSteps = [];
  var cursor = -1;
  var started = false;
  var mode = "step";
  var spaceLabel = "";
  var ruleName = "";
  var activeRule = null;
  var runStartedAt = "";
  var countdownTimer = null;
  var countdownLeft = 0;
  var countdownTotal = 0;
  var stepAwaitingNext = false;
  var clockTimer = null;

  var el = function (id) { return document.getElementById(id); };

  function nowText() {
    return new Date().toISOString().slice(0, 19).replace("T", " ");
  }
  function clockText() {
    var d = new Date();
    var p = function (n) { return String(n).padStart(2, "0"); };
    return p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
  }

  function persistCommands() {
    try { sessionStorage.setItem("SMART_LINKAGE_COMMANDS", JSON.stringify(DATA.commands || [])); } catch (_) {}
  }
  function persistRuns(run) {
    try {
      var runs = JSON.parse(sessionStorage.getItem("SMART_LINKAGE_RUNS") || "[]");
      if (!Array.isArray(runs)) runs = [];
      runs.unshift(run);
      sessionStorage.setItem("SMART_LINKAGE_RUNS", JSON.stringify(runs.slice(0, 50)));
    } catch (_) {}
  }
  function persistOpLogs(rows) {
    try {
      var list = JSON.parse(sessionStorage.getItem("SMART_LINKAGE_OP_LOGS") || "[]");
      if (!Array.isArray(list)) list = [];
      list = rows.concat(list).slice(0, 200);
      sessionStorage.setItem("SMART_LINKAGE_OP_LOGS", JSON.stringify(list));
    } catch (_) {}
  }

  function demoSeconds(execTime) {
    var text = String(execTime || "");
    if (/持续/.test(text)) return 5;
    var m = text.match(/^(\d+)\s*(秒|分钟|min)/i);
    if (!m) return 4;
    var n = Number(m[1]) || 4;
    if (/分钟|min/i.test(m[2])) return Math.min(8, Math.max(4, Math.round(n * 1.2)));
    return Math.min(8, Math.max(3, Math.round(n / 6) || 4));
  }

  function confirmLevelFor(action) {
    var text = String(action || "");
    if (/切断|联动启动|强制|锁定/.test(text)) return "dual";
    if (/启动|开启|关闭|分闸/.test(text)) return "danger";
    return "normal";
  }

  function isVideoAction(action) {
    return /视频|调取|录像|预置位/i.test(String(action || ""));
  }

  function ruleResults(rule) {
    if (!rule) return [];
    var list = Array.isArray(rule.results) && rule.results.length
      ? rule.results.slice()
      : (rule.system && rule.device
        ? [{ system: rule.system, device: String(rule.device).split(" / ")[0], action: rule.action || "启动", execTime: rule.execTime || "30 秒" }]
        : []);
    // 步骤偏少时补充态势步骤，便于演示多步倒计时
    if (list.length < 4) {
      SITUATION_EXTRA.forEach(function (extra) {
        var exists = list.some(function (r) {
          return r.device === extra.device || (r.action === extra.action && r.system === extra.system);
        });
        if (!exists) list.push(Object.assign({}, extra));
      });
    }
    return list;
  }

  function spaceFromRule(rule) {
    if (!rule) return "";
    return [rule.corridor, rule.cabin, rule.section].filter(Boolean).join(" / ")
      || (rule.area || "").split(" / ").slice(1, 4).join(" / ")
      || rule.area
      || "";
  }

  function pushCommand(step, status, message, execMode) {
    var at = nowText();
    var cmd = {
      id: "CMD-" + Date.now() + "-" + step.id,
      layer: "L3",
      system: step.system,
      targetType: "linkageResult",
      targetId: step.id,
      targetName: step.device || step.name,
      action: step.action,
      mode: execMode,
      operator: "值班员甲",
      requestedAt: at,
      status: status,
      message: message,
      planRunId: runId,
      ruleId: activeRule ? activeRule.id : "",
      ruleName: ruleName,
    };
    if (!DATA.commands) DATA.commands = [];
    DATA.commands.unshift(cmd);
    persistCommands();
    if (activeRule && activeRule.mode === "手动执行") {
      persistOpLogs([{
        id: "OP-" + cmd.id,
        name: ruleName || "-",
        code: activeRule.id || runId,
        type: "手动执行",
        system: step.system || "-",
        device: step.device || step.name || "-",
        action: step.action || "-",
        startTime: runStartedAt || at,
        endTime: at,
        operator: "值班员甲",
        operateTime: at,
        runId: runId,
        status: status,
      }]);
    }
    return cmd;
  }

  function tagLabel(kind) {
    if (kind === "success") return "成功";
    if (kind === "fail") return "失败";
    return "信息";
  }

  function updateSituationMetrics() {
    var success = 0, running = 0, skipped = 0, pending = 0;
    runSteps.forEach(function (s) {
      if (s.state === "success") success += 1;
      else if (s.state === "skipped") skipped += 1;
      else if (s.state === "countdown" || s.state === "ready" || s.state === "running" || s.state === "failed") running += 1;
      else pending += 1;
    });
    var total = runSteps.length;
    var done = success + skipped;
    if (el("metricSuccess")) el("metricSuccess").textContent = String(success);
    if (el("metricRunning")) el("metricRunning").textContent = String(running);
    if (el("metricSkipped")) el("metricSkipped").textContent = String(skipped);
    if (el("metricPending")) el("metricPending").textContent = String(pending);
    if (el("runProgressText")) el("runProgressText").textContent = done + " / " + total;
    if (el("runProgressBar")) el("runProgressBar").style.width = (total ? Math.round((done / total) * 100) : 0) + "%";
  }

  function setSituationStatus(text, phase) {
    var wrap = el("runSummaryWrap");
    var badge = el("runStatusBadge");
    if (badge) badge.textContent = text;
    if (!wrap) return;
    wrap.classList.toggle("is-live", phase === "live");
    wrap.classList.toggle("is-done", phase === "done");
  }

  function appendLog(text, kind) {
    var host = el("runLog");
    var empty = host.querySelector(".sl-log-empty");
    if (empty) empty.remove();
    var item = document.createElement("div");
    var type = kind || "info";
    var operator = "值班员甲";
    item.className = "sl-log-item is-" + type;
    item.innerHTML = '<div class="sl-log-meta">'
      + '<span class="sl-log-time">' + nowText() + "</span>"
      + '<span class="sl-log-tag">' + tagLabel(type) + "</span>"
      + '<span class="sl-log-operator"><i class="fa-regular fa-user"></i>操作人：' + operator + "</span>"
      + "</div>"
      + '<div class="sl-log-body">' + text + "</div>";
    host.prepend(item);
    if (el("runLogCount")) el("runLogCount").textContent = host.querySelectorAll(".sl-log-item").length + " 条";
    updateSituationMetrics();
  }

  function fillRules(preferredId) {
    var rules = (DATA.linkageRules || []).slice();
    var manual = rules.filter(function (r) { return r.mode === "手动执行" && r.status !== "停用"; });
    var others = rules.filter(function (r) { return !(r.mode === "手动执行" && r.status !== "停用"); });
    var ordered = manual.concat(others);
    el("ruleSelect").innerHTML = ordered.map(function (r) {
      var tag = r.mode === "手动执行" ? "手动" : "自动";
      var status = r.status === "停用" ? "·停用" : "";
      return '<option value="' + r.id + '">[' + tag + status + "] " + r.name + "</option>";
    }).join("") || '<option value="">暂无智能联动规则</option>';
    if (preferredId && el("ruleSelect").querySelector('option[value="' + preferredId + '"]')) {
      el("ruleSelect").value = preferredId;
    } else if (manual[0]) {
      el("ruleSelect").value = manual[0].id;
    }
  }

  function currentRule() {
    var id = el("ruleSelect").value;
    return (DATA.linkageRules || []).find(function (r) { return String(r.id) === String(id); }) || null;
  }

  function renderRuleContext(rule) {
    var box = el("ruleContext");
    if (!rule) {
      box.innerHTML = '<div class="sl-rule-context-empty">请选择一条智能联动规则后载入。</div>';
      el("spaceInput").value = "";
      return;
    }
    el("spaceInput").value = spaceFromRule(rule) || rule.area || "";
    var results = ruleResults(rule);
    box.innerHTML = ""
      + '<div class="sl-rule-kv"><span>规则名称</span><strong>' + (rule.name || "-") + "</strong></div>"
      + '<div class="sl-rule-kv"><span>场景类型</span><strong>' + (rule.scene || "-") + "</strong></div>"
      + '<div class="sl-rule-kv"><span>执行模式</span><strong>' + (rule.mode || "-") + "</strong></div>"
      + '<div class="sl-rule-kv"><span>启用状态</span><strong>' + (rule.status || "-") + "</strong></div>"
      + '<div class="sl-rule-kv sl-rule-kv-wide"><span>触发条件</span><strong>' + (rule.trigger || "-") + "</strong></div>"
      + '<div class="sl-rule-kv sl-rule-kv-wide"><span>适用区域</span><strong>' + (rule.area || "-") + "</strong></div>"
      + '<div class="sl-rule-kv sl-rule-kv-wide"><span>联动结果</span><strong>' + (results.map(function (r) {
        return r.system + " / " + r.device + " / " + r.action + " / " + (r.execTime || "-");
      }).join("；") || "-") + "</strong></div>";
  }

  function renderSteps() {
    var stateMap = {
      pending: "待执行",
      running: "执行中",
      countdown: "倒计时中",
      ready: "可确认下一步",
      success: "成功",
      failed: "失败",
      skipped: "已跳过",
    };
    el("planStepList").innerHTML = runSteps.map(function (s, i) {
      var pct = 0;
      if (s.state === "countdown" && countdownTotal > 0 && i === cursor) {
        pct = Math.round(((countdownTotal - countdownLeft) / countdownTotal) * 100);
      }
      if (s.state === "ready" || s.state === "success") pct = 100;
      return '<div class="sl-step is-' + s.state + '" data-step-id="' + s.id + '">'
        + '<div class="sl-step-head">'
        + '<div class="sl-step-title">' + (i + 1) + ". " + s.name + "</div>"
        + '<span class="sl-step-badge">' + (stateMap[s.state] || s.state) + "</span>"
        + "</div>"
        + '<div class="sl-step-meta">' + s.system + " · " + s.device + "</div>"
        + '<div class="sl-step-meta">动作：' + s.action + "　｜　配置时长：" + (s.execTime || "-") + "</div>"
        + ((s.state === "countdown" || s.state === "ready" || (s.state === "running" && mode === "auto"))
          ? '<div class="sl-countdown"><div class="sl-countdown-bar"><i style="width:' + pct + '%"></i></div>'
            + '<span class="sl-countdown-text">' + (s.state === "ready" ? "完成" : (countdownLeft + "s")) + "</span></div>"
          : "")
        + (s.message ? '<div class="sl-step-msg">' + s.message + "</div>" : "")
        + "</div>";
    }).join("") || '<div class="sl-empty">请先选择智能联动规则，点击「载入联动」</div>';
  }

  function syncToolbar() {
    var toolbar = el("stepToolbar");
    var isAuto = mode === "auto";
    toolbar.classList.toggle("is-hidden", isAuto);
    if (isAuto) return;
    el("btnStart").disabled = !runSteps.length || started;
    el("btnNext").disabled = !(started && stepAwaitingNext && runSteps[cursor] && runSteps[cursor].state === "ready");
    el("btnSkip").disabled = !(started && runSteps[cursor] && (runSteps[cursor].state === "countdown" || runSteps[cursor].state === "ready" || runSteps[cursor].state === "failed"));
  }

  function updateLiveClock() {
    document.querySelectorAll("[data-live-clock]").forEach(function (node) {
      node.textContent = "LIVE · " + clockText();
    });
  }

  function renderVideos() {
    el("nearbyVideo").innerHTML = VIDEO_FEEDS.map(function (cam, index) {
      return '<div class="sl-video-feed" data-video-index="' + index + '">'
        + '<div class="sl-video-title"><span>' + cam.name + '</span><b>' + cam.status + "</b></div>"
        + '<div class="sl-video-screen">'
        + '<img src="' + VIDEO_IMG + '" alt="' + cam.name + '" onerror="this.src=\'' + FALLBACK_IMG + '\'">'
        + '<span class="sl-video-live" data-live-clock>LIVE · ' + clockText() + "</span>"
        + '<button class="sl-video-fs" type="button" data-video-fs="' + index + '" title="全屏" aria-label="全屏查看">'
        + '<i class="fa-solid fa-expand"></i></button>'
        + "</div></div>";
    }).join("");
  }

  function openVideoFullscreen(index) {
    var cam = VIDEO_FEEDS[index];
    if (!cam) return;
    document.querySelectorAll(".sl-video-fullscreen-mask").forEach(function (n) { n.remove(); });
    var mask = document.createElement("div");
    mask.className = "sl-video-fullscreen-mask";
    mask.innerHTML = '<div class="sl-fs-head"><strong>' + cam.name + " · " + cam.status + '</strong>'
      + '<button class="btn btn-secondary" type="button" data-fs-close>退出全屏</button></div>'
      + '<div class="sl-fs-body"><img src="' + VIDEO_IMG + '" alt="' + cam.name + '" onerror="this.src=\'' + FALLBACK_IMG + '\'">'
      + '<span class="sl-video-live" data-live-clock>LIVE · ' + clockText() + "</span></div>";
    document.body.appendChild(mask);
    mask.querySelector("[data-fs-close]").addEventListener("click", function () { mask.remove(); });
    mask.addEventListener("click", function (e) { if (e.target === mask) mask.remove(); });
  }

  function finishRun(status) {
    persistRuns({
      id: runId,
      ruleId: activeRule ? activeRule.id : "",
      ruleName: ruleName,
      space: spaceLabel,
      mode: mode,
      status: status,
      startedAt: runStartedAt || nowText(),
      finishedAt: nowText(),
      steps: runSteps.map(function (s) {
        return { id: s.id, name: s.name, system: s.system, device: s.device, action: s.action, state: s.state, message: s.message || "" };
      }),
    });
    setSituationStatus(status === "success" ? "已完成" : "已中止", status === "success" ? "done" : "idle");
    updateSituationMetrics();
  }

  function clearCountdown() {
    if (countdownTimer) {
      clearInterval(countdownTimer);
      countdownTimer = null;
    }
    countdownLeft = 0;
    countdownTotal = 0;
  }

  function completeCurrentStep(ok, message) {
    var step = runSteps[cursor];
    if (!step) return;
    clearCountdown();
    if (ok) {
      step.state = "success";
      step.message = message || "执行成功（Mock）";
      pushCommand(step, "success", step.message, mode);
      appendLog("成功：" + step.name + " → " + step.system + "/" + step.device + "/" + step.action, "success");
      if (isVideoAction(step.action)) appendLog("已联动调取附近视频复核。", "info");
    } else {
      step.state = "failed";
      step.message = message || "执行失败";
      pushCommand(step, "failed", step.message, mode);
      appendLog("失败：" + step.name + " — " + step.message, "fail");
    }
    stepAwaitingNext = false;
    renderSteps();
    syncToolbar();
    updateSituationMetrics();
  }

  function advanceToNext() {
    cursor += 1;
    stepAwaitingNext = false;
    if (cursor >= runSteps.length) {
      appendLog("联动执行完成：" + runId + "（规则：" + ruleName + "）", "success");
      el("runSummary").textContent = "联动已完成 · " + ruleName + " · " + spaceLabel;
      setSituationStatus("已完成", "done");
      updateSituationMetrics();
      finishRun("success");
      syncToolbar();
      renderSteps();
      return;
    }
    startStepCountdown();
  }

  function onCountdownFinished() {
    var step = runSteps[cursor];
    if (!step) return;
    step.state = "ready";
    step.message = "时长到达，等待确认下一步";
    stepAwaitingNext = true;
    renderSteps();
    syncToolbar();
    updateSituationMetrics();
    if (mode !== "auto") setSituationStatus("待确认", "live");
    appendLog("步骤「" + step.name + "」倒计时结束，可确认下一步。", "info");
    if (mode === "auto") {
      // 自动模式：自动确认并进入下一步
      setTimeout(function () {
        completeCurrentStep(true, "自动执行成功（Mock）");
        setTimeout(advanceToNext, 350);
      }, 400);
    }
  }

  function startStepCountdown() {
    var step = runSteps[cursor];
    if (!step) return;
    clearCountdown();
    stepAwaitingNext = false;
    step.state = "countdown";
    step.message = "";
    countdownTotal = demoSeconds(step.execTime);
    countdownLeft = countdownTotal;
    appendLog("开始执行步骤「" + step.name + "」，模拟时长 " + countdownTotal + " 秒（配置：" + (step.execTime || "-") + "）。", "info");
    el("runSummary").textContent = "执行中 · " + ruleName + " · 第 " + (cursor + 1) + "/" + runSteps.length + " 步 · " + step.name;
    setSituationStatus("执行中", "live");
    updateSituationMetrics();
    renderSteps();
    syncToolbar();
    countdownTimer = setInterval(function () {
      countdownLeft -= 1;
      if (countdownLeft <= 0) {
        clearCountdown();
        onCountdownFinished();
        return;
      }
      renderSteps();
      syncToolbar();
    }, 1000);
  }

  function loadPlan() {
    var rule = currentRule();
    if (!rule) {
      window.openAppConfirm({ title: "提示", message: "请先选择智能联动规则", confirmText: "知道了", okClass: "btn-primary" });
      return;
    }
    if (rule.status === "停用") {
      window.openAppConfirm({ title: "提示", message: "该规则已停用，无法载入执行。", confirmText: "知道了", okClass: "btn-primary" });
      return;
    }
    var results = ruleResults(rule);
    if (!results.length) {
      window.openAppConfirm({ title: "提示", message: "该规则尚未配置联动结果，请先到智能联动编辑规则。", confirmText: "知道了", okClass: "btn-primary" });
      return;
    }
    clearCountdown();
    activeRule = rule;
    ruleName = rule.name;
    spaceLabel = el("spaceInput").value || spaceFromRule(rule) || rule.area || "-";
    mode = el("modeSelect").value;
    runId = "RUN-" + Date.now();
    started = false;
    cursor = -1;
    stepAwaitingNext = false;
    runSteps = results.map(function (r, index) {
      return {
        id: "R" + (index + 1),
        order: index + 1,
        system: r.system,
        device: r.device,
        action: r.action,
        execTime: r.execTime || "-",
        name: (r.device || r.system) + " · " + (r.action || "执行"),
        confirmLevel: r.confirmLevel || confirmLevelFor(r.action),
        optional: !!r.optional,
        state: "pending",
        message: "",
      };
    });
    el("runLog").innerHTML = '<div class="sl-log-empty">暂无执行日志</div>';
    if (el("runLogCount")) el("runLogCount").textContent = "0 条";
    el("runSummary").textContent = "已载入规则「" + ruleName + "」· " + spaceLabel + " · "
      + (mode === "auto" ? "一键自动" : "逐步确认") + " · 共 " + runSteps.length + " 步 · " + runId;
    setSituationStatus(mode === "auto" ? "自动待启" : "已载入", "");
    updateSituationMetrics();
    appendLog("已从智能联动载入规则「" + ruleName + "」，触发条件：" + (rule.trigger || "-"), "info");
    if (rule.mode === "自动执行") appendLog("提示：规则配置为自动执行，执行台按一键自动模拟下发。", "info");
    renderRuleContext(rule);
    renderSteps();
    syncToolbar();
    renderVideos();

    if (mode === "auto") {
      // 自动模式载入后直接开始多步倒计时
      setTimeout(function () {
        if (!runSteps.length || started) return;
        started = true;
        runStartedAt = nowText();
        cursor = 0;
        appendLog("一键自动开始执行联动规则「" + ruleName + "」。", "info");
        startStepCountdown();
      }, 500);
    }
  }

  el("ruleSelect").addEventListener("change", function () {
    var rule = currentRule();
    renderRuleContext(rule);
    if (rule) el("modeSelect").value = rule.mode === "手动执行" ? "step" : "auto";
  });
  el("modeSelect").addEventListener("change", function () {
    mode = el("modeSelect").value;
    syncToolbar();
  });
  el("btnLoadPlan").addEventListener("click", loadPlan);

  el("btnStart").addEventListener("click", function () {
    if (!runSteps.length || started || mode === "auto") return;
    started = true;
    runStartedAt = nowText();
    cursor = 0;
    appendLog("开始执行联动规则「" + ruleName + "」。", "info");
    startStepCountdown();
  });

  el("btnNext").addEventListener("click", function () {
    if (!stepAwaitingNext || !runSteps[cursor] || runSteps[cursor].state !== "ready") return;
    completeCurrentStep(true);
    setTimeout(advanceToNext, 280);
  });

  el("btnSkip").addEventListener("click", function () {
    var step = runSteps[cursor];
    if (!step) return;
    window.openAppConfirm({
      title: "跳过当前步",
      message: "确认跳过步骤「" + step.name + "」并继续后续联动吗？",
      confirmText: "确认跳过",
      okClass: "btn-primary",
      onConfirm: function () {
        clearCountdown();
        step.state = "skipped";
        step.message = "人工跳过";
        pushCommand(step, "rejected", "人工跳过", mode);
        appendLog("跳过：" + step.name, "info");
        stepAwaitingNext = false;
        renderSteps();
        setTimeout(advanceToNext, 280);
      },
    });
  });

  document.addEventListener("click", function (event) {
    var fs = event.target.closest("[data-video-fs]");
    if (fs) openVideoFullscreen(Number(fs.dataset.videoFs));
  });

  var params = new URLSearchParams(location.search);
  var ruleId = params.get("ruleId");
  fillRules(ruleId);
  renderRuleContext(currentRule());
  renderVideos();
  syncToolbar();
  clockTimer = setInterval(updateLiveClock, 1000);

  if (currentRule()) {
    el("modeSelect").value = currentRule().mode === "手动执行" ? "step" : "auto";
    mode = el("modeSelect").value;
    loadPlan();
    if (ruleId) appendLog("已从智能联动规则跳转进入执行台。", "info");
  } else {
    el("planStepList").innerHTML = '<div class="sl-empty">暂无可用规则，请先在「智能联动」配置规则</div>';
  }
})();
  </script>
</body>
</html>
