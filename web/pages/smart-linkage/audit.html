<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>指令审计 - 智能联动 - 科学岛管廊监控中心</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/tob-ui.css">
  <link rel="stylesheet" href="../../assets/css/smart-linkage.css">
</head>
<body class="sl-page" data-menu-key="smart-linkage.audit" data-page-section="智能联动" data-page-title="指令审计">
  <div class="app-shell">
    <aside id="app-sidebar" class="sidebar"></aside>
    <header id="app-header" class="header"></header>
    <main class="main">
      <div class="screen-frame stack">
        <section class="card">
          <div class="sl-audit-filter">
            <label class="form-field"><span class="form-label">层级</span>
              <select class="form-control" data-filter="layer">
                <option value="">全部</option>
                <option value="L1">L1</option>
                <option value="L2">L2</option>
                <option value="L3">L3</option>
              </select></label>
            <label class="form-field"><span class="form-label">子系统</span>
              <select class="form-control" data-filter="system"><option value="">全部</option></select></label>
            <label class="form-field"><span class="form-label">状态</span>
              <select class="form-control" data-filter="status">
                <option value="">全部</option>
                <option value="success">success</option>
                <option value="failed">failed</option>
                <option value="rejected">rejected</option>
                <option value="pending">pending</option>
                <option value="timeout">timeout</option>
              </select></label>
            <label class="form-field"><span class="form-label">操作人</span>
              <input class="form-control" data-filter="operator" placeholder="请输入操作人"></label>
            <div style="display:flex;gap:8px;">
              <button class="btn btn-secondary" type="button" data-action="reset">重置</button>
              <button class="btn btn-primary" type="button" data-action="search">搜索</button>
            </div>
          </div>
        </section>
        <section class="card">
          <div class="card-title-row" style="padding:16px 24px 0;margin-bottom:12px;">
            <h1 class="card-title">指令审计</h1>
            <div class="btn-row">
              <button class="btn btn-secondary" type="button" data-action="export"><i class="fa-solid fa-download"></i> 导出</button>
            </div>
          </div>
          <div class="table-wrap" style="padding:0 24px 8px;">
            <table class="table" aria-label="指令审计列表">
              <thead>
                <tr>
                  <th>序号</th>
                  <th>层级</th>
                  <th>子系统</th>
                  <th>目标</th>
                  <th>动作</th>
                  <th>模式</th>
                  <th>操作人</th>
                  <th>时间</th>
                  <th>状态</th>
                  <th>回执</th>
                  <th>预案运行 ID</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="auditBody"></tbody>
            </table>
          </div>
          <div class="pagination" style="padding:12px 24px 16px">
            <span>共 <strong id="auditCount">0</strong> 条</span>
          </div>
        </section>
      </div>
    </main>
  </div>
  <script src="../../../app/config/menu.js?v=nav-hide-1"></script>
  <script src="../../../app/components/sidebar.js?v=nav-home-1"></script>
  <script src="../../../app/components/header.js?v=nav-home-1"></script>
  <script src="../../../app/components/drawer.js"></script>
  <script src="../../../app/data/smart-linkage-data.js"></script>
  <script>
(function () {
  "use strict";
  try {
    var saved = JSON.parse(sessionStorage.getItem("SMART_LINKAGE_COMMANDS") || "null");
    if (Array.isArray(saved) && window.SMART_LINKAGE_DATA) {
      window.SMART_LINKAGE_DATA.commands = saved;
    }
  } catch (_) {}

  var rows = [...(window.SMART_LINKAGE_DATA?.commands || [])];
  var filtered = rows.slice();
  var body = document.getElementById("auditBody");
  var systemSel = document.querySelector('[data-filter="system"]');

  var systems = Array.from(new Set(rows.map(function (r) { return r.system; }).filter(Boolean)));
  systemSel.innerHTML = '<option value="">全部</option>' + systems.map(function (s) {
    return '<option value="' + s + '">' + s + "</option>";
  }).join("");

  function esc(v) {
    return String(v == null ? "" : v)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function render() {
    body.innerHTML = filtered.map(function (item, index) {
      return "<tr>"
        + "<td>" + (index + 1) + "</td>"
        + "<td>" + esc(item.layer) + "</td>"
        + "<td>" + esc(item.system) + "</td>"
        + "<td>" + esc(item.targetName) + "</td>"
        + "<td>" + esc(item.action) + "</td>"
        + "<td>" + esc(item.mode) + "</td>"
        + "<td>" + esc(item.operator) + "</td>"
        + "<td>" + esc(item.requestedAt) + "</td>"
        + "<td>" + esc(item.status) + "</td>"
        + "<td title=\"" + esc(item.message) + "\">" + esc(item.message) + "</td>"
        + "<td>" + esc(item.planRunId || "-") + "</td>"
        + "<td><button class=\"table-action\" type=\"button\" data-detail=\"" + esc(item.id) + "\">详情</button></td>"
        + "</tr>";
    }).join("");
    document.getElementById("auditCount").textContent = String(filtered.length);
  }

  function applyFilter() {
    var layer = document.querySelector('[data-filter="layer"]').value;
    var system = document.querySelector('[data-filter="system"]').value;
    var status = document.querySelector('[data-filter="status"]').value;
    var operator = (document.querySelector('[data-filter="operator"]').value || "").trim();
    filtered = rows.filter(function (r) {
      if (layer && r.layer !== layer) return false;
      if (system && r.system !== system) return false;
      if (status && r.status !== status) return false;
      if (operator && String(r.operator || "").indexOf(operator) < 0) return false;
      return true;
    });
    render();
  }

  document.querySelector('[data-action="search"]').addEventListener("click", applyFilter);
  document.querySelector('[data-action="reset"]').addEventListener("click", function () {
    document.querySelector('[data-filter="layer"]').value = "";
    document.querySelector('[data-filter="system"]').value = "";
    document.querySelector('[data-filter="status"]').value = "";
    document.querySelector('[data-filter="operator"]').value = "";
    filtered = rows.slice();
    render();
  });
  document.querySelector('[data-action="export"]').addEventListener("click", function () {
    window.openAppDrawer({
      title: "导出指令审计",
      subtitle: "智能联动 · 指令审计",
      body: "<p>已按当前筛选条件生成指令审计文件（Mock）。</p>",
      footer: '<button class="btn btn-secondary" data-drawer-close>取消</button><button class="btn btn-primary" data-drawer-close>确认导出</button>'
    });
  });
  body.addEventListener("click", function (e) {
    var btn = e.target.closest("[data-detail]");
    if (!btn) return;
    var item = rows.find(function (r) { return String(r.id) === String(btn.getAttribute("data-detail")); });
    if (!item) return;
    window.openAppDrawer({
      title: "指令详情",
      subtitle: "智能联动 · 指令审计",
      body: '<div class="detail-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;">'
        + ["id","layer","system","targetType","targetId","targetName","action","mode","operator","requestedAt","status","message","planRunId"].map(function (k) {
          return '<div><div class="info-label">' + k + '</div><div class="info-value">' + esc(item[k] == null ? "-" : item[k]) + "</div></div>";
        }).join("")
        + "</div>",
      footer: '<button class="btn btn-primary" data-drawer-close>关闭</button>'
    });
  });

  render();
})();
  </script>
</body>
</html>
