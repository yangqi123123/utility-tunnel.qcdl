<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>北向对接 - 科学岛管廊监控中心</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/tob-ui.css">
  <link rel="stylesheet" href="../../assets/css/service-center.css?v=3">
  <link rel="stylesheet" href="../../assets/css/network.css">
  <link rel="stylesheet" href="../../assets/css/alarm-center.css">
  <link rel="stylesheet" href="../../assets/css/interface-platform.css">
</head>
<body class="service-center-page interface-platform-page interface-north-page" data-menu-key="interface-platform.north" data-page-section="接口管理平台" data-page-title="北向对接">
  <div class="app-shell">
    <aside id="app-sidebar" class="sidebar"></aside>
    <header id="app-header" class="header"></header>
    <main class="main">
      <div class="screen-frame stack">
        <section class="analysis-kpi-grid network-overview-kpis">
          <article class="analysis-kpi is-blue">
            <div class="analysis-kpi-icon"><i class="fa-solid fa-share-nodes"></i></div>
            <div class="analysis-kpi-body">
              <span class="analysis-kpi-label">北向接口</span>
              <strong class="analysis-kpi-value" data-kpi-iface>02</strong>
              <em class="analysis-kpi-sub">市级 1 · 区级 1</em>
            </div>
          </article>
          <article class="analysis-kpi is-green">
            <div class="analysis-kpi-icon"><i class="fa-solid fa-cloud-arrow-up"></i></div>
            <div class="analysis-kpi-body">
              <span class="analysis-kpi-label">今日主动上报</span>
              <strong class="analysis-kpi-value">1,286</strong>
              <em class="analysis-kpi-sub">成功率 99.7%</em>
            </div>
          </article>
          <article class="analysis-kpi is-amber">
            <div class="analysis-kpi-icon"><i class="fa-solid fa-clock"></i></div>
            <div class="analysis-kpi-body">
              <span class="analysis-kpi-label">定时任务</span>
              <strong class="analysis-kpi-value" data-kpi-task>03</strong>
              <em class="analysis-kpi-sub" data-kpi-task-sub>启用 2 · 停用 1</em>
            </div>
          </article>
          <article class="analysis-kpi is-red">
            <div class="analysis-kpi-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
            <div class="analysis-kpi-body">
              <span class="analysis-kpi-label">接口异常</span>
              <strong class="analysis-kpi-value">01</strong>
              <em class="analysis-kpi-sub">已自动重试 2 次</em>
            </div>
          </article>
        </section>

        <section class="card device-list-card">
          <div class="card-title-row device-toolbar">
            <h1 class="card-title">北向接口</h1>
            <div class="btn-row">
              <button class="btn btn-primary" type="button" data-north-action="iface-create"><i class="fa-solid fa-plus"></i> 新增北向接口</button>
            </div>
          </div>
          <div class="table-wrap">
            <table class="table interface-table" aria-label="北向接口列表">
              <thead>
                <tr>
                  <th>接口名称</th>
                  <th>对接对象</th>
                  <th>协议</th>
                  <th>认证 / 安全</th>
                  <th>方向</th>
                  <th>状态</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="ifaceTableBody"></tbody>
            </table>
          </div>
        </section>

        <section class="card device-list-card">
          <div class="card-title-row device-toolbar">
            <h1 class="card-title">定时上报任务</h1>
            <div class="btn-row">
              <button class="btn btn-primary" type="button" data-north-action="task-create"><i class="fa-solid fa-plus"></i> 新建定时任务</button>
            </div>
          </div>
          <div class="table-wrap">
            <table class="table interface-table table-actions-sticky" aria-label="定时上报任务列表">
              <thead>
                <tr>
                  <th>任务名称</th>
                  <th>任务 ID</th>
                  <th>上报接口</th>
                  <th>触发周期</th>
                  <th>上报主题</th>
                  <th>最近执行</th>
                  <th>状态</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="northTaskBody"></tbody>
            </table>
          </div>
          <div class="pagination">
            <span>共 <strong id="northTaskCount">0</strong> 条，每页显示 10 条</span>
            <span class="page-item disabled">‹</span>
            <span class="page-item active">1</span>
            <span class="page-item disabled">›</span>
          </div>
        </section>
      </div>
    </main>
  </div>
  <script src="../../../app/config/menu.js?v=nav-hide-1"></script>
  <script src="../../../app/components/sidebar.js?v=nav-home-1"></script>
  <script src="../../../app/components/header.js?v=nav-home-1"></script>
  <script src="../../../app/components/drawer.js"></script>
  <script src="../../../app/components/requirement.js"></script>
  <script src="../../assets/js/interface-north.js"></script>
</body>
</html>
