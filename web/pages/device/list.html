<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>设备管理 - 科学岛管廊监控中心</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/tob-ui.css">
  <link rel="stylesheet" href="../../assets/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="../../assets/css/base-map.css">
  <style>
    .device-page .page-head { display:none; }
    .device-filter-card { padding:16px 24px; }
    .device-filter-card .filter-actions { display:grid; grid-template-columns:repeat(4,minmax(150px,1fr)) auto auto auto; gap:16px; align-items:end; }
    .device-filter-card .extra-filter { display:none; }
    .device-filter-card.expanded .extra-filter { display:block; }
    .device-filter-actions { display:flex; align-items:end; justify-content:flex-start; gap:16px; min-height:32px; }
    .device-filter-actions .btn { white-space:nowrap; }
    .device-list-card { overflow:hidden; }
    .device-toolbar { padding:16px 24px 0; margin-bottom:12px; }
    .device-toolbar .btn-row { flex-wrap:wrap; justify-content:flex-end; }
    /* 同步设备数据弹窗「厂家/平台编码」字段暂时隐藏；删除此规则即可恢复显示。 */
    .form-field.sync-platform-field { display:none; }
    /* 【暂时隐藏】「同步设备状态」按钮；删除此规则即可恢复显示。 */
    .btn[data-action="sync-device-status"] { display:none; }
    /* 设备编码由设备名称自动带出，不可编辑 */
    .device-form .form-control[readonly] { background:#f5f7fc; color:#5b6472; cursor:default; }
    .device-table { min-width:1080px; }
    .device-table tbody tr { cursor:pointer; }
    .device-table td,.device-table th { white-space:nowrap; }
    .device-table td:nth-child(4),.device-table th:nth-child(4) { min-width:180px; }
    .device-name-cell { color:var(--text-title); font-weight:600; }
    .device-code { color:var(--text-secondary); font-size:12px; }
    .device-actions { white-space:nowrap; }
    .device-actions .table-action { margin-right:14px; }
    .drawer:has(.device-form) { width:min(720px,92vw); }
    .device-form { display:grid; gap:24px; }
    .device-form-section { margin:0; }
    .device-form-title { margin:0 0 16px; color:var(--text-title); font-size:16px; font-weight:600; line-height:1.5; }
    .device-form-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px 24px; }
    .device-location-cascade { display:contents; }
    .device-form .form-item { margin:0; }
    .device-form .form-control { min-width:0; }
    .device-form .textarea { min-height:76px; }
    .device-form-stack { display:grid; gap:16px; margin-top:16px; }
    .device-radio-row { display:flex; align-items:center; gap:16px; min-height:32px; }
    .device-radio { display:inline-flex; align-items:center; gap:6px; color:var(--text-primary); cursor:pointer; }
    .device-radio input { accent-color:var(--primary); }
    .device-smart-field.hidden { display:none; }
    .device-point-row { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; align-items:end; }
    .device-detail .tabs { margin-bottom:16px; }
    .device-detail .tab { min-width:88px; }
    .device-detail-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px 24px; }
    .device-detail-grid .info-item { min-height:56px; padding:4px 0; }
    .device-detail-toolbar { display:flex; align-items:end; justify-content:space-between; gap:16px; margin-bottom:16px; }
    .device-detail-toolbar .form-field { flex:1; max-width:300px; }
    .device-detail-actions { display:flex; gap:8px; }
    .device-detail-toolbar .device-detail-actions { align-items:flex-end; }
    .device-detail-toolbar .device-detail-actions .form-field { min-width:148px; max-width:180px; }
    .nested-device-drawer { position:fixed; z-index:1250; top:0; right:0; width:min(560px,92vw); height:100vh; display:flex; flex-direction:column; background:#fff; box-shadow:-8px 0 24px rgba(26,28,31,.18); }
    .nested-device-drawer-head { min-height:56px; display:flex; align-items:center; justify-content:space-between; padding:0 24px; border-bottom:1px solid var(--divider); }
    .nested-device-drawer-head h2 { margin:0; font-size:16px; color:var(--text-title); }
    .nested-device-drawer-body { flex:1; overflow:auto; padding:24px; }
    .nested-device-drawer-foot { min-height:56px; display:flex; justify-content:flex-end; gap:8px; align-items:center; padding:12px 24px; border-top:1px solid var(--divider); }
    .nested-device-drawer-close { width:28px; height:28px; border:0; background:transparent; color:var(--text-secondary); font-size:20px; cursor:pointer; }
    .device-detail-table { min-width:620px; }
    .device-empty { height:180px !important; }
    .device-tree-select { position:relative; }
    .device-select-trigger { display:flex; align-items:center; justify-content:space-between; gap:12px; text-align:left; cursor:pointer; }
    .device-select-trigger[disabled] { cursor:not-allowed; }
    .device-select-trigger span { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .device-select-trigger .placeholder { color:var(--text-secondary); }
    .device-select-trigger i { flex:0 0 auto; color:var(--text-secondary); transition:transform .18s ease; }
    .is-open > .device-select-trigger i { transform:rotate(180deg); }
    .device-tree-panel,.device-cascader-panel { position:absolute; z-index:600; top:calc(100% + 4px); left:0; display:none; border:1px solid var(--line); border-radius:var(--radius-md); background:#fff; box-shadow:0 12px 32px rgba(26,28,31,.12); }
    .device-tree-select.is-open .device-tree-panel { display:block; }
    .device-tree-panel { right:0; max-height:300px; overflow:auto; padding:8px; }
    .device-tree-children { margin-left:12px; padding-left:16px; border-left:1px solid var(--line); }
    .device-tree-row { display:flex; align-items:center; min-height:36px; gap:8px; }
    .device-tree-toggle { width:20px; height:20px; flex:0 0 20px; padding:0; border:1px solid var(--text-secondary); background:#fff; color:var(--text-primary); font-size:12px; line-height:18px; cursor:pointer; }
    .device-tree-toggle.is-leaf { visibility:hidden; }
    .device-tree-option { flex:1; min-width:0; padding:6px 8px; border:0; border-radius:var(--radius-sm); background:transparent; color:var(--text-primary); text-align:left; cursor:pointer; }
    .device-tree-option:hover,.device-tree-option.is-selected { background:var(--primary-bg); color:var(--primary); }
    .device-tree-option.is-selected { font-weight:600; }
    .device-name-select { position:relative; }
    .device-name-control { position:relative; }
    .device-name-control .form-control { padding-right:34px; }
    .device-name-control i { position:absolute; top:50%; right:12px; color:var(--text-secondary); font-size:12px; pointer-events:none; transform:translateY(-50%); transition:transform .18s ease; }
    .device-name-select.is-open .device-name-control i { transform:translateY(-50%) rotate(180deg); }
    .device-name-panel { position:absolute; z-index:610; top:calc(100% + 4px); left:0; right:0; display:none; max-height:240px; overflow:auto; padding:6px; border:1px solid var(--line); border-radius:var(--radius-md); background:#fff; box-shadow:0 12px 32px rgba(26,28,31,.12); }
    .device-name-select.is-open .device-name-panel { display:block; }
    .device-name-option { width:100%; min-height:34px; display:block; padding:7px 10px; border:0; border-radius:var(--radius-sm); background:#fff; color:var(--text-primary); font-size:14px; text-align:left; cursor:pointer; }
    .device-name-option:hover,.device-name-option.is-active,.device-name-option.is-selected { background:var(--primary-bg); color:var(--primary); }
    .device-name-option.is-selected { font-weight:600; }
    .device-name-empty { padding:20px 10px; color:var(--text-secondary); font-size:13px; text-align:center; }
    .device-cascader-panel { width:min(560px,calc(90vw - 48px)); height:288px; overflow:hidden; }
    .device-cascader-columns { display:grid; grid-template-columns:repeat(3,1fr); height:100%; }
    .device-cascader-column { overflow:auto; padding:8px; border-right:1px solid var(--line); }
    .device-cascader-column:last-child { border-right:0; }
    .device-cascader-option { width:100%; min-height:36px; display:flex; align-items:center; justify-content:space-between; padding:0 10px; border:0; border-radius:var(--radius-sm); background:#fff; color:var(--text-primary); text-align:left; cursor:pointer; }
    .device-cascader-option:hover,.device-cascader-option.active { background:var(--primary-bg); color:var(--primary); }
    .device-business-mask { position:fixed; inset:0; z-index:1100; display:grid; place-items:center; padding:24px; background:rgba(26,28,31,.45); }
    .device-business-modal { width:min(1100px,96vw); max-height:92vh; display:flex; flex-direction:column; overflow:hidden; border-radius:4px; background:#fff; box-shadow:0 16px 48px rgba(26,28,31,.2); }
    .device-business-modal.qr-modal { width:min(440px,92vw); }
    .device-modal-head { min-height:56px; display:flex; align-items:center; justify-content:space-between; padding:0 24px; border-bottom:1px solid var(--divider); }
    .device-modal-head h2 { margin:0; color:var(--text-title); font-size:16px; font-weight:600; }
    .device-modal-close { width:28px; height:28px; border:0; background:transparent; color:var(--text-secondary); cursor:pointer; font-size:20px; }
    .device-modal-body { min-height:0; flex:1; overflow:auto; padding:24px; }
    .device-modal-foot { min-height:56px; display:flex; justify-content:flex-end; align-items:center; gap:8px; padding:12px 24px; border-top:1px solid var(--divider); }
    .point-picker { display:grid; grid-template-columns:minmax(0,1fr) 176px; gap:16px; min-height:580px; }
    .point-map-column { min-width:0; display:flex; flex-direction:column; gap:12px; }
    .point-map-head { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .point-map-title { margin:0; color:var(--text-title); font-size:14px; font-weight:600; }
    .point-map-tools { display:flex; gap:8px; }
    .point-map-tools .btn { width:32px; padding:0; }
    .point-map { position:relative; min-height:500px; overflow:hidden; border:1px solid #cbd6e5; background:#e7edf0 url("../../assets/maps/device-monitor-map.svg") center/cover no-repeat; cursor:crosshair; }
    .point-map .leaflet-control-attribution { font-size:10px; }
    .point-map-note { position:absolute; z-index:500; top:12px; left:50%; transform:translateX(-50%); padding:4px 10px; border:1px solid #c4d9e8; border-radius:2px; color:#5d7690; background:rgba(255,255,255,.92); font-size:11px; pointer-events:none; }
    .point-device-marker { width:24px; height:24px; display:grid; place-items:center; border:2px solid #fff; border-radius:50%; color:#fff; background:var(--marker-color,#135afa); box-shadow:0 2px 8px rgba(26,28,31,.28); }
    .point-device-marker.current { width:28px; height:28px; border-width:3px; box-shadow:0 0 0 5px rgba(19,90,250,.2),0 3px 10px rgba(26,28,31,.32); }
    .leaflet-tooltip.device-point-tooltip { padding:6px 10px; border:0; border-radius:2px; color:#fff; background:rgba(26,28,31,.9); box-shadow:0 6px 16px rgba(10,24,46,.28); font-size:12px; }
    .leaflet-tooltip.device-point-tooltip::before { border-top-color:rgba(26,28,31,.9); }
    .point-legend { align-self:start; width:100%; border:1px solid #e5eaf3; background:rgba(255,255,255,.96); color:#50565d; box-shadow:0 4px 14px rgba(26,28,31,.08); }
    .point-legend-head { min-height:40px; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 12px; border-bottom:1px solid #edf1f7; }
    .point-legend-title { margin:0; font-size:14px; font-weight:600; color:#1a1c1f; }
    .point-legend-total { padding:2px 8px; border-radius:2px; background:#f2f5fa; color:#86909c; font-size:12px; white-space:nowrap; }
    .point-legend-list { padding:6px 0; }
    .point-legend-item { min-height:30px; display:grid; grid-template-columns:16px 10px minmax(0,1fr) auto; align-items:center; gap:8px; padding:4px 12px; font-size:12px; color:#50565d; white-space:nowrap; cursor:pointer; }
    .point-legend-item:hover { background:#f7f9fc; }
    .point-legend-check { width:14px; height:14px; margin:0; accent-color:#135afa; cursor:pointer; }
    .point-legend-icon { width:8px; height:8px; border-radius:2px; background:var(--legend-color,#135afa); }
    .point-legend-count { color:#86909c; font-variant-numeric:tabular-nums; }
    .point-coordinate-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .point-coordinate-row .form-label { margin-bottom:6px; }
    .qr-preview { display:grid; justify-items:center; gap:12px; }
    .qr-preview canvas { max-width:100%; height:auto; border:1px solid var(--divider); }
    .qr-preview-name { margin:0; color:var(--text-title); font-size:16px; font-weight:600; }
    .qr-preview-code { margin:0; color:var(--text-secondary); font-family:Consolas,monospace; }
    .device-import-box { position:relative; min-height:152px; display:grid; place-items:center; align-content:center; gap:8px; border:1px dashed #c9d5eb; border-radius:4px; color:var(--text-secondary); background:#fafcff; cursor:pointer; }
    .device-import-box.dragover { border-color:var(--primary); background:var(--primary-bg); }
    .device-import-box input { position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; }
    .device-import-box i { color:var(--primary); font-size:28px; }
    .device-import-file { margin:12px 0 0; color:var(--text-primary); }
    .device-import-actions { display:flex; justify-content:flex-end; margin-top:16px; }
    .sync-log-filter .filter-actions { display:grid; grid-template-columns:repeat(3,minmax(180px,1fr)) auto auto; gap:16px; align-items:end; }
    .sync-log-card { padding:0; overflow:hidden; }
    .sync-log-table { min-width:1320px; }
    .sync-log-table th,.sync-log-table td { white-space:nowrap; }
    .sync-status { display:inline-flex; align-items:center; height:24px; padding:0 8px; border-radius:2px; font-size:12px; }
    .sync-status.running { color:var(--primary); background:var(--primary-light); }
    .sync-status.success { color:#00a870; background:#e8f8f2; }
    .sync-status.failed { color:var(--red); background:#fff0f2; }
    .sync-detail-wrap { margin-top:16px; display:grid; gap:16px; }
    .sync-detail-card { padding:16px 24px; }
    .sync-summary-title { margin:0 0 12px; font-size:16px; color:var(--text-title); }
    .sync-summary-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); border:1px solid var(--divider); border-right:0; border-bottom:0; }
    .sync-summary-item { min-height:48px; display:grid; grid-template-columns:112px 1fr; border-right:1px solid var(--divider); border-bottom:1px solid var(--divider); }
    .sync-summary-label,.sync-summary-value { padding:12px; }
    .sync-summary-label { background:#fafbfc; color:var(--text-secondary); }
    .sync-detail-filter { display:grid; grid-template-columns:repeat(4,minmax(150px,1fr)) auto auto; gap:16px; align-items:end; }
    .sync-staging-table { min-width:1280px; }
    .sync-staging-table th,.sync-staging-table td { white-space:nowrap; max-width:210px; overflow:hidden; text-overflow:ellipsis; }
    .sync-toggle { display:flex; align-items:center; gap:8px; min-height:32px; cursor:pointer; user-select:none; }
    .sync-toggle input { position:absolute; width:1px; height:1px; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); clip-path:inset(50%); white-space:nowrap; }
    .sync-toggle-track { position:relative; order:-1; flex:0 0 36px; width:36px; height:20px; border-radius:10px; background:#c9cdd4; transition:background-color .2s ease; }
    .sync-toggle-track::after { content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(26,28,31,.2); transition:transform .2s ease; }
    .sync-toggle input:checked ~ .sync-toggle-track { background:var(--primary); }
    .sync-toggle input:checked ~ .sync-toggle-track::after { transform:translateX(16px); }
    .sync-toggle input:focus-visible ~ .sync-toggle-track { outline:2px solid rgba(19,90,250,.24); outline-offset:2px; }
    .report-drawer { width:min(760px,94vw); }
    .report-tabs { margin-bottom:16px; }
    .report-json { min-height:420px; max-height:calc(100vh - 190px); margin:0; padding:20px; overflow:auto; border-radius:2px; background:#0f172a; color:#e5edf9; font:13px/1.65 Consolas,"Courier New",monospace; white-space:pre-wrap; overflow-wrap:anywhere; }
    @media (max-width:1100px) { .device-filter-card .filter-actions { grid-template-columns:repeat(2,minmax(150px,1fr)); } .device-filter-actions { grid-column:1 / -1; } .sync-summary-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } .sync-detail-filter { grid-template-columns:repeat(2,minmax(150px,1fr)) auto auto; } }
    @media (max-width:760px) { .point-picker { grid-template-columns:1fr; min-height:0; } .point-map { min-height:400px; } .point-legend-list { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); } }
    @media (max-width:640px) { .device-filter-card .filter-actions,.device-form-grid,.device-detail-grid,.sync-log-filter .filter-actions,.sync-detail-filter,.sync-summary-grid { grid-template-columns:1fr; } .device-filter-actions { grid-column:auto; flex-wrap:wrap; } .device-detail-toolbar { align-items:stretch; flex-direction:column; } .device-detail-toolbar .form-field { max-width:none; } .device-cascader-panel { width:calc(92vw - 48px); } .device-point-row { grid-template-columns:1fr; } }
  </style>
</head>
<body class="device-page" data-menu-key="device.list" data-page-section="设备管理" data-page-title="设备管理">
  <div class="app-shell">
    <aside id="app-sidebar" class="sidebar"></aside>
    <header id="app-header" class="header"></header>
    <main class="main"><div class="screen-frame stack">
      <div class="stack" data-device-mode>
      <section class="card device-filter-card"><div class="filter-actions">
        <label class="form-field"><span class="form-label">设备名称</span><input class="form-control" data-filter="name" placeholder="请输入设备名称"></label>
        <label class="form-field"><span class="form-label">设备编码</span><input class="form-control" data-filter="code" placeholder="请输入设备编码"></label>
        <label class="form-field"><span class="form-label">所属系统</span><div class="device-tree-select" data-filter-system-tree data-tree-value=""><button class="form-control device-select-trigger" type="button" data-filter-system-trigger aria-expanded="false"><span class="placeholder" data-filter-system-label>请选择所属系统</span><i class="fa-solid fa-chevron-down"></i></button><div class="device-tree-panel" data-filter-system-panel></div><input type="hidden" data-filter="system"></div></label>
        <div class="device-location-cascade" data-location-cascade data-filter-location-cascade>
          <label class="form-field"><span class="form-label">所属项目</span><select class="form-control" data-location-level="project" data-filter="project"><option value="">请选择所属项目</option></select></label>
          <label class="form-field extra-filter" data-filter-extra><span class="form-label">所属管廊</span><select class="form-control" data-location-level="corridor" data-filter="corridor"><option value="">请选择所属管廊</option></select></label>
          <label class="form-field extra-filter" data-filter-extra><span class="form-label">所属舱室</span><select class="form-control" data-location-level="room" data-filter="room"><option value="">请选择所属舱室</option></select></label>
          <label class="form-field extra-filter" data-filter-extra><span class="form-label">所属区段</span><select class="form-control" data-location-level="section" data-filter="section"><option value="">请选择所属区段</option></select></label>
          <label class="form-field extra-filter" data-filter-extra><span class="form-label">所属管线</span><select class="form-control" data-location-level="pipeline" data-filter="pipeline"><option value="">请选择所属管线</option></select></label>
        </div>
        <label class="form-field extra-filter" data-filter-extra><span class="form-label">是否智能化</span><select class="form-control" data-filter="smart"><option value="">请选择</option><option>是</option><option>否</option></select></label>
        <label class="form-field extra-filter" data-filter-extra><span class="form-label">来源模块</span><select class="form-control" data-filter="sourceModule"><option value="">请选择</option><option>人工台账</option><option>第三方同步</option></select></label>
        <div class="device-filter-actions"><button class="btn btn-ghost" type="button" data-action="collapse"><span>展开</span> <i class="fa-solid fa-chevron-down"></i></button><button class="btn btn-secondary" type="button" data-action="reset">重置</button><button class="btn btn-primary" type="button" data-action="search">搜索</button></div>
      </div></section>

      if (action === "reset-sync-log" || action === "refresh-sync-log") { document.querySelectorAll("[data-log-filter]").forEach((field) => { field.value=""; }); filteredSyncLogs=[...syncLogs]; renderSyncLogs(); document.querySelector("[data-sync-detail]").classList.add("hidden"); }
      if (action === "search-sync-detail") { const filters=Object.fromEntries([...document.querySelectorAll("[data-detail-filter]")].map((field) => [field.dataset.detailFilter,field.value.trim()])); renderSyncDetail(activeSyncBatchId,filters); }
      if (action === "reset-sync-detail" || action === "refresh-sync-detail") renderSyncDetail(activeSyncBatchId);
      if (!event.target.closest("[data-system-tree],[data-device-name-select]")) closePopovers();
      const row=event.target.closest("#deviceTable tr[data-id]"); if (row && !event.target.closest("button,input,select,a")) openDevice("detail",row.dataset.id);
    });
    document.addEventListener("change",(event) => { if (event.target.matches("[data-sync-with-status]")) event.target.nextElementSibling.textContent=event.target.checked ? "同步" : "不同步"; if (event.target.matches("[data-select-all]")) { filteredDevices.forEach((device) => event.target.checked ? selectedIds.add(device.id) : selectedIds.delete(device.id)); renderRows(); } if (event.target.matches("[data-device-check]")) { event.target.checked ? selectedIds.add(event.target.dataset.deviceCheck) : selectedIds.delete(event.target.dataset.deviceCheck); renderRows(); } });
  </script>
</body>
</html>
