<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>巡检任务 - 科学岛管廊监控中心</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/tob-ui.css">
  <link rel="stylesheet" href="../../assets/css/inspection.css">
</head>
<body class="inspection-page" data-menu-key="inspection.tasks" data-page-section="电子巡更系统" data-page-title="巡检任务">
  <div class="app-shell"><aside id="app-sidebar" class="sidebar"></aside><header id="app-header" class="header"></header><main class="main"><div class="screen-frame stack">
    <section class="card inspection-filters"><div class="inspection-filter-grid">
      <label class="form-field"><span class="form-label">关键字</span><input class="form-control" data-inspection-filter="keyword" placeholder="请输入"></label>
      <label class="form-field"><span class="form-label">任务编码</span><input class="form-control" data-inspection-filter="code" placeholder="请输入"></label>
      <label class="form-field"><span class="form-label">计划名称</span><input class="form-control" data-inspection-filter="planName" placeholder="请输入"></label>
      <label class="form-field"><span class="form-label">巡检状态</span><select class="form-control" data-inspection-filter="status"><option value="">全部</option><option>待巡检</option><option>巡检中</option><option>验收中</option><option>已完成</option><option>已关闭</option></select></label>
      <label class="form-field extra-filter"><span class="form-label">是否超期</span><select class="form-control" data-inspection-filter="overdue"><option value="">全部</option><option>未逾期</option><option>已逾期</option></select></label>
      <label class="form-field extra-filter"><span class="form-label">执行开始</span><input class="form-control" type="date" data-inspection-filter="startDate"></label>
      <label class="form-field extra-filter"><span class="form-label">执行结束</span><input class="form-control" type="date" data-inspection-filter="endDate"></label>
      <div class="filter-actions"><button class="btn btn-ghost" type="button" data-inspection-action="expand"><span>展开</span> <i class="fa-solid fa-chevron-down"></i></button><button class="btn btn-secondary" type="button" data-inspection-action="reset">重置</button><button class="btn btn-primary" type="button" data-inspection-action="search">搜索</button></div>
    </div></section>
    <section class="card inspection-list-card"><div class="inspection-toolbar"><div class="toolbar-left"><h1 class="toolbar-title">巡检任务</h1></div><div class="toolbar-right"><button class="btn btn-secondary btn-danger-outline" type="button" data-inspection-action="delete-selected" disabled><i class="fa-solid fa-trash"></i> 删除</button></div></div>
      <div class="inspection-table-wrap"><table class="table inspection-table table-actions-sticky"><thead><tr><th class="check-cell"><input type="checkbox" data-inspection-select-all aria-label="全选"></th><th>任务编码</th><th>任务名称</th><th>计划</th><th>等级</th><th>巡检人</th><th>验收人</th><th>状态</th><th>结果</th><th>超期状态</th><th>设备/检查项</th><th>异常项</th><th>计划执行</th><th>截止时间</th><th>开始时间</th><th>提交时间</th><th>巡检时长</th><th>操作</th></tr></thead><tbody id="tasksBody"></tbody></table></div><div id="tasksPagination" class="inspection-pagination"></div>
    </section>
  </div></main></div>
  <script src="../../../app/config/menu.js?v=nav-hide-1"></script><script src="../../../app/data/inspection-data.js"></script><script src="../../../app/components/sidebar.js?v=nav-home-1"></script><script src="../../../app/components/header.js?v=nav-home-1"></script><script src="../../../app/components/drawer.js"></script><script src="../../../app/components/inspection.js"></script><script src="../../../app/components/requirement.js"></script>
</body></html>
